      - not_null:
          column_name: "loc_key"
  - name: stg_dump_loc__unit_set_to_mp_unit_caps
    description: "Noms des groupes de caps (source : text/db/unit_set_to_mp_unit_caps__.loc.tsv)"
    data_tests:
      - unique:
          column_name: "loc_key"
      - not_null:
          column_name: "loc_key"
  - name: stg_dump_loc__unit_abilities
    description: "Noms des capacités et sorts (source : text/db/unit_abilities__.loc.tsv)"
    data_tests:
      - unique:
