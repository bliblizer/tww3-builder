      - not_null:
          column_name: "loc_key"
  - name: stg_dump_loc__ancillaries
    description: "Noms des objets (source : text/db/ancillaries__.loc.tsv)"
    data_tests:
      - unique:
          column_name: "loc_key"
      - not_null:
          column_name: "loc_key"
  - name: stg_dump_loc__ui_unit_bullet_point_enums
    description: "Libellés forces/faiblesses (phase ultérieure) (source : text/db/ui_unit_bullet_point_enums__.loc.tsv)"
    data_tests:
      - unique:
          column_name: "loc_key"
      - not_null:
          column_name: "loc_key"
  - name: stg_loc_texts
    description: "Tous les textes du jeu, renvois vers d autres textes résolus (resolved_text)."
    data_tests:
      - unique:
          column_name: loc_key
  - name: stg_dump__unit_variants
    description: "Image de carte (unit_card = fichier de ui/units/icons/) de chaque land unit, éventuellement propre à une faction (source : db/unit_variants_tables/data__.tsv)"
    data_tests:
      - unique:
          column_name: "land_unit_key || '|' || coalesce(faction_key, '')"
    columns:
      - name: unit_card
        data_tests: [not_null]
