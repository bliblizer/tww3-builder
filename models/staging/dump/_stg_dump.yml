      - not_null:
          column_name: "loc_key"
  - name: stg_dump_loc__ui_text_replacements
    description: "Textes de remplacement référencés par les renvois tr (ex. Vanguard Deployment) (source : text/db/ui_text_replacements__.loc.tsv)"
    data_tests:
