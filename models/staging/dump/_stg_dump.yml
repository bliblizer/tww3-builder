    data_tests:
      - unique:
          column_name: "loc_key"
      - not_null:
          column_name: "loc_key"
  - name: stg_dump_loc__ui_unit_group_parents
    description: "Noms des onglets (source : text/db/ui_unit_group_parents__.loc.tsv)"
    data_tests:
      - unique:
          column_name: "loc_key"
      - not_null:
          column_name: "loc_key"
  - name: stg_dump_loc__ui_unit_groupings
    description: "Noms des sous-groupes (source : text/db/ui_unit_groupings__.loc.tsv)"
    data_tests:
      - unique:
          column_name: "loc_key"
      - not_null:
          column_name: "loc_key"
  - name: stg_dump_loc__units_custom_battle_mounts
    description: "Noms des montures (source : text/db/units_custom_battle_mounts__.loc.tsv)"
    data_tests:
      - unique:
