version: 2

models:
  - name: pvp_races
    description: "Races jouables en PvP (1 ligne par race) et taille de leur roster."
    columns:
      - name: race_key
        data_tests: [unique, not_null]
      - name: race_name
        data_tests: [unique, not_null]

  - name: pvp_roster_cards
    description: >
      Cartes du builder PvP : 1 carte = 1 unité de base + ses options jouables. Colonnes calculées après le filtre PvP.
      has_variant_choice / has_mount_choice = au moins deux valeurs différentes parmi les options PvP de la carte.
    columns:
      - name: card_id
        data_tests: [unique, not_null]
      - name: card_name
        data_tests: [not_null]
      - name: race_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('pvp_races')
                field: race_key
      - name: tab_name
        data_tests: [not_null]
      - name: tab_order
        data_tests: [not_null]
      - name: min_cost
        data_tests: [not_null]
      - name: root_unit_card
        description: "Image de la carte (unité racine) : fichier ui/units/icons/<root_unit_card>.png du jeu."
        data_tests: [not_null]

  - name: pvp_roster_options
    description: >
      Options jouables de chaque carte : 1 ligne par race x unité sélectionnable en PvP.
      unit_key = clé enregistrée dans les fichiers .army_setup. mount = « On foot » pour la version à pied quand la carte propose des montures.
    data_tests:
      - unique:
          column_name: "race_key || '|' || unit_key"
    columns:
      - name: card_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('pvp_roster_cards')
                field: card_id
      - name: unit_name
        data_tests: [not_null]
      - name: multiplayer_cost
        data_tests: [not_null]
      - name: unit_card
        description: "Image de l'option : fichier ui/units/icons/<unit_card>.png du jeu."
        data_tests: [not_null]
      - name: image_source
        description: "card = image ui/units/icons/<unit_card>.png ; portrait = ui/portraits/units/…/<portrait_image>.png (personnages à carte générique)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['card', 'portrait']
      - name: role
        description: "Rôle dans la composition (lord, hero, infantry_light / line / elite, ranged, artillery, cavalry, monster, war_beast, other)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['lord', 'hero', 'infantry_light', 'infantry_line', 'infantry_elite', 'ranged', 'artillery', 'cavalry', 'monster', 'war_beast', 'other']

  - name: pvp_cap_groups
    description: "Groupes de caps par race : plafond par défaut (nombre total d'unités membres autorisées dans l'armée)."
    data_tests:
      - unique:
          column_name: "race_key || '|' || unit_set_key"
    columns:
      - name: default_cap
        data_tests: [not_null]
      - name: cap_group_name
        data_tests: [not_null]

  - name: pvp_cap_group_members
    description: "Unités jouables membres de chaque groupe de caps, par race."
    data_tests:
      - unique:
          column_name: "race_key || '|' || unit_set_key || '|' || unit_key"

  - name: pvp_cap_overrides
    description: "Plafonds spéciaux liés à un personnage présent dans l'armée (général ou héros) ; plafond effectif = max(défaut, plafonds spéciaux présents)."
    data_tests:
      - unique:
          column_name: "race_key || '|' || unit_set_key || '|' || general_card_id"

  - name: pvp_army_rules
    description: "Budget (12 400) et nombre maximal d'unités (20) d'une armée PvP 1v1, lus dans les tables du jeu."

  - name: pvp_character_upgrades
    description: >
      Sorts, capacités et objets proposés dans le panneau de personnalisation de chaque personnage jouable (hypothèses
      vérifiées sur le panneau de Neferata). cost : capacités selon la rareté, objets selon uniqueness_score, sorts inconnus.
    data_tests:
      - unique:
          column_name: "race_key || '|' || unit_key || '|' || upgrade_type || '|' || upgrade_key"
    columns:
      - name: upgrade_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['spell', 'ability', 'item']

  - name: pvp_unit_tags
    description: "Étiquettes forces / faiblesses de chaque unité jouable, comme dans le jeu."
    data_tests:
      - unique:
          column_name: "unit_key || '|' || bullet_point_key"

  - name: pvp_xp_ranks
    description: "Rangs d'expérience 0-9 : multiplicateur et coût fixe multijoueur (formule de prix supposée)."
    columns:
      - name: rank
        data_tests: [unique, not_null]
