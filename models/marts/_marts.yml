version: 2

models:
  - name: pvp_races
    description: "Races jouables en PvP (1 ligne par race) et taille de leur roster."
    columns:
      - name: race_key
        data_tests: [unique, not_null]
      - name: race_name
        data_tests: [unique, not_null]

  - name: pvp_roster_cards
    description: >
      Cartes du builder PvP : 1 carte = 1 unité de base + ses options jouables. Colonnes calculées après le filtre PvP.
      has_variant_choice / has_mount_choice = au moins deux valeurs différentes parmi les options PvP de la carte.
    columns:
      - name: card_id
        data_tests: [unique, not_null]
      - name: card_name
        data_tests: [not_null]
      - name: race_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('pvp_races')
                field: race_key
      - name: tab_name
        data_tests: [not_null]
      - name: tab_order
        data_tests: [not_null]
      - name: min_cost
        data_tests: [not_null]
      - name: root_unit_card
        description: "Image de la carte (unité racine) : fichier ui/units/icons/<root_unit_card>.png du jeu."
        data_tests: [not_null]

  - name: pvp_roster_options
    description: >
      Options jouables de chaque carte : 1 ligne par race x unité sélectionnable en PvP.
      unit_key = clé enregistrée dans les fichiers .army_setup. mount = « On foot » pour la version à pied quand la carte propose des montures.
    data_tests:
      - unique:
          column_name: "race_key || '|' || unit_key"
    columns:
      - name: card_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('pvp_roster_cards')
                field: card_id
      - name: unit_name
        data_tests: [not_null]
      - name: multiplayer_cost
        data_tests: [not_null]
      - name: unit_card
        description: "Image de l'option : fichier ui/units/icons/<unit_card>.png du jeu."
        data_tests: [not_null]

  - name: pvp_cap_groups
    description: "Groupes de caps par race : plafond par défaut (nombre total d'unités membres autorisées dans l'armée)."
    data_tests:
      - unique:
          column_name: "race_key || '|' || unit_set_key"
    columns:
      - name: default_cap
        data_tests: [not_null]
      - name: cap_group_name
        data_tests: [not_null]

  - name: pvp_cap_group_members
    description: "Unités jouables membres de chaque groupe de caps, par race."
    data_tests:
      - unique:
          column_name: "race_key || '|' || unit_set_key || '|' || unit_key"

  - name: pvp_cap_overrides
    description: "Plafonds spéciaux liés à un personnage présent dans l'armée (général ou héros) ; plafond effectif = max(défaut, plafonds spéciaux présents)."
    data_tests:
      - unique:
          column_name: "race_key || '|' || unit_set_key || '|' || general_card_id"

  - name: pvp_army_rules
    description: "Budget (12 400) et nombre maximal d'unités (20) d'une armée PvP 1v1, lus dans les tables du jeu."
