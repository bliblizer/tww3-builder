version: 2

seeds:
  - name: test_armies
    description: "Armées de test : compositions sauvegardées en jeu (.army_setup) et cas construits pour chaque règle."
    config:
      column_types: {army_id: varchar, race_key: varchar, slot: integer, unit_key: varchar}
  - name: test_army_expectations
    description: "Verdict attendu pour chaque armée de test (codes d'erreur triés, séparés par |)."
    config:
      column_types: {army_id: varchar, description: varchar, expected_valid: boolean, expected_errors: varchar}
  - name: test_army_selected_upgrades
    description: "Sorts, capacités (type 0) et objets (type 2) cochés dans les fichiers .army_setup de test."
    config:
      column_types: {army_id: varchar, slot: integer, item_type: integer, upgrade_key: varchar}
  - name: test_army_all_selected
    description: "Armées de test enregistrées en jeu avec « Tout sélectionner » sur chaque personnage."
    config:
      column_types: {army_id: varchar}
  - name: test_unit_prices
    description: "Prix d'unités personnalisées relevés en jeu (1 ligne par élément coché ; upgrade_key vide = rien de coché)."
    config:
      column_types: {case_id: varchar, race_key: varchar, unit_key: varchar, upgrade_key: varchar, expected_price: integer, description: varchar}
