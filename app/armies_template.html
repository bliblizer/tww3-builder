 <div class="head">

<script>
const DATA = /*__DATA__*/null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Math.round(n).toLocaleString('en-US');
const img = p => p ? 'images/' + p.split('/').map(encodeURIComponent).join('/') : '';
const initials = n => n.replace(/\(.*?\)/g, '').split(/[\s-]+/).filter(w => /^[A-Za-zÀ-ÿ]/.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join('');
const raceOf = k => DATA.races.find(r => r.key === k);
$('patchTxt').textContent = DATA.patch.replace('patch_', 'patch ');

/* ---------- Stockage (même clé que le bouton Save du builder) ----------
   armée : { id, name, r, a, m, cost, units, saved, updated, patch, fav, folder, tags[], source } */
const KEY = 'tww3-builder:armies', FKEY = 'tww3-builder:folders';
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || d); } catch { return JSON.parse(d); } };
let armies = load(KEY, '[]'), folders = load(FKEY, '[]');
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(armies)); localStorage.setItem(FKEY, JSON.stringify(folders)); return true; }
  catch { toast('Could not save in this browser (storage full or blocked).', true); return false; }
}

/* ---------- Règles et coûts : mêmes calculs que le builder ---------- */
const OPTS = {};   // race -> unité -> { card, opt }
DATA.races.forEach(r => { OPTS[r.key] = {}; (DATA.roster[r.key] || []).forEach(card => card.opts.forEach(opt => { OPTS[r.key][opt.u] = { card, opt }; })); });
const SPELL_STEP = DATA.spellStep;
const canRank = o => !o.rn && o.role !== 'lord' && o.role !== 'hero';
const rankedBase = (c, rank) => Math.round(c * DATA.xp[rank][0]) + DATA.xp[rank][1];
function upgradesCost(sel, rk) {
  const ups = DATA.up[rk] || {}; let other = 0; const spells = [];
  sel.forEach(k => { const u = ups[k]; if (!u) return; if (u[0] === 's') spells.push(u[1] || 0); else other += u[1] || 0; });
  spells.sort((a, b) => b - a);
  return other + Math.floor(spells.reduce((s, c, k) => s + c * (1 - SPELL_STEP * k), 0));
}
const unitCost = (u, rk) => (canRank(u.opt) ? rankedBase(u.opt.c, u.rank) : u.opt.c) + upgradesCost(u.sel, rk);
const capsOf = rk => DATA.caps[rk] || { g: {}, m: {}, o: {} };
function validate(rk, army, cost) {
  const out = [];
  if (!(army.length && army[0].opt.l && army[0].opt.g)) out.push('No general: the first unit must be a lord');
  if (army.filter(u => u.opt.l).length > 1) out.push('More than one lord');
  if (army.length > DATA.maxUnits) out.push(`Too many units (${army.length} / ${DATA.maxUnits})`);
  if (cost > DATA.budget) out.push(`Over budget (${fmt(cost)} / ${fmt(DATA.budget)})`);
  const c = capsOf(rk), n = {};
  army.forEach(u => (c.m[u.opt.u] || []).forEach(k => { n[k] = (n[k] || 0) + 1; }));
  Object.entries(n).forEach(([k, cnt]) => {
    let cap = c.g[k][1]; army.forEach(u => { const ov = c.o[u.card.id]; if (ov && ov[k] != null) cap = Math.max(cap, ov[k]); });
    if (cnt > cap) out.push(`Unit cap exceeded: ${c.g[k][0]} (${cnt} / ${cap})`);
  });
  return out;
}
function decode(rk, text) {
  const by = OPTS[rk] || {}, army = [], missing = [];
  (text || '').split(',').filter(Boolean).forEach(part => {
    const [u, rank, mask] = part.split('~'), hit = by[u];
    if (!hit) { missing.push(u); return; }
    const m = BigInt('0x' + (mask || '0')), up = hit.opt.up || [];
    army.push({ card: hit.card, opt: hit.opt, sel: new Set(up.filter((k, i) => (m >> BigInt(i)) & 1n)), rank: canRank(hit.opt) ? Math.min(9, Number(rank) || 0) : 0 });
  });
  const lord = army.findIndex(u => u.opt.l); if (lord > 0) army.unshift(army.splice(lord, 1)[0]);
  return { army, missing };
}
function encode(army) {

      if (!rk || !OPTS[rk]) { bad.push(f.name); continue; }
      const by = OPTS[rk], army = [];
      d.units.forEach(x => { const hit = by[x.unitKey]; if (hit) army.push({ card: hit.card, opt: hit.opt, sel: new Set(x.items.filter(k => (hit.opt.up || []).includes(k))), rank: canRank(hit.opt) ? Math.min(9, x.rank) : 0 }); });
      const lord = army.findIndex(u => u.opt.l); if (lord > 0) army.unshift(army.splice(lord, 1)[0]);
      const e = { id: newId(), name: f.name.replace(/\.army_setup$/i, '').replace(/_/g, ' '), r: rk, a: encode(army), m: '', source: 'imported' };
      e.cost = info(e).cost; e.units = army.length; addArmy(e); n++;
    } catch { bad.push(f.name); }
  }
  persist(); render();
  toast(n ? `${n} ${n > 1 ? 'armies' : 'army'} imported${bad.length ? `, ${bad.length} file(s) could not be read` : ''}` : 'Nothing imported', !n || bad.length > 0);
}
function importLink(text) {
  try {
    const p = new URLSearchParams(new URL(text.trim(), location.href).hash.slice(1));
    if (!p.get('r') || !p.get('a') || !OPTS[p.get('r')]) throw 0;
    const e = { id: newId(), name: p.get('n') || `${raceOf(p.get('r')).name} army`, r: p.get('r'), a: p.get('a'), m: p.get('m') || '', source: 'link' };
    e.cost = info(e).cost; e.units = info(e).army.length; addArmy(e); persist(); render(); toast('Army added from the link');
  } catch { toast('This is not a link to an army of the builder', true); }
}
function openImport() {
  modal(`<h3>Import armies</h3>
    <div class="drop" id="drop">Drop <b>.army_setup</b> files from the game or a <b>backup</b> file here<br><button class="b sm" id="pick" style="margin-top:8px">Choose files…</button></div>
    <p class="hint">Game folder (Windows): %APPDATA%\\The Creative Assembly\\Warhammer3\\army_setups — you can select several files at once.</p>
    <label for="lnk">Or paste a link to an army of the builder</label><input type="text" id="lnk" placeholder="https://…/index.html#v=1&r=…&a=…">
    <div class="mrow"><button class="b prim" id="lnkOk">Add from link</button><button class="b" onclick="closeModal()">Close</button></div>`);
  const drop = $('drop');
  $('pick').onclick = () => $('fileIn').click();
  drop.ondragover = ev => { ev.preventDefault(); drop.classList.add('over'); }; drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = ev => { ev.preventDefault(); drop.classList.remove('over'); closeModal(); importFiles([...ev.dataTransfer.files]); };
  $('lnkOk').onclick = () => { const v = $('lnk').value; closeModal(); importLink(v); };
}
$('fileIn').onchange = ev => { closeModal(); importFiles([...ev.target.files]); ev.target.value = ''; };
$('importBtn').onclick = openImport;
function backup(list = armies, name = 'my-armies') {
  const data = { app: 'tww3-builder', version: 1, patch: DATA.patch, exported: new Date().toISOString(), folders, armies: list };
  download(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }), `${name}-${new Date().toISOString().slice(0, 10)}.json`);
}
$('backupBtn').onclick = () => { if (!armies.length) return toast('Nothing to back up yet', true); backup(); toast(`Backup downloaded (${armies.length} armies)`); };

/* ---------- Actions groupées ---------- */
$('cmpBtn').onclick = compare;
$('unsel').onclick = () => { sel.clear(); render(); };
$('bulkDelete').onclick = () => removeArmies([...sel]);
$('bulkExport').onclick = () => { backup([...sel].map(byId), 'armies-selection'); toast('Selection exported as a backup file'); };
$('bulkFolder').onclick = () => ask('Move to folder', 'Folder (leave empty for none)', '', v => { [...sel].map(byId).forEach(e => { e.folder = v || undefined; touch(e); }); if (v && !folders.includes(v)) folders.push(v); persist(); render(); }, { list: allFolderNames(), ok: 'Move' });
$('bulkTag').onclick = () => ask('Add a tag', 'Tag', '', v => { const t = v.toLowerCase(); if (!t) return; [...sel].map(byId).forEach(e => { e.tags = [...new Set([...(e.tags || []), t])]; touch(e); }); persist(); render(); });
$('newFolder').onclick = () => ask('New folder', 'Folder name', '', v => { if (v && !folders.includes(v)) { folders.push(v); persist(); render(); } }, { ok: 'Create' });

/* ---------- Événements ---------- */
document.addEventListener('click', ev => {
  const t = ev.target;
  if (!t.closest('.menu') && !t.closest('[data-share]') && !t.closest('[data-more]')) closeMenus();
  if (t === $('modal')) closeModal();
  const c = t.closest('.coll'); if (c) { if (c.dataset.c) F.coll = c.dataset.c; if (c.dataset.f) { F.facs.has(c.dataset.f) ? F.facs.delete(c.dataset.f) : F.facs.add(c.dataset.f); } return render(); }
  if (t.dataset.s) { F.status = F.status === t.dataset.s ? '' : t.dataset.s; return render(); }
  if (t.dataset.o) { F.source = F.source === t.dataset.o ? '' : t.dataset.o; return render(); }
  if (t.dataset.t) { F.tag = F.tag === t.dataset.t ? '' : t.dataset.t; return render(); }
  if (t.dataset.v) { view = t.dataset.v; return render(); }
  const cardEl = t.closest('.card'); if (!cardEl || t.closest('.menu')) return;
  const e = byId(+cardEl.dataset.id); if (!e) return;
  if (t.classList.contains('star')) { e.fav = !e.fav; persist(); render(); return toast(e.fav ? 'Added to favourites' : 'Removed from favourites'); }
  if (t.classList.contains('pick')) { t.checked ? sel.add(e.id) : sel.delete(e.id); return render(); }
  if (t.closest('[data-share]')) return shareMenu(cardEl, e);
  if (t.closest('[data-more]')) return moreMenu(cardEl, e);
});
$('q').addEventListener('input', ev => { F.q = ev.target.value.trim().toLowerCase(); render(); });
$('sort').addEventListener('change', ev => { sort = ev.target.value; render(); });
$('clearBtn').onclick = clearAll;
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { closeMenus(); closeModal(); $('drawer').hidden = true; } });
addEventListener('storage', ev => { if (ev.key === KEY || ev.key === FKEY) { armies = load(KEY, '[]'); folders = load(FKEY, '[]'); cache.clear(); render(); } });   // sauvegarde depuis un autre onglet
render();

/* bandeau du haut collant : les éléments collants de la page se placent dessous (--top-h) */
(() => { const top = document.querySelector('.topbar'); if (!top) return;
  const set = () => document.documentElement.style.setProperty('--top-h', (getComputedStyle(top).position === 'sticky' ? top.offsetHeight : 0) + 'px');
  if ('ResizeObserver' in window) new ResizeObserver(set).observe(top); set(); addEventListener('resize', set); })();
</script>
</body>
