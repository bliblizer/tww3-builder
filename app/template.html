<body>

<header class="topbar">
  <nav class="site-nav" aria-label="Site"><a href="index.html" aria-current="page">Army Builder</a><a href="meta.html" id="metaLink">Faction Guide</a><a href="overview.html">Meta Overview</a></nav>
  <button class="ex-btn" id="templatesBtn" title="Ready-made armies for this race"><span class="ex-ico" aria-hidden="true">📖</span><span class="ex-lbl">Example armies</span><span class="n" id="exCount"></span></button>
  <div class="topbar-right">
  <span class="patch" id="patchPill"></span>
  <div class="race-picker">
    <button class="race-btn" id="raceButton" aria-haspopup="listbox" aria-expanded="false" aria-label="Select race">
      <span class="race-strip" id="raceStrip"></span><span class="race-label serif" id="raceName">—</span><span class="caret">▾</span>
    </button>
    <ul class="race-list" id="raceList" role="listbox" aria-label="Races" hidden></ul>
  </div>
  </div>
</header>
<div class="ban-warn" id="banWarn" role="alert" hidden></div>

<div class="layout" id="layout">
<section class="army" id="armyZone" aria-label="Army">
  <div class="army-head">
    <input class="army-name" id="armyName" placeholder="Main Army" maxlength="60" aria-label="Army name">
    <button class="army-alert" id="armyAlert" hidden></button>
    <div class="toolbar" role="toolbar" aria-label="Army tools">
      <!-- boutons regroupés selon ce sur quoi ils agissent : le jeu, les armées sauvegardées, le partage, l'armée en cours -->
      <div class="tgrp"><span class="cap">Game</span><div class="row">
        <button class="b2" id="importBtn" title="Load a .army_setup file saved by the game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V9"/><path d="M7 13l5-5 5 5"/><path d="M5 4h14"/></svg><span class="lbl">Import</span></button>
        <button class="b2 prim" id="exportBtn" title="Save the army as a .army_setup file for the game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg><span class="lbl">Export to game</span></button>
      </div></div>
      <div class="tgrp"><span class="cap">My armies</span><div class="row">
        <button class="b2" id="saveBtn" title="Save to My armies in this browser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4"/><path d="M8 20v-6h8v6"/></svg><span class="lbl">Save</span></button>
        <button class="b2" id="armiesBtn" title="Open your saved armies"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="lbl">Open</span></button>
      </div></div>
      <div class="tgrp"><span class="cap">Share</span><div class="row">
        <button class="b2" id="shareBtn" title="Copy a link to this army"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span class="lbl">Copy link</span></button>
        <button class="b2 ico" id="pngBtn" title="Download an image of the army (PNG)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg></button>
      </div></div>
      <div class="tgrp"><span class="cap">Edit</span><div class="row">
        <button class="b2 ico" id="undoBtn" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
        <button class="b2 ico" id="redoBtn" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
        <button class="b2 ico danger" id="clearArmy" title="Clear the army"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg></button>
        <span class="more">
          <button class="b2 ico" id="moreBtn" aria-haspopup="menu" aria-expanded="false" title="More: notes, game folder, display, help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
          <div class="menu" id="moreMenu" role="menu" hidden>
            <button class="mi" id="notesBtn" role="menuitem" aria-expanded="false">Notes…</button>
            <button class="mi" id="folderBtn" role="menuitem" hidden>Game folder</button>
            <hr><h5>Display</h5>
            <label class="mi"><span>Tier icons on cards</span><input type="checkbox" class="sw" id="optTiers"></label>
            <hr><button class="mi" id="helpBtn" role="menuitem">Help: use the army in the game</button>
          </div>
        </span>
      </div></div>
      <input type="file" id="importFile" accept=".army_setup" hidden>
    </div>
  </div>
  <textarea class="notes" id="armyNotes" placeholder="Notes about this army (plan, matchups, deployment…)" hidden></textarea>
  <div class="army-body">
    <div class="army-main">
      <div class="slots" id="slots"></div>
      <div class="budget" id="budgetBar" aria-label="Budget by role"></div>
      <div class="preview-bar" id="previewBar" hidden></div>
      <div id="exEmpty"></div>
    </div>
    <div class="tiles">
      <div class="tile funds"><span class="ico" id="fundsIco"></span><span class="l">Funds remaining</span>
        <div><b id="funds">0</b><small id="topBudget"></small></div><div class="tbar"><i id="fundsBar"></i></div></div>
      <div class="tile models"><span class="ico" id="modelsIco"></span><span class="l">Models</span>
        <div><b id="topModels">0</b><small id="modelsSub"></small></div></div>
    </div>
  </div>
</section>

  <aside class="side left">
    <button class="collapse" id="hideLeft" title="Hide unit stats" aria-label="Hide unit stats">◀</button>
    <div id="unitStats" aria-live="polite"></div>
  </aside>
  <main class="center">
    <section class="custom" id="custom" aria-label="Unit customisation" hidden></section>
    <div class="roster">
      <div class="roster-head"><h2 class="serif">Unit Roster</h2><div class="filters" id="filters" role="group" aria-label="Quick filters"></div></div>
      <div class="sections" id="sections"></div>
    </div>
    <p class="footer" id="footer"></p>   <!-- dans la colonne centrale : les panneaux latéraux restent visibles jusqu'en bas de page -->
  </main>
  <aside class="side right">
    <button class="collapse" id="hideRight" title="Hide analysis" aria-label="Hide analysis">▶</button>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabComp" aria-selected="true">Composition</button>
      <button class="tab" role="tab" id="tabMatch" aria-selected="false">Matchup</button>
      <button class="tab" role="tab" id="tabCaps" aria-selected="false">Caps</button>
    </div>
    <div class="caps-tab" id="capsTab" hidden><div class="caps" id="capsBar"></div>
      <p class="muted" style="margin-top:8px">Caps reached are shown in gold, exceeded in red.</p></div>
    <div id="composition" aria-label="Army composition statistics"></div>
    <div class="matchup" id="matchup" hidden>
      <select id="enemySelect" aria-label="Opponent race"></select>
      <div id="radar"></div>
      <div class="radar-legend"><i style="background:var(--gold)"></i>Your army<i style="background:#5b8fd6"></i><span id="enemyLegend">Opponent roster</span></div>
      <details class="keypoints" id="keypoints" open><summary>Key points</summary><div id="kpList"></div></details>
    </div>
  </aside>
</div>
<button class="reopen left" id="showLeft" hidden title="Show unit stats">▶</button>
<button class="reopen right" id="showRight" hidden title="Show analysis">◀</button>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="preview" id="preview" hidden></div>

<div class="modal" id="modal" hidden><div class="modal-box" role="dialog" aria-modal="true">
  <button class="modal-close" id="modalClose" aria-label="Close">×</button><div id="modalBody"></div></div></div>
<div class="tip" id="tip" role="tooltip" hidden></div>

<script>
const DATA = /*__DATA__*/null;

/* ---------- État ----------
   army  : unités de l'armée { card, opt, sel, rank } (sel = clés des sorts / capacités / objets cochés ; rank = 0 à 9)
   focus : unité affichée dans les panneaux { kind: 'army' | 'roster', unit } ('roster' = brouillon pas encore ajouté) */
const state = { raceIndex: 0, army: [], focus: null, name: '', notes: '', enemy: '', filters: new Set(), preview: null };
const DIMS = ['lore', 'mark', 'spirit', 'other', 'mount'];
const DIM_CAT = { lore: 'type_spell_lore', mark: 'type_mark', spirit: 'type_forest_spirit' };
const UPGRADE_SECTIONS = [['s', 'Spells'], ['a', 'Abilities'], ['i', 'Items']];
const ROLES = [   // rôles de la composition (calculés dans pvp_roster_options.role)
  ['lord', 'Lord'], ['hero', 'Heroes'], ['infantry_light', 'Trash infantry (tier I)'], ['infantry_line', 'Line infantry (tier II)'],
  ['infantry_elite', 'Elite infantry (tier III+)'], ['ranged', 'Ranged'], ['artillery', 'Artillery'], ['cavalry', 'Cavalry & chariots'],
  ['monster', 'Monsters'], ['war_beast', 'War beasts'], ['other', 'Other']
];
const TAB_COLORS = {
  commander: '#5a2a3a', heroes_agents: '#4a2f50', infantry: '#3e3a2c', missile_infantry: '#2f4038',
  cavalry_chariots: '#4a3424', missile_cavalry_chariots: '#3a4026', monster_beasts: '#2c3a48',
  constructs: '#3d3d3d', flying_war_machine: '#30404a', missile_monster_beasts: '#2a4340',
  artillery_war_machines: '#45392a', campaign_exclusives: '#333'
};
const CLICK_DELAY = 260;
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V'];
const statOf = (unitKey, col) => { const r = DATA.stats[unitKey]; return r ? r[DATA.statCols.indexOf(col)] : null; };   // ms : un clic simple attend la fin d'un éventuel double-clic avant d'ouvrir les panneaux
const $ = id => document.getElementById(id);
const fmt = n => String(Math.round(n));   // comme en jeu : pas de séparateur de milliers
const race = () => DATA.races[state.raceIndex];
const roster = () => DATA.roster[race().key] || [];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const initials = name => name.replace(/\(.*?\)/g, '').split(/[\s-]+/).filter(w => /^[A-Za-zÀ-ÿ]/.test(w))
  .slice(0, 2).map(w => w[0].toUpperCase()).join('');
const optionLabel = o => DIMS.map(k => o[k]).filter(Boolean).join(', ');
const hasChoice = (card, k) => new Set(card.opts.map(o => o[k] ?? '')).size > 1;
const isCustomisable = card => DIMS.some(k => hasChoice(card, k)) || card.opts.some(o => (o.up || []).length);
const dimTitle = (card, k) => k === 'mount' ? 'Mounts'
  : k === 'other' ? (DATA.typeCats[card.opts.find(o => o.ovc)?.ovc] || 'Variant')
  : (DATA.typeCats[DIM_CAT[k]] || k);

/* ---------- Coûts (même formule que models/validation/unit_price_checks.sql, testée sur 8 prix relevés en jeu) ----------
   - prix de base de l'option (monture comprise) ; rang r : arrondi(prix x multiplicateur_r) + coût fixe_r (hypothèse)
   - capacités et objets cochés : grille de rareté (common 100, uncommon 150, rare 200, legendary 200)
   - sorts cochés : arrondi inférieur de somme(prix de rareté du k-ième sort x (1 - 0,047 k)), du plus cher au moins cher */
const SPELL_STEP = 0.047;
const upgradesOf = raceKey => (DATA.up[raceKey] || {});
const defaultSel = () => new Set();   // par défaut, aucun sort / capacité / objet n'est coché
const rankedBase = (c, rank) => Math.round(c * DATA.xp[rank][0]) + DATA.xp[rank][1];
function upgradesCost(sel, raceKey = race().key) {
  const ups = upgradesOf(raceKey);
  let other = 0; const spells = [];
  sel.forEach(k => { const u = ups[k]; if (!u) return; if (u[1] === 's') spells.push(u[2] || 0); else other += u[2] || 0; });
  spells.sort((a, b) => b - a);
  return other + Math.floor(spells.reduce((s, c, k) => s + c * (1 - SPELL_STEP * k), 0));
}
/* expérience : achetable seulement pour les unités de base. Lords et héros : jamais. Régiments de Renom : rang 9
   fixe, déjà compris dans leur prix de base (aucun surcoût). */
const canRank = opt => !opt.rn && opt.role !== 'lord' && opt.role !== 'hero';
const shownRank = u => (u.opt.rn ? 9 : canRank(u.opt) ? u.rank : 0);
const unitCost = u => (canRank(u.opt) ? rankedBase(u.opt.c, u.rank) : u.opt.c) + upgradesCost(u.sel);
const newUnit = (card, opt, rank = 0) => ({ card, opt, sel: defaultSel(), rank });
const spent = () => state.army.reduce((s, u) => s + unitCost(u), 0);
const remaining = () => DATA.budget - spent();

/* ---------- Règles de l'armée ----------
   Même spécification que models/validation/army_validation.sql (testée sur les mêmes armées de test) :
   NO_GENERAL, MULTIPLE_LORDS, TOO_MANY_UNITS, OVER_BUDGET, CAP_EXCEEDED:<groupe>, UNIT_NOT_AVAILABLE.
   - une armée a un seul lord, en première place, et c'est le général ; choisir un lord remplace le précédent ;
   - plafond effectif d'un groupe = max(plafond par défaut, plafonds spéciaux des personnages présents). */
const capsOf = raceKey => DATA.caps[raceKey] || { g: {}, m: {}, o: {} };
const generalOf = army => (army.length && army[0].opt.l && army[0].opt.g ? army[0] : null);
const lordIndex = army => army.findIndex(u => u.opt.l);
function effectiveCap(raceKey, setKey, army) {
  const c = capsOf(raceKey);
  let cap = c.g[setKey][1];
  army.forEach(u => { const ov = c.o[u.card.id]; if (ov && ov[setKey] != null) cap = Math.max(cap, ov[setKey]); });
  return cap;
}
function capCounts(raceKey, army) {
  const n = {};
  army.forEach(u => (capsOf(raceKey).m[u.opt.u] || []).forEach(k => { n[k] = (n[k] || 0) + 1; }));
  return n;
}
function validate(raceKey, army, costOf = unitCost) {
  const errors = [];
  if (!generalOf(army)) errors.push({ code: 'NO_GENERAL', text: 'The first unit must be a lord who can lead the army.' });
  if (army.filter(u => u.opt.l).length > 1) errors.push({ code: 'MULTIPLE_LORDS', text: 'An army can only have one lord.' });
  if (army.length > DATA.maxUnits) errors.push({ code: 'TOO_MANY_UNITS', text: `Too many units (${army.length}/${DATA.maxUnits}).` });
  const cost = army.reduce((s, u) => s + costOf(u), 0);
  if (cost > DATA.budget) errors.push({ code: 'OVER_BUDGET', text: `Over budget (${fmt(cost)} / ${fmt(DATA.budget)}).` });
  const counts = capCounts(raceKey, army);
  Object.entries(counts).forEach(([k, n]) => {
    const cap = effectiveCap(raceKey, k, army);
    if (n > cap) errors.push({ code: 'CAP_EXCEEDED:' + k, text: `Unit cap exceeded: ${capsOf(raceKey).g[k][0]} (${n}/${cap}).` });
  });
  return errors;
}
function withAdded(army, unit) {
  const next = army.slice();
  if (unit.opt.l) { const i = lordIndex(next); if (i >= 0) next.splice(i, 1); next.unshift(unit); } else next.push(unit);
  return next;
}
/* problème créé par le passage de l'armée « before » à « after » ('' si aucun) : { kind, text } */
function newProblem(before, after) {
  const rk = race().key, had = new Set(validate(rk, before).map(e => e.code));
  const created = validate(rk, after).filter(e => !had.has(e.code) && e.code !== 'NO_GENERAL');
  if (!created.length) return null;
  const e = created[0];
  if (e.code === 'TOO_MANY_UNITS') return { kind: 'full', text: `Army is full (${DATA.maxUnits} units).` };
  if (e.code === 'OVER_BUDGET') return { kind: 'funds', text: 'Not enough funds.' };
  if (e.code.startsWith('CAP_EXCEEDED:')) {
    const k = e.code.slice('CAP_EXCEEDED:'.length);
    return { kind: 'cap', text: `Unit cap reached: ${capsOf(rk).g[k][0]} (${capCounts(rk, before)[k] || 0}/${effectiveCap(rk, k, after)}).` };
  }
  return { kind: 'other', text: e.text };
}
function addReason(unit) {
  if (unit.opt.l && !unit.opt.g) return 'This lord cannot lead an army of this race.';
  const p = newProblem(state.army, withAdded(state.army, unit));
  return p ? p.text : '';
}
/* points d'entrée de test (scripts/test_app.py) */
window.builderValidate = (raceKey, unitKeys) => {   // liste de clés (format .army_setup), au prix de base
  const byKey = {};
  (DATA.roster[raceKey] || []).forEach(card => card.opts.forEach(opt => { byKey[opt.u] = { card, opt }; }));
  const army = unitKeys.map(k => byKey[k] || { card: { id: null }, opt: { u: k, c: 0, g: false, l: false }, unknown: true });
  const codes = new Set(validate(raceKey, army, u => u.opt.c).map(e => e.code));
  if (army.some(u => u.unknown)) codes.add('UNIT_NOT_AVAILABLE');
  return [...codes].sort().join('|');
};
window.builderPrice = (raceKey, unitKey, upgradeKeys) => {   // prix d'une option avec les éléments cochés
  const opt = (DATA.roster[raceKey] || []).flatMap(c => c.opts).find(o => o.u === unitKey);
  return opt ? opt.c + upgradesCost(new Set(upgradeKeys), raceKey) : null;
};

/* ---------- Actions ---------- */
function addUnit(unit) {
  const reason = addReason(unit);
  if (reason) { flash(reason); return false; }
  const added = { ...unit, sel: new Set(unit.sel) };
  commit();
  state.army = withAdded(state.army, added);
  state.focus = { kind: 'army', unit: added };
  renderAll();
  return true;
}
function removeUnit(unit) {
  commit();
  state.army = state.army.filter(u => u !== unit);
  if (state.focus && state.focus.unit === unit) state.focus = { kind: 'roster', unit: newUnit(unit.card, unit.opt) };
  renderAll();
}
function replaceUnit(unit, changed) {   // modification d'une unité (option, sélection) : refusée si elle crée un problème
  if (state.focus.kind === 'army') {
    const next = state.army.map(u => (u === unit ? changed : u));
    const p = newProblem(state.army, next);
    if (p && (p.kind === 'funds' || p.kind === 'cap')) { flash(p.text); return false; }
    commit();
    state.army = next;
  }
  state.focus = { kind: state.focus.kind, unit: changed };
  renderAll();
  return true;
}
function setRank(unit, rank) {
  rank = Math.max(0, Math.min(DATA.xp.length - 1, rank));
  const changed = { ...unit, rank };
  const next = state.army.map(u => (u === unit ? changed : u));
  const p = newProblem(state.army, next);
  if (p && rank > unit.rank) { flash(p.text); return; }
  commit();
  state.army = next;
  if (state.focus && state.focus.unit === unit) state.focus = { kind: 'army', unit: changed };
  renderAll();
}
const draftFor = card => (state.focus && state.focus.kind === 'roster' && state.focus.unit.card === card)
  ? state.focus.unit : newUnit(card, card.opts[0]);
function flash(text, ok = false) {   // notification en bas à droite ; ok = réussite (vert), sinon avertissement (rouge)
  const t = document.createElement('div'); t.className = 'toast' + (ok ? ' ok' : ''); t.textContent = (ok ? '✓ ' : '') + text;
  $('toasts').appendChild(t);
  setTimeout(() => t.remove(), 3800);
  while ($('toasts').children.length > 3) $('toasts').firstChild.remove();
}
/* clic simple / double-clic sur une carte : le clic simple attend CLICK_DELAY pour ne pas déplacer la page
   (apparition du panneau) entre les deux clics d'un double-clic */
function bindClicks(el, onSingle, onDouble) {
  let timer = null;
  el.addEventListener('click', () => { clearTimeout(timer); timer = setTimeout(onSingle, CLICK_DELAY); });
  el.addEventListener('dblclick', () => { clearTimeout(timer); onDouble(); });
}

/* ---------- Carte d'unité ---------- */
function cardEl(card, { cost, label = '', img = null, rank = 0, opt = card.opts[0] }) {
  const b = document.createElement('button');
  const sk = DATA.skin || {};
  const skinned = !!sk.frame;
  b.className = 'card' + (img ? ' has-img' : '') + (skinned ? ' skinned' : '');
  const isChar = opt.role === 'lord' || opt.role === 'hero';
  const semi = opt.rn ? sk.semiRenown : isChar ? sk.semiHero : sk.semi;
  const skinHtml = !skinned ? '' :
    `<img class="ov ov-frame" src="images/${esc(sk.frame)}" alt="" draggable="false">` +
    (sk.selected ? `<img class="ov ov-selected" src="images/${esc(sk.selected)}" alt="" draggable="false">` : '') +
    (sk.hover ? `<img class="ov ov-hover" src="images/${esc(sk.hover)}" alt="" draggable="false">` : '') +
    (semi ? `<img class="semi" src="images/${esc(semi)}" alt="" draggable="false">` : '') +
    (opt.ic ? `<img class="cat-icon" src="images/${esc(opt.ic)}" alt="" draggable="false">` : '');
  b.style.setProperty('--card-bg', TAB_COLORS[card.t] || '#4a2c2a');
  b.draggable = true;
  const tier = rank ? Math.ceil(rank / 3) : 0, n = rank ? ((rank - 1) % 3) + 1 : 0;
  const xpImg = rank && sk.xp && sk.xp[rank];
  const chev = !rank ? '' : xpImg ? `<img class="xp-img" src="images/${esc(xpImg)}" alt="" title="Rank ${rank}" draggable="false">`
    : `<span class="chevrons" style="--chev:${['', '#c9874a', '#d8dde3', '#f2c94c'][tier]}" title="Rank ${rank}">${'<i></i>'.repeat(n)}</span>`;
  b.innerHTML =
    `<span class="cost">${fmt(cost)}</span>` +
    chev + (opt.role !== 'lord' && opt.role !== 'hero' && statOf(opt.u, 'tier')
      ? (sk.tier && sk.tier[statOf(opt.u, 'tier')]
          ? `<img class="tier-img" src="images/${esc(sk.tier[statOf(opt.u, 'tier')])}" alt="" title="Tier ${ROMAN[statOf(opt.u, 'tier')]}">`
          : `<span class="tier" title="Tier ${statOf(opt.u, 'tier')}">${ROMAN[statOf(opt.u, 'tier')]}</span>`) : '') +
    (img ? `<img class="art" src="images/${esc(img)}" alt="" loading="lazy" draggable="false">` : '') + skinHtml +
    `<span class="mono serif">${esc(initials(card.n))}</span><span class="nm">${esc(card.n)}</span>`;
  b.title = card.n + (label ? ' (' + label + ')' : '') + (rank ? ` – rank ${rank}` : '');
  b.setAttribute('aria-label', `${card.n}${label ? ' (' + label + ')' : ''}, ${fmt(cost)}`);
  const art = b.querySelector('.art');
  if (art) art.addEventListener('error', () => { art.remove(); b.classList.remove('has-img'); });
  return b;
}

/* ---------- Rendu : bandeau, armée ---------- */
function renderTop() {
  $('raceName').textContent = race().name;
  $('raceStrip').style.backgroundImage = race().race_image ? `url("images/${race().race_image}")` : 'none';
  const f = $('funds');
  f.textContent = fmt(remaining());
  f.classList.toggle('over', remaining() < 0);
  $('topBudget').textContent = ` / ${fmt(DATA.budget)}`;
  $('fundsBar').style.width = Math.max(0, Math.min(100, 100 * spent() / DATA.budget)) + '%';
  $('fundsIco').innerHTML = DATA.skin.coin ? `<img src="images/${esc(DATA.skin.coin)}" alt="">` : '<span class="coin"></span>';
  $('modelsIco').innerHTML = DATA.skin.entitySmall ? `<img src="images/${esc(DATA.skin.entitySmall)}" alt="">` : '';
  $('topModels').textContent = fmt(state.army.reduce((s, u) => s + (statOf(u.opt.u, 'unit_size') || 0), 0));
  $('modelsSub').textContent = state.army.length ? ` in ${state.army.length} unit${state.army.length > 1 ? 's' : ''}` : '';
  $('patchPill').innerHTML = `Game data <b>${esc(DATA.patch.replace('patch_', 'patch '))}</b>`;
  const errs = state.army.length ? validate(race().key, state.army) : [];
  const al = $('armyAlert');
  al.hidden = !errs.length;
  al.textContent = `⚠ ${errs.length} issue${errs.length > 1 ? 's' : ''}`;
  al.title = errs.map(e => e.text).join('\n');
  al.onclick = errs.length ? () => openModal(`<h3 class="serif">Army issues</h3><ul>${errs.map(e => `<li>${esc(e.text)}</li>`).join('')}</ul>`) : null;
}

function renderArmy() {
  const slots = $('slots');
  slots.innerHTML = '';
  const general = generalOf(state.army);
  state.army.forEach((u, i) => {
    const slot = document.createElement('div'); slot.className = 'slot';
    const el = cardEl(u.card, { cost: unitCost(u), label: optionLabel(u.opt), img: u.opt.img || u.card.img, rank: shownRank(u), opt: u.opt });
    if (u === general) { el.classList.add('is-general'); el.title += ' – army general'; }
    if (state.focus && state.focus.unit === u) el.classList.add('selected');
    el.dataset.armyIndex = String(i);
    slot.dataset.armyIndex = String(i);
    bindClicks(el, () => setFocus({ kind: 'army', unit: u }), () => removeUnit(u));
    el.addEventListener('dragstart', e => { drag = { from: 'army', unit: u }; e.dataTransfer.setData('text/plain', 'army'); e.dataTransfer.effectAllowed = 'move'; });
    el.addEventListener('dragend', () => { drag = null; });
    slot.append(el);
    if (canRank(u.opt)) {   // boutons d'expérience : unités de base uniquement
      const ctl = document.createElement('div'); ctl.className = 'rank-ctl';
      ctl.innerHTML = `<button aria-label="Remove a rank" ${u.rank === 0 ? 'disabled' : ''}>−</button><span title="Experience rank">${u.rank}</span>` +
        `<button aria-label="Add a rank" ${u.rank >= DATA.xp.length - 1 ? 'disabled' : ''}>+</button>`;
      const [minus, , plus] = ctl.children;
      minus.addEventListener('click', () => setRank(u, u.rank - 1));
      plus.addEventListener('click', () => setRank(u, u.rank + 1));
      slot.append(ctl);
    }
    slots.appendChild(slot);
  });
  for (let i = state.army.length; i < DATA.maxUnits; i++) {
    const e = document.createElement('div'); e.className = 'slot-empty' + (DATA.skin.slot ? ' skin' : ''); e.setAttribute('aria-hidden', 'true');
    if (DATA.skin.slot) e.style.setProperty('--slot-img', `url("images/${DATA.skin.slot}")`);
    slots.appendChild(e);
  }
  const rk = race().key, army = state.army, bar = $('capsBar');
  renderMatchup();
  renderBudget();
  const counts = capCounts(rk, army);
  const chips = Object.entries(counts).map(([k, n]) => ({ k, n, cap: effectiveCap(rk, k, army) }))
    .sort((a, b) => (b.n / b.cap) - (a.n / a.cap) || a.k.localeCompare(b.k));
  bar.innerHTML = chips.length ? chips.map(c => `<span class="cap-chip ${c.n > c.cap ? 'over' : c.n === c.cap ? 'full' : ''}">${esc(capsOf(rk).g[c.k][0])} ${c.n}/${c.cap}</span>`).join('')
    : '<p class="empty">No unit cap in use yet.</p>';

}

/* budget de l'armée par rôle, sous les cartes : une barre épaisse, un segment par rôle avec son icône.
   Segment ≥ 11 % : icône + rôle + montant + % ; 5 à 11 % : icône + % ; < 5 % : icône seule (détail au survol). */
const ROLE_ICONS = {
  lord: '<path d="M4 17l2-9 4 4 2-6 2 6 4-4 2 9z"/><path d="M4 20h16"/>',
  inf: '<path d="M5 19l9-9"/><path d="M14 4h6v6l-9 9-6-6z"/><path d="M8 13l3 3"/>',
  ranged: '<path d="M5 19C5 10 10 5 19 5"/><path d="M5 19L19 5"/><path d="M15 5h4v4"/><path d="M5 19l2-5M5 19l5-2"/>',
  cav: '<path d="M7 20v-5l-3-2 4-7 3 1 4-3 1 4 4 3-2 3-3-1-2 4v3"/>',
  monster: '<path d="M6 20c0-6 2-10 6-12M18 20c0-6-2-10-6-12"/><path d="M9 8l-2-4M15 8l2-4"/><circle cx="10" cy="12" r="1"/><circle cx="14" cy="12" r="1"/>',
  beast: '<circle cx="7" cy="10" r="2"/><circle cx="12" cy="7" r="2"/><circle cx="17" cy="10" r="2"/><path d="M8 18c0-3 2-5 4-5s4 2 4 5c0 1-1 2-4 2s-4-1-4-2z"/>',
  art: '<circle cx="8" cy="17" r="3"/><path d="M10 15l9-8"/><path d="M5 20h8"/>',
  other: '<circle cx="12" cy="12" r="6"/>',
};
const BUDGET_GROUPS = [
  ['Lord & heroes', u => isChar(u.opt), '#e2b65a', 'lord'], ['Infantry', u => (u.opt.role || '').startsWith('infantry'), '#d4893a', 'inf'],
  ['Ranged', u => u.opt.role === 'ranged', '#5b9be0', 'ranged'], ['Cavalry & chariots', u => u.opt.role === 'cavalry', '#8fbf4a', 'cav'],
  ['Monsters', u => u.opt.role === 'monster', '#b07ad0', 'monster'], ['War beasts', u => u.opt.role === 'war_beast', '#4fb3a6', 'beast'],
  ['Artillery', u => u.opt.role === 'artillery', '#d0604a', 'art'], ['Other', u => (u.opt.role || 'other') === 'other', '#8a8a8a', 'other'],
];
function renderBudget() {
  const icon = (k, c) => `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ROLE_ICONS[k]}</svg>`;
  const groups = BUDGET_GROUPS.map(([l, f, c, k]) => [l, state.army.filter(f).reduce((s, u) => s + unitCost(u), 0), c, k]).filter(g => g[1] > 0);
  const segs = groups.map(([l, v, c, k]) => {
    const w = 100 * v / DATA.budget, pc = Math.round(w), cls = w >= 11 ? 'full' : w >= 5 ? 'mid' : 'tiny';
    return `<div class="seg ${cls}" style="width:${Math.min(100, w).toFixed(2)}%;--c:${c}" title="${esc(l)}: ${fmt(v)} · ${pc}%">` +
      `<span class="bico">${icon(k, c)}</span><span class="btxt"><b>${esc(l)}</b><span>${fmt(v)} · ${pc}%</span></span><span class="bpc">${pc}%</span></div>`;
  }).join('');
  const left = remaining();
  $('budgetBar').innerHTML = segs + (left > 0 ? `<div class="rest"><b>${fmt(left)}</b><span>left</span></div>` : '');
}

/* ---------- Matchup : ton armée face au profil moyen du roster adverse ----------
   Chaque axe va de 0 à 100. Ton armée : part des fonds (hors lords et héros pour l'indice d'élite) ;
   adversaire : part des cartes de son roster PvP (1 carte = 1 voix, hors lords et héros), calculée dans build_app.py. */
const AXES = ['Anti-large', 'Armour-piercing', 'Ranged', 'Mobility', 'Durability', 'Magic', 'Flying', 'Elite'];
const clamp = v => Math.max(0, Math.min(100, v));
const speedScore = v => clamp((v - 25) / 55 * 100);
const hpScore = v => clamp(v / 15000 * 100);
const tierScore = v => clamp((v - 1) / 4 * 100);
function armyProfile(army) {
  const total = army.reduce((s, u) => s + unitCost(u), 0) || 1;
  const share = f => 100 * army.filter(f).reduce((s, u) => s + unitCost(u), 0) / total;
  const troops = army.filter(u => !isChar(u.opt) && statOf(u.opt.u, 'tier'));
  const tc = troops.reduce((s, u) => s + unitCost(u), 0);
  const hp = army.reduce((s, u) => s + (statOf(u.opt.u, 'health') || 0), 0);
  return {
    anti_large: share(u => statOf(u.opt.u, 'is_anti_large')), ap: share(u => statOf(u.opt.u, 'is_armour_piercing')),
    ranged: share(u => !isChar(u.opt) && statOf(u.opt.u, 'range') != null), flying: share(u => u.opt.fly),
    magic: share(u => statOf(u.opt.u, 'has_magical_attacks') || [...u.sel].some(k => (upgradesOf(race().key)[k] || [])[1] === 's')),
    shields: share(u => statOf(u.opt.u, 'has_shield_or_missile_resistance')),
    speed: army.reduce((s, u) => s + (statOf(u.opt.u, 'speed') || 0) * unitCost(u), 0) / total,
    hp_per_1000: hp * 1000 / total,
    tier: tc ? troops.reduce((s, u) => s + statOf(u.opt.u, 'tier') * unitCost(u), 0) / tc : 1,
  };
}
const axisValues = p => [p.anti_large, p.ap, p.ranged, speedScore(p.speed), hpScore(p.hp_per_1000), p.magic, p.flying, tierScore(p.tier)].map(v => clamp(v || 0));
function radarSvg(mine, enemy) {
  const cx = 145, cy = 125, R = 92, n = AXES.length;
  const pt = (i, v) => { const a = -Math.PI / 2 + 2 * Math.PI * i / n; return [cx + R * v / 100 * Math.cos(a), cy + R * v / 100 * Math.sin(a)]; };
  const poly = (vals, cls) => `<polygon class="${cls}" points="${vals.map((v, i) => pt(i, v).map(x => x.toFixed(1)).join(',')).join(' ')}"/>`;
  const grid = [25, 50, 75, 100].map(l => poly(AXES.map(() => l), 'g')).join('');
  const spokes = AXES.map((_, i) => { const [x, y] = pt(i, 100); return `<line class="g" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; }).join('');
  const labels = AXES.map((a, i) => { const [x, y] = pt(i, 118); const anchor = Math.abs(x - cx) < 10 ? 'middle' : x > cx ? 'start' : 'end';
    return `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="${anchor}">${a}</text>`; }).join('');
  return `<svg class="radar" viewBox="-30 -4 350 262" role="img" aria-label="Army profile radar">${grid}${spokes}${enemy ? poly(enemy, 'en') : ''}${mine ? poly(mine, 'me') : ''}${labels}</svg>`;
}
function keyPoints(m, e, enemyName) {
  const pts = [], r = Math.round;
  if (e.armoured >= 40) pts.push(m.ap < 30
    ? ['warn', `<b>Armour</b> — ${r(e.armoured)}% of the ${enemyName} roster is heavily armoured; only ${r(m.ap)}% of your funds are armour-piercing.`]
    : ['good', `<b>Armour</b> — ${r(e.armoured)}% of their roster is heavily armoured; your armour-piercing (${r(m.ap)}%) answers it.`]);
  if (e.large_units >= 40) pts.push(m.anti_large < 25
    ? ['warn', `<b>Large targets</b> — ${r(e.large_units)}% of their units are large; your anti-large is ${r(m.anti_large)}% of your funds.`]
    : ['good', `<b>Large targets</b> — ${r(e.large_units)}% large units on their side, covered by your anti-large (${r(m.anti_large)}%).`]);
  else if (e.large_units < 20 && m.anti_large > 30) pts.push(['', `<b>Large targets</b> — few large units on their side (${r(e.large_units)}%): your anti-large investment (${r(m.anti_large)}%) could be reduced.`]);
  if (e.ranged >= 35) pts.push(m.shields < 25 && speedScore(m.speed) < 50
    ? ['warn', `<b>Ranged</b> — ${r(e.ranged)}% of their roster shoots; you have few shields or missile resistance (${r(m.shields)}%) and little speed to close in.`]
    : ['good', `<b>Ranged</b> — ${r(e.ranged)}% of their roster shoots; your shields / speed give you answers.`]);
  if (e.flying >= 15 && m.ranged + m.flying < 20) pts.push(['warn', `<b>Flying</b> — ${r(e.flying)}% of their roster can fly; you have little to catch flyers (ranged ${r(m.ranged)}%, flying ${r(m.flying)}%).`]);
  if (e.ethereal >= 5 && m.magic < 15) pts.push(['warn', `<b>Ethereal</b> — they can field ethereal units; only ${r(m.magic)}% of your funds deal magical damage.`]);
  const ds = m.speed - e.speed;
  if (ds >= 8) pts.push(['good', `<b>Mobility</b> — you are faster on average (${r(m.speed)} vs ${r(e.speed)}): flanking and kiting are on your side.`]);
  else if (ds <= -8) pts.push(['warn', `<b>Mobility</b> — they are faster on average (${r(e.speed)} vs ${r(m.speed)}): expect flanks, keep a reserve.`]);
  return pts;
}

/* ---------- Armées d'exemple (config/army_templates/) ----------
   Chaque exemple : race, nom, archétypes, difficulté et adaptabilité (1–5), forces / faiblesses (codes faction ou
   archétypes), description, unités. La galerie s'ouvre par le bouton du haut ; une armée vide propose aussi les exemples. */
const archDef = a => ((DATA.archetypes || []).find(x => x[0] === a) || [])[1] || '';
const examplesOf = rk => (DATA.templates || []).filter(t => t.race === rk);
function templateArmy(t) {
  const byKey = {};
  (DATA.roster[t.race] || []).forEach(card => card.opts.forEach(opt => { byKey[opt.u] = { card, opt }; }));
  const army = [], missing = [];
  t.units.forEach(([u, rank, items, parts]) => {
    const hit = byKey[u]; if (!hit) { missing.push(u); return; }
    const up = hit.opt.up || [];
    army.push({ card: hit.card, opt: hit.opt, sel: new Set(items.map(i => i[1]).filter(k => up.includes(k))), rank: canRank(hit.opt) ? rank : 0,
                parts: parts && parts.length ? parts : undefined, extra: items.filter(i => !up.includes(i[1])) });
  });
  const lord = army.findIndex(u => u.opt.l); if (lord > 0) army.unshift(army.splice(lord, 1)[0]);
  return { raceIndex: DATA.races.findIndex(r => r.key === t.race), army, missing };
}
function exampleIssues(t, d) {   // problèmes d'un exemple au patch actuel (budget, plafonds, unités disparues)
  const out = d.missing.length ? [`${d.missing.length} unit(s) no longer available`] : [];
  return out.concat(validate(t.race, d.army).map(e => e.text));
}
const vsName = ([type, v]) => type === 'f' ? ((DATA.races.find(r => r.key === DATA.factionCodes[v]) || {}).name || v) : v;
const vsChips = (list, cls) => list.map(x => `<span class="vs-chip ${cls}${x[0] === 'a' ? ' a' : ''}"${x[0] === 'a' ? ` title="${esc(archDef(x[1]))}"` : ''}>${esc(vsName(x))}</span>`).join('');
function cardStrip(army, max, w) {
  return army.slice(0, max).map(u => {
    const src = u.opt.img || u.card.img;
    return src ? `<img class="mini" src="images/${esc(src)}" alt="" style="${w ? `width:${w}px;height:${Math.round(w * 130 / 60)}px` : ''}">`
      : `<span class="mini txt" style="background:${TAB_COLORS[u.card.t] || '#4a2c2a'};${w ? `width:${w}px;height:${Math.round(w * 130 / 60)}px` : ''}">${esc(initials(u.card.n))}</span>`;
  }).join('') + (army.length > max ? `<span class="more">+${army.length - max}</span>` : '');
}
/* note sur 5 en étoiles : le même caractère, plein ou estompé, pour des étoiles toutes de la même taille */
const stars5 = n => `<span class="stars5" role="img" aria-label="${n} out of 5">${[1, 2, 3, 4, 5].map(k => `<i class="${k <= n ? 'on' : ''}">★</i>`).join('')}</span>`;
const meter = (n, label, color) => n ? `<div class="meter" title="${label} ${n}/5"><span>${label}</span><span class="dots">${[1, 2, 3, 4, 5].map(k => `<i class="${k <= n ? 'on' : ''}" style="--c:${color}"></i>`).join('')}</span></div>` : '';
function showTemplates(filter = '', sort = 'diff') {

  const sorters = { diff: (a, b) => (a.diff || 9) - (b.diff || 9), diffd: (a, b) => b.diff - a.diff, adapt: (a, b) => b.adapt - a.adapt, name: (a, b) => a.name.localeCompare(b.name) };
  list = list.slice().sort(sorters[sort] || sorters.diff);

      ${meter(t.diff, 'Difficulty', '#e07a5f')}${meter(t.adapt, 'Adaptability', '#81b29a')}
      ${t.strong.length || t.weak.length ? `<div class="ex-vs">${t.strong.length ? `<span class="lbl">Strong vs</span>${vsChips(t.strong, 's')}` : ''}

      <p class="ex-desc">${esc(t.desc || '')}</p>

      <div class="ex-act"><button class="tb" data-act="preview" data-i="${all.indexOf(t)}">Preview</button>

  };
  openModal(`<div class="gal-head" style="--gal-art:${race().art ? `url('images/${esc(race().art)}')` : 'none'}">
      <h3 class="serif">Example armies · ${esc(race().name)}</h3><p>Ready-made armies to learn the faction. Load one, then adapt it to your style.</p></div>
    <div class="gal-tools">
      <button class="fchip" data-f="" aria-pressed="${!filter}">All <span class="n">${all.length}</span></button>
      ${Object.keys(counts).sort().map(a => `<button class="fchip" data-f="${esc(a)}" aria-pressed="${filter === a}" title="${esc(archDef(a))}">${esc(a)} <span class="n">${counts[a]}</span></button>`).join('')}
      <button class="fchip" data-f="__easy" aria-pressed="${filter === '__easy'}">Beginner-friendly</button>
      <select id="galSort" aria-label="Sort"><option value="diff">Easiest first</option><option value="diffd">Hardest first</option>
        <option value="adapt">Most adaptable</option><option value="name">Name</option></select>
    </div>
    <div class="gal-grid">${list.length ? list.map(tile).join('') : '<p class="empty">No example army yet for this race.</p>'}</div>`, true);
  $('galSort').value = sort;
  $('galSort').addEventListener('change', e => showTemplates(filter, e.target.value));
  $('modalBody').querySelectorAll('.gal-tools .fchip').forEach(b => b.addEventListener('click', () => showTemplates(b.dataset.f, sort)));
  $('modalBody').querySelectorAll('.ex-act button').forEach(b => b.addEventListener('click', () => {
    const t = all[Number(b.dataset.i)]; closeModal();
    b.dataset.act === 'preview' ? previewTemplate(t) : loadTemplate(t);
  }));
}
function loadTemplate(t) {

function previewTemplate(t) {

/* ---------- Rendu : roster (avec alerte de plafond sur les cartes) ---------- */
function capBadge(opt) {
  const rk = race().key, counts = capCounts(rk, state.army);
  let worst = null;
  (capsOf(rk).m[opt.u] || []).forEach(k => {
    const n = counts[k] || 0, cap = effectiveCap(rk, k, state.army);
    // alerte seulement quand le groupe est plein ou qu'il ne reste qu'une place
    if (n > 0 && n >= cap - 1 && (!worst || n / cap > worst.n / worst.cap)) worst = { k, n, cap };
  });
  return worst;
}
function renderRoster() {
  const box = $('sections');
  box.innerHTML = '';
  const byTab = {};
  roster().forEach(c => (byTab[c.t] ||= []).push(c));
  Object.values(byTab).forEach(list => list.sort((a, b) => a.min - b.min || a.n.localeCompare(b.n)));
  DATA.tabs.filter(t => byTab[t.key]).forEach(t => {
    const sec = document.createElement('section');
    const n = byTab[t.key].length;
    const hits = state.filters.size ? byTab[t.key].filter(c => c.opts.some(matchesFilters)).length : null;
    sec.innerHTML = `<div class="section-head"><h3 class="serif">${esc(t.name)}</h3><span class="n">${hits != null ? `<span class="hit">${hits}</span> / ` : ''}${n} card${n > 1 ? 's' : ''}</span></div>`;
    const wrap = document.createElement('div'); wrap.className = 'section-cards';
    byTab[t.key].forEach(card => {
      const el = cardEl(card, { cost: card.min, img: card.img });
      const reasons = card.opts.map(o => addReason(newUnit(card, o)));
      if (reasons.every(Boolean)) { el.classList.add('blocked'); el.title += ' – ' + reasons[0]; }
      const inArmy = state.army.filter(u => u.card === card).length;
      if (inArmy) el.insertAdjacentHTML('beforeend', `<span class="in-army" title="Already in the army">×${inArmy}</span>`);
      if (state.filters.size && !card.opts.some(matchesFilters)) el.classList.add('dim');
      const cb = capBadge(card.opts[0]);
      if (cb) el.insertAdjacentHTML('beforeend', `<span class="badge-cap ${cb.n >= cb.cap ? 'full' : ''}" title="${esc(capsOf(race().key).g[cb.k][0])}">${cb.n}/${cb.cap}</span>`);
      if (state.focus && state.focus.kind === 'roster' && state.focus.unit.card === card) el.classList.add('selected');
      el.dataset.cardId = card.id;
      bindClicks(el, () => {
        if (!(state.focus && state.focus.kind === 'roster' && state.focus.unit.card === card)) setFocus({ kind: 'roster', unit: newUnit(card, card.opts[0]) });
      }, () => addUnit(draftFor(card)));
      el.addEventListener('dragstart', e => { drag = { from: 'roster', unit: draftFor(card) }; e.dataTransfer.setData('text/plain', 'roster'); e.dataTransfer.effectAllowed = 'copy'; });
      el.addEventListener('dragend', () => { drag = null; });
      wrap.appendChild(el);
    });
    sec.appendChild(wrap);
    box.appendChild(sec);
  });
}

/* ---------- Panneau de personnalisation (sous l'armée) : affiché seulement pour une unité personnalisable ---------- */
function renderCustom() {

  box.hidden = false;
  const { kind, unit } = state.focus, { card, opt } = unit;
  const ups = upgradesOf(race().key);
  const reason = kind === 'roster' ? addReason(unit) : '';

  // choix uniques (variantes, monture) : chaque valeur = une autre option de la carte
  const sameOther = (o, k) => DIMS.every(d => d === k || (o[d] ?? '') === (opt[d] ?? ''));
  const targetFor = (k, v) => card.opts.find(o => (o[k] ?? '') === v && sameOther(o, k)) || card.opts.find(o => (o[k] ?? '') === v);
  const carry = next => ({ card, opt: next, rank: unit.rank, parts: unit.parts,
    sel: new Set((next.up || []).filter(x => unit.sel.has(x))) });   // on garde ce qui reste disponible
  const radioGroup = k => {
    const values = [...new Set(card.opts.map(o => o[k] ?? ''))];
    const foot = card.opts.find(o => (o.mount ?? '') === 'On foot' && sameOther(o, 'mount'));
    const rows = values.map(v => {
      const target = targetFor(k, v);
      let price;
      if (k === 'mount') { const d = foot ? target.c - foot.c : 0; price = v !== 'On foot' && d ? fmt(d) : ''; }
      else price = fmt(unitCost(carry(target)));   // comme en jeu : prix total de l'unité avec cette variante
      const label = k === 'mount' && v === 'On foot' ? 'None' : (v || 'None');
      const icon = k === 'lore' ? target.li : k === 'mount' && v !== 'On foot' ? target.mi : null;
      const iconHtml = (k === 'lore' || k === 'mount')
        ? (icon ? `<img class="ico" src="images/${esc(icon)}" alt="">` : '<span class="ico empty"></span>') : '';
      const loreStyle = k === 'lore' && target.lc ? ` lore" style="--lore:#${esc(target.lc)}` : '';
      return `<label class="row${loreStyle}"><input type="radio" name="dim-${k}" data-u="${esc(target.u)}" ${(opt[k] ?? '') === v ? 'checked' : ''}>` +
        `${iconHtml}<span class="lbl">${esc(label)}</span>${price ? `<span class="price">${price}</span>` : ''}</label>`;
    }).join('');
    return `<section class="pz"><h4 class="serif">${esc(dimTitle(card, k))}</h4>${rows}</section>`;
  };
  const variants = DIMS.filter(k => k !== 'mount' && hasChoice(card, k)).map(radioGroup).join('');
  const mounts = hasChoice(card, 'mount') ? radioGroup('mount') : '';
  const current = upgradesCost(unit.sel);
  const sections = UPGRADE_SECTIONS.map(([type, title]) => {
    const keys = (opt.up || []).filter(k => ups[k] && ups[k][1] === type);
    if (!keys.length) return '';
    const all = keys.every(k => unit.sel.has(k));
    const rows = keys.map(k => {
      const [name, , , , , icon] = ups[k];
      const checked = unit.sel.has(k);
      // comme en jeu : le prix n'est affiché que sur les éléments non cochés (surcoût de leur ajout)
      const price = checked ? '' : `<span class="price">${fmt(upgradesCost(new Set([...unit.sel, k])) - current)}</span>`;
      const iconHtml = type === 'i' ? '' : icon ? `<img class="ico" src="images/${esc(icon)}" alt="">` : '<span class="ico empty"></span>';
      return `<label class="row"${DATA.details[k] ? ` data-tip="${esc(k)}"` : ''}><input type="checkbox" data-k="${esc(k)}" ${checked ? 'checked' : ''}>${iconHtml}<span class="lbl">${esc(name)}</span>${price}</label>`;
    }).join('');
    return `<section class="pz"><h4 class="serif">${title}</h4>` +
      `<label class="row all"><input type="checkbox" data-all="${type}" ${all ? 'checked' : ''}><span class="lbl">Select All</span></label>${rows}</section>`;
  }).join('');

  box.innerHTML = `
    <div class="custom-head"><h2 class="serif">Unit Customisation · ${esc(card.n)}</h2>
      <button class="act" id="customAction" ${reason ? 'disabled' : ''}>${kind === 'roster' ? 'Add to army' : 'Remove from army'}</button></div>
    <div class="custom-scroll">
      ${reason ? `<p class="custom-msg">${esc(reason)}</p>` : ''}
      <div class="custom-body">${variants}${sections}${mounts}</div>
    </div>`;

  $('customAction').addEventListener('click', () => (kind === 'roster' ? addUnit(unit) : removeUnit(unit)));
  box.querySelectorAll('input[type=radio][data-u]').forEach(r => r.addEventListener('change', () => {
    if (!replaceUnit(unit, carry(card.opts.find(o => o.u === r.dataset.u)))) renderCustom();
  }));
  box.querySelectorAll('input[type=checkbox][data-k]').forEach(c => c.addEventListener('change', () => {
    const sel = new Set(unit.sel); c.checked ? sel.add(c.dataset.k) : sel.delete(c.dataset.k);
    if (!replaceUnit(unit, { ...unit, sel })) renderCustom();
  }));
  box.querySelectorAll('input[type=checkbox][data-all]').forEach(c => c.addEventListener('change', () => {
    const sel = new Set(unit.sel);
    (opt.up || []).filter(k => ups[k] && ups[k][1] === c.dataset.all).forEach(k => (c.checked ? sel.add(k) : sel.delete(k)));
    if (!replaceUnit(unit, { ...unit, sel })) renderCustom();
  }));
}

/* ---------- Panneau de droite : statistiques de la composition ----------
   Chaque ligne : nombre d'unités, nombre de modèles (soldats ; 1 pour une entité unique), coût et part des fonds. */
const isChar = o => o.role === 'lord' || o.role === 'hero';
const ROLE_GROUPS = [   // [libellé, couleur, test sur une unité de l'armée] : barre « Funds by role » et points de la bande de vitesse
  ['Lord', '#c9a24a', u => u.opt.role === 'lord'], ['Heroes', '#9b6fb8', u => u.opt.role === 'hero'],
  ['Infantry', '#9a875a', u => (u.opt.role || '').startsWith('infantry')], ['Ranged', '#5b8fd6', u => u.opt.role === 'ranged'],
  ['Artillery', '#8a8a8a', u => u.opt.role === 'artillery'], ['Cavalry & chariots', '#6aa35a', u => u.opt.role === 'cavalry'],
  ['Monsters', '#c0563b', u => u.opt.role === 'monster'], ['War beasts', '#a0784a', u => u.opt.role === 'war_beast'],
  ['Other', '#666', u => !['lord', 'hero', 'ranged', 'artillery', 'cavalry', 'monster', 'war_beast'].includes(u.opt.role) && !(u.opt.role || '').startsWith('infantry')],
];
const roleOf = u => ROLE_GROUPS.find(([, , f]) => f(u)) || ROLE_GROUPS[ROLE_GROUPS.length - 1];
const COMP_SPEED = [
  ['Fast (speed ≥ 80)', u => statOf(u.opt.u, 'speed') >= 80],
  ['Slow (speed ≤ 30)', u => statOf(u.opt.u, 'speed') != null && statOf(u.opt.u, 'speed') <= 30],
];
/* réponses aux menaces : [icône, nom, test, explication, minimum habituel en % des fonds] */
const hasSpell = u => [...(u.sel || [])].some(k => (upgradesOf(race().key)[k] || [])[1] === 's');
const THREAT_ANSWERS = [
  ['🛡', 'Anti-large', u => statOf(u.opt.u, 'is_anti_large'), 'Units with a bonus against large: spears, halberds, anti-large missiles', 15],
  ['⚔', 'Anti-armour', u => statOf(u.opt.u, 'is_armour_piercing'), 'Units with armour-piercing attacks or missiles', 20],
  ['🦅', 'Anti-flying', u => statOf(u.opt.u, 'range') != null || u.opt.fly, 'Missile and flying units: the only ones that reach flyers', 15],
  ['✦', 'Magic', u => statOf(u.opt.u, 'has_magical_attacks') || u.opt.lore || hasSpell(u), 'Spellcasters and magical attacks (against ethereal units and high physical resistance)', 10],
];
function renderComposition() {
  const p = $('composition'), army = state.army;
  const total = spent();
  if (!army.length) { p.innerHTML = '<h3 class="serif">Composition</h3><p class="empty">Add units to see how the army is split.</p>'; return; }
  const models = u => statOf(u.opt.u, 'unit_size') || 0;
  const sum = (list, f) => list.reduce((s, u) => s + f(u), 0);
  const pc = (a, b) => b ? 100 * a / b : 0;
  const fundsOf = f => pc(sum(army.filter(f), unitCost), total);
  const row = (label, pred) => {
    const sel = army.filter(pred), n = sel.length, m = sum(sel, models), c = sum(sel, unitCost);
    const share = pc(c, total);
    return `<div class="comp-row${n ? '' : ' zero'}"><div class="top"><b>${esc(label)}</b><span class="pc">${Math.round(share)}%</span></div>` +
      `<div class="bar"><i style="width:${share.toFixed(1)}%"></i></div>` +
      `<div class="det">${n} unit${n === 1 ? '' : 's'} · ${fmt(m)} model${m === 1 ? '' : 's'} · ${fmt(c)} gold</div></div>`;
  };
  // répartition des fonds par rôle : une barre empilée, détail au survol
  const roles = ROLE_GROUPS.map(([l, col, f]) => { const sel = army.filter(f); return { l, col, n: sel.length, m: sum(sel, models), c: sum(sel, unitCost) }; }).filter(r => r.n);
  const rolesBar = roles.map(r => `<i style="width:${pc(r.c, total).toFixed(1)}%;background:${r.col}" title="${esc(r.l)}: ${Math.round(pc(r.c, total))}% · ${r.n} unit${r.n === 1 ? '' : 's'} · ${fmt(r.m)} models · ${fmt(r.c)} gold"></i>`).join('');
  const rolesLeg = roles.map(r => `<span title="${r.n} unit${r.n === 1 ? '' : 's'} · ${fmt(r.m)} models · ${fmt(r.c)} gold"><i style="background:${r.col}"></i>${esc(r.l)} ${Math.round(pc(r.c, total))}%</span>`).join('');
  // profil de dégâts : puissance = statistique de l'unité x nombre de modèles
  const mel = sum(army, u => (statOf(u.opt.u, 'weapon_strength') || 0) * models(u));
  const mis = sum(army, u => (statOf(u.opt.u, 'missile_strength') || 0) * models(u));
  const melShare = f => pc(sum(army.filter(f), u => (statOf(u.opt.u, 'weapon_strength') || 0) * models(u)), mel);
  const misShare = f => pc(sum(army.filter(f), u => (statOf(u.opt.u, 'missile_strength') || 0) * models(u)), mis);
  const melAP = pc(sum(army, u => (statOf(u.opt.u, 'weapon_ap_damage') || 0) * models(u)), mel);
  const misAP = misShare(u => statOf(u.opt.u, 'missile_ap'));
  const mag = [melShare(u => statOf(u.opt.u, 'melee_magical')), misShare(u => statOf(u.opt.u, 'missile_magical'))];
  const fire = [melShare(u => statOf(u.opt.u, 'melee_flaming')), misShare(u => statOf(u.opt.u, 'missile_flaming'))];
  const mbar = (v, col) => `<span class="cp-bar"><i style="width:${Math.min(100, v).toFixed(1)}%;background:${col}"></i></span>`;
  // réponses aux menaces
  const needs = THREAT_ANSWERS.map(([ic, nm, f, why, ref]) => ({ ic, nm, why, ref, v: fundsOf(f) }));
  const needHtml = needs.map(n => `<div class="cp-need${n.v ? '' : ' zero'}"><span class="ic">${n.ic}</span><span class="nm">${n.nm}</span><span class="pcv">${Math.round(n.v)}%</span>
    <span class="cp-gauge"><i style="width:${Math.min(100, n.v * 2)}%;background:${n.v ? (n.v >= n.ref ? 'var(--ok)' : 'var(--gold)') : 'var(--danger)'}"></i><u style="left:${n.ref * 2}%" title="Usual minimum: ${n.ref}%"></u></span>
    <span class="why">${n.why}</span></div>`).join('') +
    needs.filter(n => !n.v).map(n => `<div class="cp-alert">⚠ <span><b>No ${n.nm.toLowerCase()} answer.</b> Nothing in the army covers it.</span></div>`).join('');
  // bande de vitesse : un point par unité, couleur du rôle
  const speeds = army.map(u => ({ u, s: statOf(u.opt.u, 'speed') || 0 }));
  const vmax = Math.max(140, ...speeds.map(x => x.s));
  const placed = [];
  const dots = speeds.map(({ u, s }) => {
    const x = 100 * s / vmax, lvl = placed.filter(px => Math.abs(px - x) < 2.2).length; placed.push(x);
    return `<i style="left:${x.toFixed(1)}%;bottom:${4 + 11 * lvl}px;background:${roleOf(u)[1]}" title="${esc(u.opt.n)}: speed ${s}"></i>`;
  }).join('');
  const hp = sum(army, u => statOf(u.opt.u, 'health') || 0);
  const speedAvg = total ? sum(army, u => (statOf(u.opt.u, 'speed') || 0) * unitCost(u)) / total : 0;
  p.innerHTML = `<h3 class="serif">Composition</h3>
    <div class="comp-head"><b>${army.length} / ${DATA.maxUnits} units</b><span class="muted">${fmt(sum(army, models))} models</span></div>
    <p class="sub">${fmt(total)} / ${fmt(DATA.budget)} spent</p>
    <h4 class="block-title serif">Funds by role</h4>
    <div class="cp-stack">${rolesBar}</div><div class="cp-leg">${rolesLeg}</div>
    <h4 class="block-title serif">Damage profile</h4>
    <div class="cp-dmg">
      <div class="cp-card"><span class="k">Melee power</span><b>${fmt(mel)}</b><span class="p">${fmt(pc(mel * 10, total))} per 1000 gold</span></div>
      <div class="cp-card"><span class="k">Missile power</span><b>${fmt(mis)}</b><span class="p">${fmt(pc(mis * 10, total))} per 1000 gold</span></div>
    </div>
    <div class="cp-stack thin" title="Melee vs missile power"><i style="width:${pc(mel, mel + mis).toFixed(1)}%;background:#c98a3a"></i><i style="width:${pc(mis, mel + mis).toFixed(1)}%;background:#5b8fd6"></i></div>
    <div class="cp-leg"><span><i style="background:#c98a3a"></i>Melee ${Math.round(pc(mel, mel + mis))}%</span><span><i style="background:#5b8fd6"></i>Missile ${Math.round(pc(mis, mel + mis))}%</span></div>
    <div class="cp-mini">
      <span>Melee armour-piercing</span>${mbar(melAP, 'var(--gold)')}<b>${Math.round(melAP)}%</b>
      <span>Missile armour-piercing</span>${mbar(misAP, 'var(--gold)')}<b>${mis ? Math.round(misAP) + '%' : '–'}</b>
      <span>Magical (melee / missile)</span>${mbar(Math.max(...mag), '#a07ce0')}<b>${Math.round(mag[0])}% / ${mis ? Math.round(mag[1]) + '%' : '–'}</b>
      <span>Flaming (melee / missile)</span>${mbar(Math.max(...fire), '#e0703a')}<b>${Math.round(fire[0])}% / ${mis ? Math.round(fire[1]) + '%' : '–'}</b>
    </div>
    <p class="muted cp-note">Power = weapon or missile strength × models. Shares are shares of that power.</p>
    <h4 class="block-title serif">Answers to threats</h4>
    ${needHtml}
    <p class="muted cp-note">Share of the funds. The white mark is a usual minimum: green above, gold below, red at zero.</p>
    <h4 class="block-title serif">Speed</h4>
    <div class="kpis"><div class="kpi"><b>${Math.round(speedAvg)}</b><span>Average speed (by cost)</span></div>
      <div class="kpi"><b>${fmt(sum(army.filter(u => u.opt.fly), unitCost) * 100 / (total || 1))}%</b><span>Flying (share of funds)</span></div></div>
    <div class="cp-dots" aria-label="Speed of each unit">${dots}</div><div class="cp-axis"><span>0</span><span>speed</span><span>${vmax}</span></div>
    <div style="margin-top:8px">${COMP_SPEED.map(([l, f]) => row(l, f)).join('')}</div>
    <h4 class="block-title serif">Health</h4>
    <div class="kpis"><div class="kpi"><b>${fmt(hp)}</b><span>Total health</span></div>
      <div class="kpi"><b>${fmt(total ? hp * 1000 / total : 0)}</b><span>Health per 1000 gold</span></div></div>`;
}

/* changement d'unité affichée : panneaux et surbrillance mis à jour sans reconstruire les cartes */
function setFocus(focus) {

/* ---------- Glisser-déposer ---------- */
let drag = null;
function setupDragAndDrop() {
  const zone = $('armyZone');
  zone.addEventListener('dragover', e => { if (drag && drag.from === 'roster') { e.preventDefault(); zone.classList.add('drop-ok'); } });
  zone.addEventListener('dragleave', () => zone.classList.remove('drop-ok'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('drop-ok');
    if (drag && drag.from === 'roster') addUnit(drag.unit);
    else if (drag && drag.from === 'army') {   // réordonner : on dépose avant l'unité visée (le lord reste en tête)
      const slot = e.target.closest('.slot');
      const target = slot ? Number(slot.dataset.armyIndex) : state.army.length;
      moveUnit(drag.unit, target);
    }
    drag = null; document.querySelectorAll('.slot.drop-before').forEach(x => x.classList.remove('drop-before'));
  });
  zone.addEventListener('dragover', e => {
    if (!(drag && drag.from === 'army')) return;
    e.preventDefault();
    document.querySelectorAll('.slot.drop-before').forEach(x => x.classList.remove('drop-before'));
    const slot = e.target.closest('.slot'); if (slot) slot.classList.add('drop-before');
  });
  document.addEventListener('dragover', e => { if (drag && drag.from === 'army' && !zone.contains(e.target)) e.preventDefault(); });
  document.addEventListener('drop', e => { if (drag && drag.from === 'army' && !zone.contains(e.target)) { e.preventDefault(); removeUnit(drag.unit); } drag = null; });
}

/* ---------- Historique : annuler / rétablir (Ctrl+Z / Ctrl+Y) ----------
   Les unités sont immuables (chaque modification crée un nouvel objet) : un instantané = une copie de la liste. */
const history = { past: [], future: [] };
const snapshot = () => ({ raceIndex: state.raceIndex, army: state.army.slice(), name: state.name, notes: state.notes });
function commit() {
  if (state.preview) { const p = state.preview; state.preview = null; history.past.push(p.snap); }
  history.past.push(snapshot()); if (history.past.length > 100) history.past.shift(); history.future = []; }
function restore(snap) {
  const raceChanged = snap.raceIndex !== state.raceIndex;
  state.army = snap.army.slice(); state.name = snap.name; state.notes = snap.notes; state.focus = null;
  if (raceChanged) setRace(snap.raceIndex, { keepArmy: true, record: false }); else renderAll();
}
function undo() { if (!history.past.length) return; history.future.push(snapshot()); restore(history.past.pop()); }
function redo() { if (!history.future.length) return; history.past.push(snapshot()); restore(history.future.pop()); }

/* ---------- Dupliquer et réordonner ---------- */
function duplicateUnit(unit) {
  if (unit.opt.l) { flash('An army can only have one lord.'); return; }
  const copy = { ...unit, sel: new Set(unit.sel) };
  const p = newProblem(state.army, [...state.army, copy]);
  if (p) { flash(p.text); return; }
  commit();
  const i = state.army.indexOf(unit);
  state.army = [...state.army.slice(0, i + 1), copy, ...state.army.slice(i + 1)];
  state.focus = { kind: 'army', unit: copy };
  renderAll();
}
function moveUnit(unit, target) {
  const from = state.army.indexOf(unit);
  if (from < 0) return;
  const lordFirst = generalOf(state.army) ? 1 : 0;
  if (unit.opt.l) return;                                   // le lord reste en tête
  let to = Math.max(lordFirst, target > from ? target - 1 : target);
  if (to === from) return;
  commit();
  const next = state.army.slice(); next.splice(from, 1); next.splice(Math.min(to, next.length), 0, unit);
  state.army = next;
  renderAll();
}

/* ---------- Codage compact d'une armée (lien de partage, favoris) ----------
   race ~ puis par unité : clé d'unité ~ rang ~ masque hexadécimal des éléments cochés (dans l'ordre de opt.up) */
function encodeArmy() {
  const units = state.army.map(u => {
    const up = u.opt.up || [];
    let mask = 0n; up.forEach((k, i) => { if (u.sel.has(k)) mask |= 1n << BigInt(i); });
    return [u.opt.u, u.rank || 0, mask.toString(16)].join('~');
  });
  return { r: race().key, n: state.name, m: state.notes, a: units.join(',') };
}
function decodeArmy(raceKey, unitsText) {
  const ri = DATA.races.findIndex(r => r.key === raceKey);
  if (ri < 0) return null;
  const byKey = {};
  (DATA.roster[raceKey] || []).forEach(card => card.opts.forEach(opt => { byKey[opt.u] = { card, opt }; }));
  const army = [], missing = [];
  (unitsText || '').split(',').filter(Boolean).forEach(part => {
    const [u, rank, mask] = part.split('~');
    const hit = byKey[u];
    if (!hit) { missing.push(u); return; }
    const m = BigInt('0x' + (mask || '0')), up = hit.opt.up || [];
    const sel = new Set(up.filter((k, i) => (m >> BigInt(i)) & 1n));
    army.push({ card: hit.card, opt: hit.opt, sel, rank: canRank(hit.opt) ? Math.min(9, Number(rank) || 0) : 0 });
  });
  const lord = army.findIndex(u => u.opt.l);   // le lord en tête
  if (lord > 0) army.unshift(army.splice(lord, 1)[0]);
  return { raceIndex: ri, army, missing };
}
function applyDecoded(d, name = '', notes = '') {
  commit();
  state.name = name; state.notes = notes; state.army = d.army; state.focus = null;
  setRace(d.raceIndex, { keepArmy: true, record: false });
  if (d.missing.length) flash(`${d.missing.length} unit(s) not available in this version were skipped.`);
}
function loadFromHash() {
  if (!location.hash.includes('a=')) return false;
  const p = new URLSearchParams(location.hash.slice(1));
  const d = decodeArmy(p.get('r'), p.get('a'));
  if (!d) return false;
  state.name = p.get('n') || ''; state.notes = p.get('m') || ''; state.army = d.army;
  setRace(d.raceIndex, { keepArmy: true, record: false });
  if (d.missing.length) flash(`${d.missing.length} unit(s) from the link are not available and were skipped.`);
  return true;
}
function shareLink() {
  const e = encodeArmy();
  const p = new URLSearchParams({ v: '1', r: e.r, a: e.a });
  if (e.n) p.set('n', e.n);
  if (e.m && e.m.length <= 500) p.set('m', e.m);
  return location.href.split('#')[0] + '#' + p.toString();
}

/* ---------- Favoris (dans ce navigateur) ---------- */
const FAV_KEY = 'tww3-builder:armies';
const readFavs = () => { try { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); } catch { return []; } };
const writeFavs = list => { try { localStorage.setItem(FAV_KEY, JSON.stringify(list)); return true; } catch { return false; } };
function saveFavourite() {
  if (!state.army.length) { flash('The army is empty.'); return; }
  const e = encodeArmy();
  const name = state.name.trim() || `${race().name} – ${new Date().toLocaleDateString('en-GB')}`;
  const list = readFavs().filter(f => !(f.name === name && f.r === e.r));
  list.unshift({ id: Date.now(), name, r: e.r, a: e.a, m: e.m, cost: spent(), units: state.army.length, saved: new Date().toISOString() });
  const saved = writeFavs(list);
  flash(saved ? `Saved “${name}” in this browser.` : 'Could not save in this browser.', saved);
}
