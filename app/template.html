/* ---------- Export / import .army_setup (format du jeu, version 8) ----------
   en-tête : u32 version, texte faction, texte mode, u8 drapeau, u32 nombre d'unités
   unité   : texte « clé:faction:général », 11 octets (octet 7 = rang), u32 nombre de pièces du Daemon Prince
             personnalisable puis les pièces (paires de textes), u32 nombre d'éléments,
             éléments (u8 type : 0 = sort / capacité, 2 = objet ; texte clé), texte final « none »
   fin     : 9 octets nuls ; texte = u16 longueur + UTF-8 */
const SETUP_DIR = '%APPDATA%\\The Creative Assembly\\Warhammer3\\army_setups';
function chooseFaction() {
  // une faction de la race qui autorise toutes les unités ; de préférence la faction principale de la race
  const main = race().faction, all = state.army.map(u => u.opt.fk || []);
  if (all.every(l => l.includes(main))) return main;
  const common = (all[0] || []).filter(f => all.every(l => l.includes(f)));
  return common[0] || main;
}
function buildArmySetup() {
  const faction = chooseFaction(), enc = new TextEncoder(), parts = [];
  const u8 = v => parts.push(Uint8Array.of(v));
  const u32 = v => { const b = new Uint8Array(4); new DataView(b.buffer).setUint32(0, v, true); parts.push(b); };
  const str = t => { const b = enc.encode(t), h = new Uint8Array(2); new DataView(h.buffer).setUint16(0, b.length, true); parts.push(h, b); };
  u32(8); str(faction); str('conquest'); u8(0); u32(state.army.length);
  const ups = upgradesOf(race().key), general = generalOf(state.army);
  state.army.forEach(u => {
    str(`${u.opt.u}:${faction}:${u === general ? 1 : 0}`);
    const block = new Uint8Array(11); block[7] = canRank(u.opt) ? u.rank : 0; parts.push(block);
    const dp = u.parts || []; u32(dp.length); dp.forEach(([a, b]) => { str(a); str(b); });   // apparence du Daemon Prince
    // capacités innées : le jeu ne les enregistre que pour les lords et héros (sans celles de la monture)
    // éléments non sélectionnables : ceux du fichier d'origine s'il y en a un (import, exemple) — le jeu peut en ajouter
    // que nos données ne connaissent pas, comme pour le Daemon Prince — sinon les capacités innées connues
    const innate = u.extra ? u.extra : isChar(u.opt) ? (DATA.exportInnate[u.opt.u] || []).map(k => [0, k]) : [];
    const chosen = [...u.sel].filter(k => ups[k]).map(k => [ups[k][1] === 'i' ? 2 : 0, k]);
    const items = [...innate, ...chosen];
    u32(items.length); items.forEach(([t, k]) => { u8(t); str(k); });
    str('none');
  });
  parts.push(new Uint8Array(9));
  return new Blob(parts, { type: 'application/octet-stream' });
}
function download(blob, fileName) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const fileBase = () => (state.name.trim() || race().name).replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_') || 'army';
function exportArmySetup() {
  if (!state.army.length) { flash('The army is empty.'); return; }
  const issues = validate(race().key, state.army);
  if (issues.length && !confirm(`This army is not valid in the game:\n- ${issues.map(e => e.text).join('\n- ')}\n\nDownload anyway?`)) return;
  const blob = buildArmySetup(), name = fileBase() + '.army_setup';
  if (gameDir) { exportToFolder(blob, name).then(done => { if (!done) { download(blob, name); showHelp(true); } }); return; }
  download(blob, name);
  let seen = false; try { seen = localStorage.getItem('tww3-builder:help-seen') === '1'; } catch {}
  if (!seen) showHelp(true);
}
function showHelp(afterExport = false) {
  openModal(`<h3 class="serif">${afterExport ? 'Your army file is ready' : 'Use your army in the game'}</h3>
    <ol>
      <li>Find the downloaded <code>.army_setup</code> file (usually in your <b>Downloads</b> folder).</li>
      <li>Copy it into the game's army folder:<br><code>${SETUP_DIR}</code><br>
        <span class="muted">Tip: paste <code>%APPDATA%</code> in the Windows Explorer address bar, then open <i>The Creative Assembly › Warhammer3 › army_setups</i>.</span></li>
      <li>In the game: <b>Custom Battle</b> → <b>Army Setup</b> → <b>Load</b> button, then pick your army.</li>
    </ol>
    <p class="muted"><b>Tip:</b> in any Windows file window, paste the folder path above in the <i>File name</i> field and press Enter to jump straight there.</p>
    ${FS_OK ? `<p class="muted"><b>Faster on Chrome / Edge:</b> click <b>Game folder</b> once and choose <code>army_setups</code>: Export will then save straight into the game, and Import will list your saved armies.</p>` : ''}
    <p class="muted">You can also do the opposite: <b>Import</b> loads a <code>.army_setup</code> file from that folder into the builder.</p>
    ${afterExport ? `<div class="modal-row"><label><input type="checkbox" id="helpSeen"> Don't show this again</label>
      <span style="flex:1"></span><button class="tb primary" id="helpOk">OK</button></div>` : ''}`);
  if (afterExport) {
    $('helpOk').addEventListener('click', () => {
      if ($('helpSeen').checked) { try { localStorage.setItem('tww3-builder:help-seen', '1'); } catch {} }
      closeModal();
    });
  }
}
function parseArmySetup(buffer) {
  const dv = new DataView(buffer), dec = new TextDecoder();
  let p = 0;
  const u8 = () => dv.getUint8(p++), u32 = () => { const v = dv.getUint32(p, true); p += 4; return v; };
  const str = () => { const n = dv.getUint16(p, true); p += 2; const t = dec.decode(new Uint8Array(buffer, p, n)); p += n; return t; };
  const head = { version: u32(), faction: str(), mode: str(), flag: u8() };
  const units = [];
  for (let i = 0, n = u32(); i < n; i++) {
    const [unitKey, faction, general] = str().split(':');
    const block = new Uint8Array(buffer, p, 11); p += 11;
    const dparts = []; for (let j = 0, m = u32(); j < m; j++) dparts.push([str(), str()]);   // pièces du Daemon Prince
    const items = []; for (let j = 0, m = u32(); j < m; j++) { const type = u8(); items.push({ type, key: str() }); }
    str();
    units.push({ unitKey, faction, general: general === '1', rank: block[7], items, parts: dparts });
  }
  return { head, units };
}
async function importArmySetup(file) {
  let data;
  try { data = parseArmySetup(await file.arrayBuffer()); }
  catch { flash('This file could not be read as a .army_setup file.'); return; }
  const raceKey = DATA.factionRace[data.head.faction];
  const ri = DATA.races.findIndex(r => r.key === raceKey);
  if (ri < 0) { flash(`Unknown faction in this file: ${data.head.faction}.`); return; }
  const byKey = {};
  (DATA.roster[raceKey] || []).forEach(card => card.opts.forEach(opt => { byKey[opt.u] = { card, opt }; }));
  const army = [], missing = [];
  data.units.forEach(x => {
    const hit = byKey[x.unitKey];
    if (!hit) { missing.push(x.unitKey); return; }
    const sel = new Set(x.items.map(i => i.key).filter(k => (hit.opt.up || []).includes(k)));
    army.push({ card: hit.card, opt: hit.opt, sel, rank: canRank(hit.opt) ? Math.min(9, x.rank) : 0, parts: x.parts.length ? x.parts : undefined,
                extra: x.items.filter(i => !(hit.opt.up || []).includes(i.key)).map(i => [i.type, i.key]) });
  });
  const lord = army.findIndex(u => u.opt.l);
  if (lord > 0) army.unshift(army.splice(lord, 1)[0]);
  applyDecoded({ raceIndex: ri, army, missing }, file.name.replace(/\.army_setup$/i, '').replace(/_/g, ' '), '');
  if (missing.length) flash(`${missing.length} unit(s) not playable in multiplayer were skipped.`);
}

/* ---------- Dossier du jeu connecté (Chrome, Edge, Opera : File System Access API) ----------
   Une fois le dossier army_setups choisi, l'import liste les compositions du jeu et l'export écrit directement dedans.
   Le droit d'accès est conservé (IndexedDB) ; le navigateur le reconfirme par un clic à chaque nouvelle session. */
const FS_OK = 'showDirectoryPicker' in window;
let gameDir = null;
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('tww3-builder', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('handles');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbSet(key, value) { const db = await idb(); return new Promise(res => { const t = db.transaction('handles', 'readwrite'); value == null ? t.objectStore('handles').delete(key) : t.objectStore('handles').put(value, key); t.oncomplete = res; }); }
async function idbGet(key) { const db = await idb(); return new Promise(res => { const r = db.transaction('handles').objectStore('handles').get(key); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); }); }
async function hasAccess(handle, ask) {
  const opts = { mode: 'readwrite' };
  if ((await handle.queryPermission(opts)) === 'granted') return true;
  return ask && (await handle.requestPermission(opts)) === 'granted';
}
async function initGameFolder() {
  if (!FS_OK) return;
  $('folderBtn').hidden = false;
  try { gameDir = await idbGet('army_setups'); } catch { gameDir = null; }
  renderFolderBtn();
}
function renderFolderBtn() {
  $('folderBtn').textContent = gameDir ? 'Game folder ✓' : 'Game folder';
  $('folderBtn').title = gameDir ? `Connected: ${gameDir.name}` : "Connect the game's army_setups folder (Chrome, Edge)";
}
async function connectGameFolder() {
  try {
    const dir = await window.showDirectoryPicker({ id: 'army-setups', mode: 'readwrite' });
    if (dir.name !== 'army_setups' && !confirm(`The selected folder is “${dir.name}”, not “army_setups”. Use it anyway?`)) return;
    gameDir = dir; await idbSet('army_setups', dir); renderFolderBtn();
    flash('Game folder connected: Import lists your saved armies, Export writes directly into it.', true);
  } catch { /* fenêtre fermée */ }
}
function folderMenu() {
  if (!gameDir) { showFolderHelp(); return; }
  openModal(`<h3 class="serif">Game folder</h3><p>Connected to <code>${esc(gameDir.name)}</code>.</p>
    <p class="muted">Import lists the armies saved in this folder; Export writes the file straight into it.</p>
    <div class="modal-row"><button class="tb" id="fChange">Change folder</button><button class="tb" id="fOff">Disconnect</button></div>`);
  $('fChange').addEventListener('click', () => { closeModal(); connectGameFolder(); });
  $('fOff').addEventListener('click', async () => { gameDir = null; await idbSet('army_setups', null); renderFolderBtn(); closeModal(); });
}
function showFolderHelp() {
  openModal(`<h3 class="serif">Connect the game folder</h3>
    <p>Pick the game's <b>army_setups</b> folder once. Then <b>Import</b> lists your saved armies and <b>Export</b> saves straight into the game.</p>
    <p class="muted">In the folder picker, paste this path in the address bar:<br><code>${SETUP_DIR}</code></p>
    <div class="modal-row"><span style="flex:1"></span><button class="tb primary" id="fGo">Choose the folder</button></div>`);
  $('fGo').addEventListener('click', () => { closeModal(); connectGameFolder(); });
}
async function importFromFolder() {
  if (!(await hasAccess(gameDir, true))) { flash('Access to the game folder was not granted.'); return false; }
  const files = [];
  for await (const [name, h] of gameDir.entries()) if (h.kind === 'file' && /\.army_setup$/i.test(name)) files.push({ name, h, t: (await h.getFile()).lastModified });
  files.sort((a, b) => b.t - a.t);
  openModal(`<h3 class="serif">Armies saved in the game</h3>
    ${files.length ? files.map((f, i) => `<div class="fav" data-i="${i}"><div class="info"><b>${esc(f.name.replace(/\.army_setup$/i, ''))}</b>
      <span>${new Date(f.t).toLocaleString('en-GB')}</span></div><button class="tb primary">Load</button></div>`).join('')
      : '<p class="empty">No .army_setup file in this folder.</p>'}
    <div class="modal-row"><button class="tb" id="otherFile">Other file…</button></div>`);
  $('modalBody').querySelectorAll('.fav button').forEach(b => b.addEventListener('click', async () => {
    const f = files[Number(b.closest('.fav').dataset.i)]; closeModal(); importArmySetup(await f.h.getFile());
  }));
  $('otherFile').addEventListener('click', () => { closeModal(); pickFile(); });
  return true;
}
async function pickFile() {
  if ('showOpenFilePicker' in window) {   // le navigateur retient le dernier dossier utilisé pour cet identifiant
    try {
      const [h] = await window.showOpenFilePicker({ id: 'army-setups-import', types: [{ description: 'Army setup', accept: { 'application/octet-stream': ['.army_setup'] } }] });
      importArmySetup(await h.getFile());
    } catch { /* fenêtre fermée */ }
  } else $('importFile').click();
}
async function exportToFolder(blob, fileName) {
  if (!(await hasAccess(gameDir, true))) return false;
  let exists = true; try { await gameDir.getFileHandle(fileName); } catch { exists = false; }
  if (exists && !confirm(`“${fileName}” already exists in the game folder. Replace it?`)) return true;
  const h = await gameDir.getFileHandle(fileName, { create: true }), w = await h.createWritable();
  await w.write(blob); await w.close();
  flash(`Saved in the game folder: “${fileName.replace(/\.army_setup$/, '')}” is ready to load in Custom Battle.`, true);
  return true;
}

/* ---------- Image PNG de l'armée (Discord, Reddit…) ---------- */
function loadImage(src) {
  return new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
}
async function drawArmyPng(withImages) {
  // image de l'armée : cartes complètes (illustration, cadre, demi-cercle, icône de catégorie, coût, chevrons
  // d'expérience), nom de l'armée et nombre de modèles ; illustration de la race en fond
  const army = state.army, perRow = 10, cw = 60, ch = 130, gap = 6, pad = 24, headH = 74, footH = 30;
  const rows = Math.max(1, Math.ceil(army.length / perRow));
  const W = pad * 2 + perRow * cw + (perRow - 1) * gap, H = headH + rows * ch + (rows - 1) * gap + footH + 10, k = 2;
  const cv = document.createElement('canvas'); cv.width = W * k; cv.height = H * k;
  const g = cv.getContext('2d'); g.scale(k, k);
  const img = src => (withImages && src ? loadImage('images/' + src) : Promise.resolve(null));
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#a3261e';
  const sk = DATA.skin || {};
  g.fillStyle = '#1d1614'; g.fillRect(0, 0, W, H);
  const bg = await img(race().art);
  if (bg) {   // illustration de la race, recadrée pour couvrir l'image, atténuée
    const r = Math.max(W / bg.width, H / bg.height), w = bg.width * r, h = bg.height * r;
    g.globalAlpha = .3; g.drawImage(bg, (W - w) / 2, (H - h) / 2, w, h); g.globalAlpha = 1;
    const grd = g.createLinearGradient(0, 0, 0, H); grd.addColorStop(0, 'rgba(29,22,20,.35)'); grd.addColorStop(1, 'rgba(29,22,20,.8)');
    g.fillStyle = grd; g.fillRect(0, 0, W, H);
  }
  g.fillStyle = accent; g.fillRect(0, 0, W, 4);
  // en-tête : nom de l'armée à gauche, modèles à droite (tuile acier)
  g.textBaseline = 'middle'; g.textAlign = 'left';
  g.fillStyle = '#f6d58a'; g.font = '700 24px Cinzel, Georgia, serif';
  g.fillText(state.name.trim() || race().name, pad, 38);
  const models = army.reduce((s, u) => s + (statOf(u.opt.u, 'unit_size') || 0), 0);
  const label = `${fmt(models)} models`, entity = await img(sk.entitySmall);
  g.font = '700 18px Cinzel, Georgia, serif';
  const tw = g.measureText(label).width + (entity ? 30 : 0) + 24, tx = W - pad - tw, ty = 20, th = 36;
  g.fillStyle = 'rgba(159,180,200,.16)'; g.strokeStyle = '#9fb4c8'; g.lineWidth = 1;
  g.beginPath(); g.roundRect ? g.roundRect(tx, ty, tw, th, 6) : g.rect(tx, ty, tw, th); g.fill(); g.stroke();
  if (entity) g.drawImage(entity, tx + 10, ty + 7, 22, 22);
  g.fillStyle = '#e6eef5'; g.fillText(label, tx + (entity ? 38 : 12), ty + th / 2 + 1);
  // cartes
  const frame = await img(sk.frame);
  for (let i = 0; i < army.length; i++) {
    const u = army[i], x = pad + (i % perRow) * (cw + gap), y = headH + Math.floor(i / perRow) * (ch + gap);
    g.fillStyle = TAB_COLORS[u.card.t] || '#4a2c2a'; g.fillRect(x, y, cw, ch);
    const art = await img(u.opt.img || u.card.img);
    if (art) g.drawImage(art, x, y, cw, ch);
    else { g.fillStyle = '#f4ead6'; g.font = '700 17px Cinzel, Georgia, serif'; g.textAlign = 'center'; g.fillText(initials(u.card.n), x + cw / 2, y + 58); g.textAlign = 'left'; }
    if (frame) g.drawImage(frame, x, y, cw, ch); else { g.strokeStyle = '#8c6a3b'; g.strokeRect(x + .5, y + .5, cw - 1, ch - 1); }
    const semi = await img(u.opt.rn ? sk.semiRenown : isChar(u.opt) ? sk.semiHero : sk.semi);
    if (semi) { const sh = semi.height * (cw - 4) / semi.width; g.drawImage(semi, x + 2, y + ch - sh, cw - 4, sh); }
    const cat = await img(u.opt.ic);
    if (cat) g.drawImage(cat, x + cw * .3, y + ch - cw * .38, cw * .38, cw * .38);
    g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(x + 2, y + 2, cw - 4, 16);
    g.fillStyle = '#f6d58a'; g.font = '700 12px system-ui, sans-serif'; g.textAlign = 'center'; g.fillText(fmt(unitCost(u)), x + cw / 2, y + 10); g.textAlign = 'left';
    const rk = shownRank(u);
    if (rk) {
      const xp = await img(sk.xp && sk.xp[rk]);
      if (xp) g.drawImage(xp, x + 1, y + 19, 22, 22);
      else { g.fillStyle = '#f6d58a'; g.font = '700 10px system-ui'; g.fillText('★' + rk, x + 4, y + 27); }
    }
  }
  g.fillStyle = '#a8977d'; g.font = '12px system-ui, sans-serif'; g.textBaseline = 'alphabetic';
  g.fillText(`Game data ${DATA.patch.replace('patch_', 'patch ')}`, pad, H - 12);
  g.textAlign = 'right'; g.fillText('TWW3 army builder · unofficial fan-made tool', W - pad, H - 12);
  return new Promise((res, rej) => { try { cv.toBlob(bl => (bl ? res(bl) : rej(new Error('empty'))), 'image/png'); } catch (e) { rej(e); } });
}
async function exportPng() {
  if (!state.army.length) { flash('The army is empty.'); return; }
  let blob;
  try { blob = await drawArmyPng(true); }
  catch { blob = await drawArmyPng(false); }   // images locales refusées par le navigateur : version sans images
  download(blob, fileBase() + '.png');
}

/* ---------- Info-bulles des sorts, capacités et objets ---------- */
function tipHtml(key) {
  const d = DATA.details[key];
  if (!d) return '';
  const [name, , mana, cooldown, duration, uses, passive, effects, range, dmg, dpt] = d;
  const meta = [passive ? '<span><b>Passive</b></span>' : '', mana ? `<span>Mana <b>${mana}</b></span>` : '',
    cooldown ? `<span>Cooldown <b>${Math.round(cooldown)}s</b></span>` : '', duration ? `<span>Duration <b>${Math.round(duration)}s</b></span>` : '',
    range ? `<span>Range <b>${Math.round(range)}m</b></span>` : '', uses ? `<span>Uses <b>${uses}</b></span>` : ''].filter(Boolean).join('');
  // dégâts : [type, normaux, perforants, impacts, durée du vortex, magiques, enflammés]
  let dmgHtml = '';
  if (dmg) {
    const [kind, base, ap, hits, vdur, magical, flaming] = dmg;
    const ico = k => DATA.statIcons[k] ? `<img src="images/${esc(DATA.statIcons[k])}" alt="">` : '';
    const parts = [base ? `<span>${ico('weapon_strength')}<b>${fmt(base)}</b> damage</span>` : '',
      ap ? `<span>${ico('ap')}<b>${fmt(ap)}</b> armour-piercing</span>` : ''].filter(Boolean).join('');
    const per = kind === 'vortex' ? `per hit${hits > 1 ? `, ${hits} vortexes` : ''}${vdur ? `, lasts ${Math.round(vdur)}s` : ''}`
      : hits > 1 ? `per impact, ${hits} impacts` : kind === 'bombardment' ? 'per impact' : '';
    const kindName = { projectile: 'Projectile', bombardment: 'Bombardment', vortex: 'Vortex' }[kind] || 'Damage';
    const flags = [magical ? `<span>${ico('magical')}Magical</span>` : '', flaming ? `<span>${ico('flaming')}Flaming</span>` : ''].join('');
    dmgHtml = `<div class="dmg"><div class="k">${kindName}</div><div class="v">${parts}</div>${per ? `<div class="per">${per}</div>` : ''}${flags ? `<div class="v">${flags}</div>` : ''}</div>`;
  }
  if (dpt) dmgHtml += `<div class="dmg"><div class="k">Damage over time</div><div class="v"><span><b>${fmt(dpt)}</b> per tick</span></div></div>`;
  const lines = (effects || '').split(' | ').filter(Boolean).map(l => {
    const cls = /^-|Inflicts/.test(l) ? 'neg' : /^\+|Gains/.test(l) ? 'pos' : '';
    const img = cls === 'neg' ? DATA.skin.effNeg : cls === 'pos' ? DATA.skin.effPos : null;
    return `<li class="${cls}">${img ? `<img src="images/${esc(img)}" alt="">` : ''}${esc(l)}</li>`; }).join('');
  return `<h5>${esc(name)}</h5>${meta ? `<div class="meta">${meta}</div>` : ''}${dmgHtml}${lines ? `<ul${DATA.skin.effPos ? ' class="icons"' : ''}>${lines}</ul>` : ''}`;
}
function setupTooltips() {
  const tip = $('tip');
  const show = (el, x, y) => {
    const html = tipHtml(el.dataset.tip); if (!html) return;
    tip.innerHTML = html; tip.hidden = false;
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.min(window.innerWidth - r.width - 8, x + 14) + 'px';
    tip.style.top = (y + r.height + 20 > window.innerHeight ? Math.max(8, y - r.height - 10) : y + 16) + 'px';
  };
  document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (el) show(el, e.clientX, e.clientY); });
  document.addEventListener('mousemove', e => { if (!tip.hidden && e.target.closest('[data-tip]')) show(e.target.closest('[data-tip]'), e.clientX, e.clientY); });
  document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) tip.hidden = true; });
  document.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el) { const r = el.getBoundingClientRect(); show(el, r.left, r.bottom); } });
  document.addEventListener('focusout', () => { tip.hidden = true; });
}

/* ---------- Filtres rapides du roster ----------
   Les cartes qui ne correspondent pas sont estompées (la disposition du roster reste celle du jeu).
   Plusieurs filtres = toutes les conditions ; « grandes » et « petites » entités s'excluent. */
const FILTERS = [
  ['anti_large', 'Anti-large', o => statOf(o.u, 'is_anti_large')],
  ['ap', 'Armour-piercing', o => statOf(o.u, 'is_armour_piercing')],
  ['ranged', 'Ranged', o => statOf(o.u, 'range') != null],
  ['flying', 'Flying', o => o.fly],
  ['magic', 'Magic dmg', o => statOf(o.u, 'has_magical_attacks')],
  ['fire', 'Fire dmg', o => statOf(o.u, 'has_flaming_attacks')],
  ['large', 'Large', o => statOf(o.u, 'is_large'), 'entityLarge'],
  ['small', 'Small', o => !statOf(o.u, 'is_large'), 'entitySmall'],
];
const matchesFilters = o => FILTERS.every(([k, , f]) => !state.filters.has(k) || f(o));
function renderFilters() {
  const cards = roster();
  const count = f => cards.filter(c => c.opts.some(f)).length;
  const chip = ([k, label, f, icon]) => {
    const img = icon && DATA.skin[icon] ? `<img src="images/${esc(DATA.skin[icon])}" alt="">` : '';
    return `<button class="fchip" data-f="${k}" aria-pressed="${state.filters.has(k)}">${img}${label} <span class="n">${count(f)}</span></button>`;
  };
  $('filters').innerHTML = FILTERS.slice(0, 6).map(chip).join('') + '<span class="fsep"></span>' + FILTERS.slice(6).map(chip).join('')
    + (state.filters.size ? '<button class="fchip clear" data-f="__clear">Clear filters</button>' : '');
}
function setupFilters() {
  $('filters').addEventListener('click', e => {
    const b = e.target.closest('.fchip'); if (!b) return;
    const k = b.dataset.f;
    if (k === '__clear') state.filters.clear();
    else if (state.filters.has(k)) state.filters.delete(k);
    else { state.filters.add(k); if (k === 'large') state.filters.delete('small'); if (k === 'small') state.filters.delete('large'); }
    renderFilters(); renderRoster();
  });
}

/* ---------- Aperçu rapide au survol d'une carte du roster ---------- */
function previewHtml(card) {
  const o = card.opts[0], st = c => statOf(o.u, c), ic = c => DATA.statIcons[c] ? `<img src="images/${esc(DATA.statIcons[c])}" alt="">` : '';
  const tab = DATA.tabs.find(t => t.key === card.t);
  const row = (c, label, v) => v == null ? '' : `<span>${ic(c)}${label}</span><b>${v}</b>`;
  const tags = (DATA.tags[o.u] || []).slice(0, 4).map(([n, s]) => {
    const neg = s.includes('negative'), img = neg ? DATA.skin.effNeg : DATA.skin.effPos;
    return `<span class="${neg ? 'neg' : ''}">${img ? `<img src="images/${esc(img)}" alt="">` : (neg ? '▼ ' : '▲ ')}${esc(n)}</span>`; }).join('');
  const tier = !isChar(o) && st('tier');
  return `<h5>${esc(card.n)}</h5>
    <div class="t">${o.ic ? `<img src="images/${esc(o.ic)}" alt="">` : ''}${esc(card.grp || (tab ? tab.name : ''))}${tier ? ` · tier ${ROMAN[tier]}` : ''} · ${fmt(card.min)}</div>
    <div class="g">${row('health', 'Health', st('health') != null ? fmt(st('health')) : null)}${row('armour', 'Armour', st('armour'))}
      ${row('melee_attack', 'Melee attack / defence', st('melee_attack') != null ? `${st('melee_attack')} / ${st('melee_defence')}` : null)}
      ${row('weapon_strength', 'Weapon strength', st('weapon_strength') != null ? `${st('weapon_strength')}${st('weapon_ap_damage') ? ` (AP ${st('weapon_ap_damage')})` : ''}` : null)}
      ${row('speed', 'Speed', st('speed'))}${st('range') != null ? row('range', 'Range', st('range')) + row('missile_strength', 'Missile strength', st('missile_strength')) : ''}</div>
    ${tags ? `<div class="tg">${tags}</div>` : ''}`;
}
function setupPreview() {
  const pv = $('preview'); let timer = null;
  $('sections').addEventListener('mouseover', e => {
    const el = e.target.closest('.card'); if (!el || drag) return;
    clearTimeout(timer);
    timer = setTimeout(() => {
      const card = roster().find(c => c.id === el.dataset.cardId); if (!card) return;
      pv.innerHTML = previewHtml(card); pv.hidden = false;
      const r = el.getBoundingClientRect(), w = pv.offsetWidth, h = pv.offsetHeight;
      pv.style.left = (r.right + 10 + w > window.innerWidth ? r.left - w - 10 : r.right + 10) + 'px';
      pv.style.top = Math.max(8, Math.min(window.innerHeight - h - 8, r.top)) + 'px';
    }, 350);
  });
  $('sections').addEventListener('mouseout', e => { if (e.target.closest('.card')) { clearTimeout(timer); pv.hidden = true; } });
  document.addEventListener('dragstart', () => { clearTimeout(timer); pv.hidden = true; });
}

/* ---------- Réglages d'affichage (mémorisés dans le navigateur) ---------- */
const SETTINGS_KEY = 'tww3-builder:settings';
const settings = Object.assign({ tiers: false }, (() => { try { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'); } catch { return {}; } })());
function applySettings() {
  document.body.classList.toggle('show-tiers', settings.tiers);
  $('optTiers').checked = settings.tiers;
}
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch {} applySettings(); }

/* ---------- Onglets Composition / Matchup, panneaux repliables ---------- */
function setTab(which) {
  [['comp', 'tabComp', 'composition'], ['match', 'tabMatch', 'matchup'], ['caps', 'tabCaps', 'capsTab']].forEach(([k, tab, panel]) => {
    $(tab).setAttribute('aria-selected', String(which === k)); $(panel).hidden = which !== k;
  });
}
function setPanels() {
  const l = !!settings.hideLeft, r = !!settings.hideRight;
  $('layout').classList.toggle('hide-left', l); $('layout').classList.toggle('hide-right', r);
  $('showLeft').hidden = !l; $('showRight').hidden = !r;
}

/* ---------- Barre d'outils ---------- */
function renderTools() {
  $('undoBtn').disabled = !history.past.length; $('redoBtn').disabled = !history.future.length;
  if (document.activeElement !== $('armyName')) $('armyName').value = state.name;
  if (document.activeElement !== $('armyNotes')) $('armyNotes').value = state.notes;
  ['saveBtn', 'shareBtn', 'exportBtn', 'pngBtn', 'clearArmy'].forEach(id => { $(id).disabled = !state.army.length; });
}
function setupTools() {
  // icônes du jeu sur les boutons (sinon leur libellé texte)
  document.querySelectorAll('.tb.ib[data-icon]:not(.svg)').forEach(b => {
    const src = DATA.skin[b.dataset.icon];
    if (src) b.innerHTML = `<img src="images/${esc(src)}" alt="${esc(b.textContent)}">`; else b.classList.add('noicon');
  });
  // menu « More » et volet des plafonds
  const menu = $('moreMenu');
  const closeAll = () => { menu.hidden = true; $('moreBtn').setAttribute('aria-expanded', 'false'); };
  $('moreBtn').addEventListener('click', e => { e.stopPropagation(); const open = menu.hidden; closeAll(); menu.hidden = !open; $('moreBtn').setAttribute('aria-expanded', String(open)); });
  document.addEventListener('click', e => { if (!e.target.closest('#moreMenu')) closeAll(); });
  menu.addEventListener('click', e => { if (e.target.closest('button.mi')) closeAll(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });
  // réglages d'affichage
  $('optTiers').addEventListener('change', e => { settings.tiers = e.target.checked; saveSettings(); });
  applySettings();
  // onglets et panneaux repliables
  $('tabComp').addEventListener('click', () => setTab('comp')); $('tabMatch').addEventListener('click', () => setTab('match'));
  $('tabCaps').addEventListener('click', () => setTab('caps'));
  $('hideLeft').addEventListener('click', () => { settings.hideLeft = true; saveSettings(); setPanels(); });
  $('hideRight').addEventListener('click', () => { settings.hideRight = true; saveSettings(); setPanels(); });
  $('showLeft').addEventListener('click', () => { settings.hideLeft = false; saveSettings(); setPanels(); });
  $('showRight').addEventListener('click', () => { settings.hideRight = false; saveSettings(); setPanels(); });
  setTab('comp'); setPanels();
  setupFilters(); setupPreview();
  $('undoBtn').addEventListener('click', undo); $('redoBtn').addEventListener('click', redo);
  $('armyName').addEventListener('change', e => { commit(); state.name = e.target.value; renderTools(); });
  $('armyNotes').addEventListener('change', e => { commit(); state.notes = e.target.value; renderTools(); });
  $('notesBtn').addEventListener('click', () => {
    const n = $('armyNotes'); n.hidden = !n.hidden; $('notesBtn').setAttribute('aria-expanded', String(!n.hidden)); if (!n.hidden) n.focus();
  });
  $('saveBtn').addEventListener('click', saveFavourite);
  $('armiesBtn').addEventListener('click', showFavourites);
  $('shareBtn').addEventListener('click', async () => {
    const link = shareLink();
    try { await navigator.clipboard.writeText(link); flash('Link copied to the clipboard.', true); }
    catch { openModal(`<h3 class="serif">Share this army</h3><p class="muted">Copy this link:</p><div class="modal-row"><input type="text" id="shareInput" readonly></div>`);
      $('shareInput').value = link; $('shareInput').select(); }
  });
  $('exportBtn').addEventListener('click', exportArmySetup);
  $('importBtn').addEventListener('click', async () => { if (!(gameDir && await importFromFolder())) pickFile(); });
  $('folderBtn').addEventListener('click', folderMenu);
  initGameFolder();
  $('importFile').addEventListener('change', e => { const f = e.target.files[0]; if (f) importArmySetup(f); e.target.value = ''; });
  $('pngBtn').addEventListener('click', exportPng);
  $('helpBtn').addEventListener('click', () => showHelp(false));
  $('templatesBtn').addEventListener('click', () => showTemplates());
  $('modalClose').addEventListener('click', closeModal);
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$('modal').hidden) { closeModal(); return; }
    if (e.target.closest('input, textarea, select')) return;
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    else if (mod && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
    else if (mod && e.key.toLowerCase() === 'd' && state.focus && state.focus.kind === 'army') { e.preventDefault(); duplicateUnit(state.focus.unit); }
  });
}

/* ---------- Race : changement, couleur d'accent et illustration ---------- */
/* factions interdites dans la plupart des tournois (codes de faction) : un bandeau d'avertissement s'affiche */
const TOURNAMENT_BANNED = ['UL'];
const isBanned = r => TOURNAMENT_BANNED.some(c => (DATA.factionCodes || {})[c] === r.key);
function setRace(i, { keepArmy = false, record = true } = {}) {
  if (record && (state.army.length || state.raceIndex !== i)) commit();
  state.raceIndex = (i + DATA.races.length) % DATA.races.length;
  if (!keepArmy) state.army = [];
  state.focus = null; state.filters.clear();
  const r = race(), root = document.documentElement;
  if (r.accent) root.style.setProperty('--accent', '#' + r.accent); else root.style.removeProperty('--accent');
  if (r.art) root.style.setProperty('--race-art', `url("images/${r.art}")`); else root.style.removeProperty('--race-art');
  document.body.classList.toggle('has-art', !!r.art);
  $('metaLink').href = 'meta.html?race=' + raceSlug(r);
  $('banWarn').hidden = !isBanned(r);
  if (isBanned(r)) $('banWarn').innerHTML = `<strong>⚠ Banned in most tournaments</strong><span>${esc(r.name)} is not allowed in the majority of tournaments. Check the rules of your event before building with it.</span>`;
  renderAll();
}
/* identifiant de race dans les adresses, partagé avec meta.html : « The Empire » -> the-empire */
const raceSlug = r => r.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

/* menu déroulant des races (liste personnalisée : une illustration par race) — clavier : ↑ ↓ Entrée Échap */
function setupRacePicker() {
  const btn = $('raceButton'), list = $('raceList');
  let active = 0;
  list.innerHTML = DATA.races.map((r, i) =>
    `<li role="option" class="race-opt" data-i="${i}" id="race-opt-${i}">` +
    `<span class="race-strip" style="background-image:${r.race_image ? `url('images/${esc(r.race_image)}')` : 'none'}"></span>` +
    `<span class="race-label serif">${esc(r.name)}</span></li>`).join('');
  const items = [...list.children];
  const highlight = i => { active = (i + items.length) % items.length; items.forEach((el, j) => el.classList.toggle('active', j === active));
    items[active].scrollIntoView({ block: 'nearest' }); list.setAttribute('aria-activedescendant', items[active].id); };
  const open = () => { list.hidden = false; btn.setAttribute('aria-expanded', 'true');
    items.forEach((el, j) => el.setAttribute('aria-selected', String(j === state.raceIndex))); highlight(state.raceIndex); list.tabIndex = -1; list.focus(); };
  const close = (focusBtn = true) => { list.hidden = true; btn.setAttribute('aria-expanded', 'false'); if (focusBtn) btn.focus(); };
  const choose = i => { close(); if (i !== state.raceIndex) setRace(i); };
  btn.addEventListener('click', () => (list.hidden ? open() : close()));
  items.forEach((el, i) => el.addEventListener('click', () => choose(i)));
  list.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); highlight(active + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); highlight(active - 1); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(active); }
    else if (e.key === 'Escape' || e.key === 'Tab') close(e.key === 'Escape');
  });
  document.addEventListener('click', e => { if (!list.hidden && !e.target.closest('.race-picker')) close(false); });
}

function trackArmyHeight() {
  const army = document.querySelector('.layout > .army');
  const set = () => document.documentElement.style.setProperty('--army-h', army.offsetHeight + 'px');
  if ('ResizeObserver' in window) new ResizeObserver(set).observe(army); set();
}

function init() {
  setupRacePicker();
  $('clearArmy').addEventListener('click', () => { if (!state.army.length) return; commit(); state.army = []; state.focus = null; renderAll(); });
  setupTools();
  $('footer').textContent = `Data: Total War: WARHAMMER III game files (${DATA.patch.replace('patch_', 'patch ')}), ` +
    `budget ${fmt(DATA.budget)}, up to ${DATA.maxUnits} units. Experience rank costs are estimates. ` +
    `Unofficial fan-made tool, not affiliated with Creative Assembly or Games Workshop.`;
  setupDragAndDrop();
  setupTooltips();
  trackArmyHeight();
  if (!loadFromHash()) {
    const wanted = new URLSearchParams(location.search).get('race');
    setRace(Math.max(0, DATA.races.findIndex(r => raceSlug(r) === wanted || r.key === wanted)), { record: false });
  }
}
init();
</script>
