<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TWW3 – Army Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ---------- Jetons de couleur (sombre par défaut, comme l'écran du jeu) ----------
   --accent : couleur de la race affichée (couleur officielle de sa faction principale), injectée par le script */
:root {
  --bg: #1d1614; --panel: #2a1e1a; --panel-2: #33241f; --crimson: #7f1a15; --crimson-hi: #a3261e;
  --bronze: #8c6a3b; --gold: #e2b65a; --text: #eadfc8; --muted: #a8977d; --danger: #ff6b5a; --ok: #7fc77f;
  --card-ink: #f4ead6; --shadow: rgba(0, 0, 0, .45); --accent: #a3261e;
  --band: color-mix(in srgb, var(--accent) 45%, #3a0d0b);
  color-scheme: dark;
}
/* ---------- Base ---------- */
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: "Alegreya Sans", "Segoe UI", system-ui, sans-serif; font-size: 15px; line-height: 1.4;
}
/* illustration de la race en fond (si disponible), très atténuée */
/* illustration de campagne de la race en fond (plein écran, fixe, fondue) + vignettage pour la lisibilité */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background: var(--race-art, none) center / cover no-repeat; opacity: .4;
}
body::after {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(ellipse at 50% 35%, transparent 0%, rgba(29,22,20,.35) 65%, rgba(29,22,20,.85) 100%);
}
/* panneaux légèrement transparents quand une illustration est affichée */
body.has-art .topbar { background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 22%, rgba(42,30,26,.75)), rgba(42,30,26,.72) 60%); }
body.has-art .army { background: rgba(51,36,31,.72); }
body.has-art .side { background: rgba(42,30,26,.78); }
body.has-art .custom { background: rgba(29,22,20,.6); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.serif { font-family: "Cinzel", Georgia, "Times New Roman", serif; }
.muted { color: var(--muted); font-size: 13px; }
.empty { color: var(--muted); }

/* ---------- Bandeau du haut ---------- */
.topbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 12px 20px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 22%, var(--panel)), var(--panel) 60%);
  border-bottom: 2px solid var(--accent);
}
.race-picker { position: relative; width: 340px; max-width: 100%; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px 18px; }
/* factions interdites dans la plupart des tournois : bandeau d'avertissement sous le bandeau du haut */
.ban-warn { display: flex; align-items: center; justify-content: center; gap: 4px 16px; flex-wrap: wrap; padding: 12px 20px; text-align: center;
  background: repeating-linear-gradient(135deg, rgba(255,107,90,.18) 0 16px, transparent 16px 32px), #4a1410; border-bottom: 2px solid var(--danger); }
.ban-warn[hidden] { display: none; }
.ban-warn strong { font: 700 clamp(18px, 2.4vw, 26px) "Cinzel", Georgia, serif; color: #ffd2cb; letter-spacing: .04em; text-transform: uppercase; }
.ban-warn span { color: #f4ead6; font-size: 15px; }
/* navigation entre les pages du site (même style sur meta.html et overview.html) */
.site-nav { display: flex; gap: 2px; background: rgba(0,0,0,.3); border: 1px solid rgba(140,106,59,.6); border-radius: 4px; padding: 2px; }
.site-nav a { padding: 5px 12px; border-radius: 3px; color: var(--muted); text-decoration: none; font-weight: 500; white-space: nowrap; }
.site-nav a:hover { color: var(--text); }
.site-nav a[aria-current="page"] { background: var(--crimson); color: #f4ead6; }
@media (max-width: 640px) { .site-nav a { padding: 5px 8px; font-size: 14px; } }
/* menu des races : chaque race est représentée par son illustration du jeu (fondue à gauche) */
.race-btn, .race-opt { position: relative; display: block; width: 100%; height: 56px; padding: 0; border: 1px solid var(--bronze);
  background: #140f0d; color: var(--text); cursor: pointer; text-align: left; overflow: hidden; }
.race-btn { border-radius: 4px; }
.race-strip { position: absolute; inset: 0; background-size: cover; background-position: right center; opacity: .85;
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, transparent 18%, #000 55%); mask-image: linear-gradient(90deg, transparent 0%, transparent 18%, #000 55%); }
.race-label { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 19px; font-weight: 700; text-shadow: 0 1px 3px #000; }
.race-btn .caret { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 14px; text-shadow: 0 0 3px #000; }
.race-list { position: absolute; z-index: 50; top: 60px; left: 0; right: 0; max-height: 70vh; overflow-y: auto; margin: 0; padding: 0; list-style: none;
  background: var(--panel); border: 1px solid var(--bronze); border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.6); }
.race-list[hidden] { display: none; }
.race-opt { border: none; border-top: 1px solid rgba(140,106,59,.4); }
.race-opt:hover .race-strip, .race-opt.active .race-strip, .race-btn:hover .race-strip { opacity: 1; }
.race-opt[aria-selected="true"] { outline: 2px solid var(--gold); outline-offset: -2px; }
.funds .value { font-size: 24px; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
.funds .value.over { color: var(--danger); }
.coin-img { width: 20px; height: 20px; margin-right: 6px; vertical-align: -3px; }
.coin { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 6px; vertical-align: -1px;
  background: radial-gradient(circle at 35% 35%, #ffe7a3, var(--gold) 60%, #7a5418); }

/* ---------- Armée ---------- */
.army { padding: 12px 20px 14px; background: color-mix(in srgb, var(--panel-2) 92%, transparent); border-bottom: 1px solid var(--bronze); }
.army.drop-ok { box-shadow: inset 0 0 0 2px var(--gold); }
.army-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px;
  margin: -12px -20px 12px; padding: 6px 20px; background: var(--band); color: #f4ead6; }
.army-name { flex: 1 1 220px; max-width: 360px; font: 700 16px "Cinzel", Georgia, serif; color: #f4ead6; background: rgba(0,0,0,.2);
  border: 1px solid transparent; border-radius: 3px; padding: 2px 6px; }
.army-name:hover, .army-name:focus { border-color: rgba(244,234,214,.5); outline: none; }
.army-name::placeholder { color: rgba(244,234,214,.6); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.toolbar .count { margin-right: 6px; font-variant-numeric: tabular-nums; }
.tb { background: rgba(0,0,0,.2); border: 1px solid rgba(244,234,214,.45); color: #f4ead6; border-radius: 4px; padding: 2px 9px; cursor: pointer; font-size: 13.5px; }
.tb:hover:not(:disabled) { background: rgba(0,0,0,.4); }
.tb:disabled { opacity: .4; cursor: default; }
.tb.primary { border-color: var(--gold); }
.notes { width: 100%; min-height: 64px; margin: 0 0 10px; resize: vertical; background: var(--panel); color: var(--text);
  border: 1px solid var(--bronze); border-radius: 4px; padding: 6px 8px; font: inherit; font-size: 14px; }
.notes[hidden] { display: none; }
.slot.drop-before .card { box-shadow: -4px 0 0 var(--gold); }
/* fenêtre (aide, favoris) */
.modal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.6); padding: 16px; }
.modal[hidden] { display: none; }
.modal-box { position: relative; width: min(560px, 100%); max-height: 85vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--bronze);
  border-radius: 6px; padding: 18px 20px; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
.modal-box h3 { margin: 0 0 10px; font-size: 18px; }
.modal-box ol { padding-left: 20px; } .modal-box li { margin-bottom: 6px; }
.modal-box code { background: rgba(0,0,0,.35); padding: 1px 5px; border-radius: 3px; font-size: 13px; word-break: break-all; }
.modal-close { position: absolute; top: 8px; right: 10px; background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; }
.fav { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid rgba(140,106,59,.35); }
.fav .info { flex: 1; min-width: 0; } .fav .info b { display: block; } .fav .info span { font-size: 12.5px; color: var(--muted); }
.modal-row { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.modal-row input[type=text] { flex: 1; min-width: 0; background: var(--panel-2); color: var(--text); border: 1px solid var(--bronze); border-radius: 3px; padding: 5px 7px; font: inherit; }
/* info-bulle des sorts, capacités et objets */
.tip { position: fixed; z-index: 120; max-width: 330px; pointer-events: none; background: #1b1310; border: 1px solid var(--bronze);
  border-radius: 4px; padding: 8px 10px; box-shadow: 0 6px 20px rgba(0,0,0,.6); font-size: 13.5px; }
.tip[hidden] { display: none; }
.tip h5 { margin: 0 0 4px; font: 700 15px "Cinzel", Georgia, serif; color: var(--gold); }
.tip .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
.tip .meta b { color: var(--text); font-weight: 500; }
.tip .dmg { margin: 0 0 6px; padding: 5px 8px; border-radius: 4px; background: rgba(0,0,0,.3); border: 1px solid rgba(140,106,59,.45); }
.tip .dmg .k { font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.tip .dmg .v { display: flex; flex-wrap: wrap; gap: 2px 12px; } .tip .dmg .v span { display: inline-flex; align-items: center; gap: 4px; }
.tip .dmg .v img { width: 15px; height: 15px; } .tip .dmg .v b { color: #f6d58a; }
.tip .dmg .per { font-size: 12.5px; color: var(--muted); }
.tip ul { margin: 0; padding-left: 16px; } .tip li { margin: 1px 0; }
.tip li.pos { color: #8bd34a; } .tip li.neg { color: #ff7a6a; }
[data-tip] { cursor: help; }
.slots { display: grid; grid-template-columns: repeat(20, 60px); justify-content: space-between; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
.slot { display: flex; flex-direction: column; align-items: center; gap: 3px; }
/* cartes de l'armée au format du jeu (60 x 130) ; le roster garde des cartes plus petites */
.slots .card { --cw: 60px; --ch: 130px; }
.slots .card.skinned .semi { width: 55px; left: 2px; }
.slots .card.skinned .cat-icon { width: 22px; height: 22px; left: 19px; }
.slot .card { flex: none; }
.slot-empty.skin { border: none; opacity: 1; background: var(--slot-img) center / 100% 100% no-repeat; }
.slots .slot-empty { width: 60px; height: 130px; }
.slot-empty { flex: 0 0 50px; height: 108px; border: 1px dashed var(--bronze); border-radius: 4px; opacity: .45; }
.rank-ctl { display: flex; align-items: center; justify-content: center; gap: 1px; width: 60px; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.rank-ctl button { width: 18px; height: 17px; line-height: 1; padding: 0; border: 1px solid var(--bronze); border-radius: 3px; background: var(--panel); cursor: pointer; }
.rank-ctl button:disabled { opacity: .35; cursor: default; }
.rank-ctl span { min-width: 16px; text-align: center; color: var(--muted); }
.army-status { margin: 10px 0 0; font-size: 14px; }
.army-status .ok { color: var(--ok); font-weight: 700; }
.army-status .ko { color: var(--danger); font-weight: 700; }
.army-status ul { margin: 4px 0 0; padding-left: 18px; color: var(--danger); }
.caps { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 8px; }
.cap-chip { font-size: 12.5px; border: 1px solid var(--bronze); border-radius: 3px; padding: 1px 7px; background: var(--panel); font-variant-numeric: tabular-nums; }
.cap-chip.full { border-color: var(--gold); color: var(--gold); }
.cap-chip.over { border-color: var(--danger); color: var(--danger); font-weight: 700; }
.flash { margin: 8px 0 0; color: var(--danger); font-weight: 700; font-size: 14px; }
.flash.ok { color: var(--ok); }
.army-hint { color: var(--muted); margin: 8px 0 0; font-size: 13.5px; }

/* ---------- Cartes d'unité ---------- */
.card {
  --cw: 50px; --ch: 108px;
  flex: 0 0 var(--cw); width: var(--cw); height: var(--ch); padding: 0; position: relative; cursor: pointer;
  border: 1px solid var(--bronze); border-radius: 4px; overflow: hidden; text-align: center;
  background: var(--card-bg, #4a2c2a); color: var(--card-ink); box-shadow: 0 2px 4px var(--shadow);
  display: flex; flex-direction: column;
}
.card:hover { border-color: var(--gold); }
.card .cost { background: rgba(0,0,0,.6); color: #f6d58a; font-weight: 700; font-size: 11.5px; padding: 1px 0; font-variant-numeric: tabular-nums; }
.card .mono { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; opacity: .9; }
.card .nm { font-size: 9px; line-height: 1.15; padding: 2px 3px 3px; background: rgba(0,0,0,.35); height: 38px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.card .art { flex: 1; min-height: 0; width: 100%; object-fit: cover; object-position: top; display: block; }
.card.has-img .mono, .card.has-img .nm { display: none; }
.card.has-img .cost { position: absolute; top: 0; left: 0; right: 0; z-index: 1; }
.card .badge-opt { position: absolute; top: 20px; right: 3px; font-size: 10px; background: rgba(0,0,0,.6); border-radius: 3px; padding: 0 3px; z-index: 1; }
.card .badge-cap { position: absolute; bottom: 3px; right: 3px; font-size: 10px; font-weight: 700; border-radius: 3px; padding: 0 3px; z-index: 2;
  background: rgba(0,0,0,.75); color: var(--gold); border: 1px solid currentColor; }
.card .badge-cap.full { color: var(--danger); }
/* chevrons de rang : 1-3 bronze, 4-6 argent, 7-9 or (1 à 3 chevrons par palier) */
.card .chevrons { position: absolute; top: 34px; left: 3px; z-index: 2; display: flex; flex-direction: column; gap: 1px; }
.card .chevrons i { display: block; width: 14px; height: 5px; background: var(--chev);
  clip-path: polygon(0 0, 50% 60%, 100% 0, 100% 40%, 50% 100%, 0 40%); filter: drop-shadow(0 0 1px #000); }
.card.blocked { filter: grayscale(.85) brightness(.6); }
/* habillage du jeu (ui/skins/default) quand il est fourni : cadre, demi-cercle et icône de catégorie, sélection, survol */
.card.skinned { border: none; border-radius: 0; box-shadow: none; overflow: visible; background: var(--card-bg, #4a2c2a); }
.card.skinned .art { position: absolute; inset: 0; width: var(--cw); height: var(--ch); }
.card.skinned .ov { position: absolute; top: 0; left: 0; width: var(--cw); height: var(--ch); pointer-events: none; z-index: 3; }
.card.skinned .ov-selected, .card.skinned .ov-hover { display: none; }
.card.skinned.selected { outline: none; }
.card.skinned.selected .ov-selected, .card.skinned:hover .ov-hover { display: block; }
.card.skinned .semi { position: absolute; bottom: 0; left: 2px; width: calc(var(--cw) - 4px); z-index: 4; pointer-events: none; }
.card.skinned .cat-icon { position: absolute; bottom: 0; left: calc(var(--cw) * .3); width: calc(var(--cw) * .38); height: calc(var(--cw) * .38); z-index: 5; pointer-events: none; }
.card.skinned .cost { position: absolute; top: 2px; left: 2px; right: 2px; z-index: 6; background: rgba(0,0,0,.55); }
.card.skinned .badge-opt { top: 18px; z-index: 6; }
/* tier du jeu (I à V) en haut à droite, unités hors lords et héros */
.card .tier { position: absolute; top: 18px; right: 2px; z-index: 7; font-family: "Cinzel", Georgia, serif; font-size: 9.5px; font-weight: 700;
  color: #f6d58a; background: rgba(0,0,0,.65); border: 1px solid var(--bronze); border-radius: 2px; padding: 0 2px; line-height: 1.3; }
.card .tier + .badge-opt, .card .badge-opt { right: auto; left: 2px; }
.card img.tier-img { position: absolute; top: 17px; right: 1px; width: 17px; height: 17px; z-index: 7; pointer-events: none; }
.tags li img { width: 15px; height: 15px; vertical-align: -2px; margin-right: 4px; }
.tags.icons li::before { content: none; }
.stat .lbl { display: flex; align-items: center; gap: 6px; } .stat .lbl img { width: 20px; height: 20px; }
.size-line img { width: 20px; height: 20px; vertical-align: -5px; margin-right: 4px; }
.hpbar { position: relative; display: flex; align-items: center; justify-content: center; gap: 16px; height: 26px; margin: 10px 0 6px;
  border-radius: 3px; overflow: hidden; border: 1px solid #0b0806; box-shadow: 0 0 0 1px rgba(140,106,59,.55), inset 0 1px 0 rgba(255,255,255,.25);
  background: linear-gradient(180deg, #8fd24c 0%, #5aa524 45%, #2f6b12 100%);
  font: 700 14px system-ui, sans-serif; color: #fff; text-shadow: 0 1px 2px #000, 0 0 3px #000; }
.hpbar::before { content: ""; position: absolute; left: 0; top: 0; height: 46%; width: var(--barrier, 0%);
  background: linear-gradient(180deg, #a9ecff, #3aa6d6); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.hpbar span { position: relative; display: inline-flex; align-items: center; gap: 4px; } .hpbar img { width: 16px; height: 16px; }
.hpbar .barrier { color: #d9f6ff; }
.stat > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.stat { grid-template-columns: minmax(0, 1fr) auto 46px; }
.stat .v { display: inline-flex; align-items: center; justify-content: flex-end; white-space: nowrap; }
.stat .v .mod { display: inline-flex; align-items: center; gap: 1px; margin-right: 4px; color: var(--muted); font-size: 11px; }
.stat .v .mod img { width: 15px; height: 15px; }
.tip li img { width: 13px; height: 13px; vertical-align: -2px; margin-right: 3px; } .tip ul.icons { list-style: none; padding-left: 0; }
/* résumé de l'armée, à droite des emplacements */
.matchup select { width: 100%; background: #140f0d; color: var(--text); border: 1px solid var(--bronze); border-radius: 3px; padding: 5px 8px; font: inherit; font-weight: 700; }
.radar { width: 100%; max-width: 330px; height: auto; display: block; margin: 6px auto 0; }
.radar .g { fill: none; stroke: rgba(140,106,59,.45); stroke-width: 1; }
.radar text { fill: var(--muted); font-size: 11px; font-family: "Alegreya Sans", system-ui, sans-serif; }
.radar .me { fill: color-mix(in srgb, var(--gold) 28%, transparent); stroke: var(--gold); stroke-width: 2; }
.radar .en { fill: rgba(91,143,214,.18); stroke: #5b8fd6; stroke-width: 1.5; stroke-dasharray: 4 3; }
.radar-legend { font-size: 12px; color: var(--muted); text-align: center; } .radar-legend i { display: inline-block; width: 10px; height: 10px; margin: 0 4px 0 8px; vertical-align: -1px; }
.keypoints summary { cursor: pointer; font: 700 14px "Cinzel", Georgia, serif; margin: 10px 0 6px; }
.keypoints .kp { font-size: 13px; padding: 5px 7px; margin-bottom: 5px; border-left: 3px solid var(--bronze); background: rgba(0,0,0,.2); }
.keypoints .kp.warn { border-color: var(--danger); } .keypoints .kp.good { border-color: var(--ok); }
.patch { font: 600 12px system-ui, sans-serif; letter-spacing: .04em; color: var(--muted); border: 1px solid rgba(140,106,59,.6); border-radius: 12px; padding: 2px 9px; background: rgba(0,0,0,.3); white-space: nowrap; }
.patch b { color: var(--text); }
/* fonds (or) et modèles (acier) : deux tuiles distinctes, mises en avant */
.tiles { display: flex; flex-direction: column; gap: 8px; }
.tile { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 1px 10px; min-width: 200px; padding: 7px 12px; border-radius: 6px; border: 1px solid; }
.tile .ico { grid-row: 1 / 3; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
.tile .ico img { width: 32px; height: 32px; }
.tile .l { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; }
.tile b { font: 700 26px "Cinzel", Georgia, serif; line-height: 1; font-variant-numeric: tabular-nums; }
.tile small { font: 500 14px system-ui, sans-serif; opacity: .75; }
.tile .tbar { grid-column: 1 / 3; height: 5px; border-radius: 3px; background: rgba(0,0,0,.45); overflow: hidden; margin-top: 4px; }
.tile .tbar i { display: block; height: 100%; }
.tile.funds { border-color: var(--gold); background: linear-gradient(135deg, rgba(226,182,90,.18), rgba(0,0,0,.35)); }
.tile.funds .l { color: var(--gold); } .tile.funds b { color: #f6d58a; } .tile.funds b.over { color: var(--danger); } .tile.funds .tbar i { background: var(--gold); }
.tile.models { border-color: #9fb4c8; background: linear-gradient(135deg, rgba(159,180,200,.16), rgba(0,0,0,.35)); }
.tile.models .l { color: #b9cad8; } .tile.models b { color: #e6eef5; }
@media (max-width: 1100px) { .patch { display: none; } }
/* bandeau de l'armée : toujours visible (collé en haut pendant le défilement), cartes + budget à gauche, tuiles à droite */
.layout > .army { position: sticky; top: 0; z-index: 25; box-shadow: 0 6px 16px rgba(0,0,0,.45); }
body .layout > .army, body.has-art .layout > .army { background: rgba(43, 32, 28, .97); backdrop-filter: blur(6px); }   /* opaque : le roster ne transparaît pas en défilant */
.layout > .side.left { top: var(--army-h, 0px); max-height: calc(100vh - var(--army-h, 0px)); }
.army-body { display: grid; grid-template-columns: minmax(0, auto) minmax(200px, 1fr); gap: 16px; align-items: start; }
.army-main { min-width: 0; }
@media (max-width: 1500px) { .army-body { grid-template-columns: 1fr; } .tiles { flex-direction: row; } }
/* en-tête de l'armée : nom en titre, alerte de validité, boutons homogènes regroupés */
.army-head { background: linear-gradient(180deg, color-mix(in srgb, var(--band) 90%, #fff 6%), color-mix(in srgb, var(--band) 75%, #000)); border-bottom: 2px solid var(--gold); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
.army-name { font-size: 18px; background: transparent; }
.army-alert { display: inline-flex; align-items: center; gap: 5px; background: #6b1d17; border: 1px solid var(--danger); color: #ffd9d3; border-radius: 12px; padding: 1px 10px; font: 700 12.5px system-ui, sans-serif; cursor: pointer; }
.army-alert[hidden] { display: none; }
.toolbar { margin-left: auto; gap: 10px; }
.grp { display: inline-flex; gap: 4px; padding: 3px; border-radius: 7px; background: rgba(0,0,0,.25); border: 1px solid rgba(244,234,214,.18); }
.tb.ib { width: 36px; height: 36px; border-radius: 5px; background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.25)); }
.tb.ib:hover:not(:disabled) { border-color: var(--gold); }
.tb.prim { height: 36px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; border-radius: 5px; border: 1px solid var(--gold);
  background: linear-gradient(180deg, #b88a2a, #7a5a16); color: #fff3d4; font: 700 14px "Cinzel", Georgia, serif; }
.tb.prim:hover:not(:disabled) { filter: brightness(1.1); }
/* budget : barre épaisse, icône + rôle + montant dans chaque segment */
.budget { display: flex; height: 42px; border-radius: 5px; overflow: hidden; background: rgba(0,0,0,.4); border: 1px solid rgba(140,106,59,.55); margin-top: 10px; }
.budget .seg { display: flex; align-items: center; gap: 7px; padding: 0 8px; min-width: 0; overflow: hidden; white-space: nowrap;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 42%, #120d0b), color-mix(in srgb, var(--c) 22%, #120d0b)); border-right: 2px solid #211613; border-top: 3px solid var(--c); }
.budget .bico { flex: 0 0 26px; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.35); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 60%, transparent); }
.budget .btxt { display: flex; flex-direction: column; min-width: 0; } .budget .btxt b { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; color: #f4ead6; } .budget .btxt span { font-size: 11.5px; color: #d8cbb2; }
.budget .bpc { display: none; font: 700 12px system-ui; color: #f4ead6; }
.budget .seg.mid .btxt { display: none; } .budget .seg.mid .bpc { display: block; }
.budget .seg.tiny { padding: 0; justify-content: center; } .budget .seg.tiny .btxt, .budget .seg.tiny .bpc { display: none; }
.budget .seg.tiny .bico { flex-basis: 22px; width: 22px; height: 22px; } .budget .seg.tiny svg { width: 14px; height: 14px; }
.budget .rest { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 44px; color: var(--muted); font-size: 11px;
  background: repeating-linear-gradient(135deg, rgba(255,255,255,.03) 0 6px, transparent 6px 12px); }
.budget .rest b { font: 700 13px "Cinzel", Georgia, serif; color: var(--gold); }
/* onglets du panneau de droite, panneaux repliables */
.tabs { display: flex; gap: 4px; margin: 0 0 10px; border-bottom: 1px solid var(--bronze); padding-right: 26px; }
.tab { background: none; border: 1px solid transparent; border-bottom: none; border-radius: 4px 4px 0 0; padding: 5px 12px; font: 700 14px "Cinzel", Georgia, serif; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { color: var(--text); border-color: var(--bronze); background: rgba(0,0,0,.25); margin-bottom: -1px; }
.side { position: sticky; }
.collapse { position: absolute; top: 10px; right: 8px; z-index: 3; width: 22px; height: 22px; padding: 0; border: 1px solid var(--bronze); border-radius: 3px; background: var(--panel-2); color: var(--muted); cursor: pointer; font-size: 11px; }
.side.left .collapse { right: 8px; } .side.right .collapse { left: auto; right: 8px; }
.layout.hide-left { grid-template-columns: 0 minmax(0, 1fr) 380px; } .layout.hide-right { grid-template-columns: 300px minmax(0, 1fr) 0; }
.layout.hide-left.hide-right { grid-template-columns: 0 minmax(0, 1fr) 0; }
.layout.hide-left .side.left, .layout.hide-right .side.right { visibility: hidden; overflow: hidden; min-width: 0; width: 0; padding: 0; border: 0; }
.reopen { position: fixed; top: 50%; z-index: 30; width: 22px; height: 60px; padding: 0; border: 1px solid var(--bronze); background: var(--panel-2); color: var(--gold); cursor: pointer; }
.reopen.left { left: 0; border-radius: 0 4px 4px 0; } .reopen.right { right: 0; border-radius: 4px 0 0 4px; }
.reopen[hidden] { display: none; }
/* barre d'outils : icônes du jeu */
.count { background: none; border: none; color: #f4ead6; font: 700 15px "Cinzel", Georgia, serif; cursor: default; padding: 0 4px; }
.count.invalid { color: #ff9b8f; cursor: pointer; }
.count .bang { display: inline-block; width: 18px; height: 18px; line-height: 18px; text-align: center; border-radius: 50%; background: var(--danger); color: #fff; font: 700 12px system-ui; margin-left: 5px; }
.tb.ib { width: 34px; height: 34px; padding: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 0; }
.tb.ib img { width: 24px; height: 24px; }
.tb.ib.noicon { width: auto; padding: 2px 9px; font-size: 13.5px; }
.tb.txt { height: 34px; padding: 0 12px; font-weight: 700; }
.tb.primary { color: #f6d58a; }
.tb[aria-expanded="true"] { border-color: var(--gold); background: rgba(226,182,90,.22); }
.tb .badge { background: var(--gold); color: #211613; border-radius: 8px; padding: 0 6px; font-size: 12px; margin-left: 4px; }
.sep { width: 1px; height: 26px; background: rgba(244,234,214,.3); margin: 0 4px; }
.more { position: relative; }
.menu { position: absolute; right: 0; top: 40px; z-index: 60; width: 280px; background: #1b1310; border: 1px solid var(--gold); border-radius: 5px; padding: 6px 0; box-shadow: 0 10px 30px rgba(0,0,0,.6); color: var(--text); }
.menu[hidden] { display: none; }
.menu h5 { margin: 4px 12px 2px; font: 700 11px system-ui; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.menu hr { border: none; border-top: 1px solid rgba(140,106,59,.4); margin: 5px 0; }
.mi { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 12px; background: none; border: none; color: inherit; font: inherit; font-size: 14px; text-align: left; cursor: pointer; }
.mi:hover:not(:disabled) { background: rgba(226,182,90,.12); } .mi:disabled { opacity: .4; cursor: default; } .mi small { color: var(--muted); } .mi[hidden] { display: none; }
input.sw { appearance: none; width: 30px; height: 16px; border-radius: 8px; background: #6b6155; position: relative; cursor: pointer; flex: 0 0 auto; }
input.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #eadfc8; transition: left .15s; }
input.sw:checked { background: var(--ok); } input.sw:checked::after { left: 16px; }
.mi input[type=range] { width: 110px; accent-color: var(--gold); }
/* bandeau de l'armée sur toute la largeur : 20 emplacements, cartes au ratio du jeu */
.army { position: relative; }
.slots { display: grid; grid-template-columns: repeat(20, 60px); gap: 3px; justify-content: start; }
.slots .card, .slots .slot-empty { --cw: 60px; --ch: 130px; }   /* taille native des images du jeu : cartes nettes */
.slots .slot-empty { width: var(--cw); height: var(--ch); flex: none; }
.slots .card .cost { font-size: 13px; }

.caps-tab[hidden] { display: none; } .caps-tab .caps { margin: 0; }
.tab .badge { background: var(--gold); color: #211613; border-radius: 8px; padding: 0 6px; font: 700 11px system-ui; margin-left: 3px; }
.tab .badge[hidden] { display: none; }
/* réglages d'affichage */
body:not(.show-tiers) .card .tier, body:not(.show-tiers) .card img.tier-img { display: none; }
/* filtres rapides du roster */
.roster-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 10px; }
.roster-head h2 { margin: 0 !important; }
.filters { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.fchip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--bronze); border-radius: 14px; padding: 2px 10px; font-size: 13px; background: rgba(0,0,0,.25); color: var(--text); cursor: pointer; }
.fchip img { width: 16px; height: 16px; } .fchip .n { color: var(--muted); font-size: 11.5px; }
.fchip[aria-pressed="true"] { border-color: var(--gold); color: #f6d58a; background: rgba(226,182,90,.18); }
.fchip.clear { border-style: dashed; color: var(--muted); }
.fsep { width: 1px; height: 18px; background: rgba(140,106,59,.5); margin: 0 3px; }
.card.dim { opacity: .22; filter: grayscale(.8); } .card.dim:hover { opacity: .6; }
.section-head .n .hit { color: var(--gold); }
/* « ×2 » : déjà dans l'armée */
.card .in-army { position: absolute; left: 2px; top: 18px; z-index: 8; background: var(--gold); color: #211613; font: 700 11px system-ui; border-radius: 8px; padding: 0 6px; pointer-events: none; }
/* aperçu rapide au survol */
.preview { position: fixed; z-index: 90; width: 260px; pointer-events: none; background: #1b1310; border: 1px solid var(--bronze); border-radius: 5px; padding: 8px 10px; box-shadow: 0 8px 24px rgba(0,0,0,.6); font-size: 13px; }
.preview[hidden] { display: none; }
.preview h5 { margin: 0 0 2px; font: 700 15px "Cinzel", Georgia, serif; color: var(--gold); }
.preview .t { color: var(--muted); font-size: 12.5px; margin-bottom: 6px; display: flex; align-items: center; gap: 5px; } .preview .t img { width: 16px; height: 16px; }
.preview .g { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; } .preview .g span { display: flex; align-items: center; gap: 5px; } .preview .g img { width: 16px; height: 16px; }
.preview .g b { font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; }
.preview .tg { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 12.5px; } .preview .tg span { color: #8bd34a; } .preview .tg span.neg { color: #ff7a6a; } .preview .tg img { width: 12px; height: 12px; vertical-align: -1px; margin-right: 3px; }
/* notifications */
.toasts { position: fixed; right: 18px; bottom: 18px; z-index: 150; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast { max-width: 420px; background: #3a1712; border: 1px solid var(--danger); color: #ffd9d3; border-radius: 6px; padding: 9px 14px; font-weight: 700; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.6); animation: toast-in .2s ease-out; }
.toast.ok { background: #1f3a1a; border-color: var(--ok); color: #d9f5cf; }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
/* compositions modèles */
.ex-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 10px; cursor: pointer; border-radius: 6px;
  border: 1px solid var(--gold); background: linear-gradient(180deg, rgba(226,182,90,.22), rgba(0,0,0,.35)); color: #f4ead6;
  font: 700 14.5px "Cinzel", Georgia, serif; box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 2px 6px rgba(0,0,0,.35); }
.ex-btn:hover { filter: brightness(1.15); }
.ex-btn .ex-ico { font-size: 18px; line-height: 1; }
.ex-btn .n { background: var(--gold); color: #211613; border-radius: 9px; padding: 1px 7px; font: 700 12px system-ui; }
.ex-btn[hidden] { display: none; }
/* galerie des armées d'exemple */
.modal-box.wide { width: min(1180px, 100%); padding: 0; }
.gal-head { padding: 18px 22px 14px; border-bottom: 2px solid var(--accent);
  background: linear-gradient(90deg, rgba(31,23,20,.96) 35%, rgba(31,23,20,.45)), var(--gal-art, none) right 30% / cover; }
.gal-head h3 { margin: 0; font-size: 22px; color: #f6d58a; } .gal-head p { margin: 4px 0 0; color: #d8cbb2; }
.gal-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 22px; border-bottom: 1px solid rgba(140,106,59,.4); }
.gal-tools select { margin-left: auto; background: #140f0d; color: var(--text); border: 1px solid var(--bronze); border-radius: 4px; padding: 3px 8px; font: inherit; }
.gal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; padding: 16px 22px 20px; }
.ex { display: flex; flex-direction: column; border: 1px solid rgba(140,106,59,.6); border-radius: 6px; background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.2)); padding: 12px; }
.ex:hover { border-color: var(--gold); }
.ex-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; } .ex-head b { font: 700 16px "Cinzel", Georgia, serif; }
.arch { font: 700 10.5px system-ui; letter-spacing: .05em; text-transform: uppercase; color: #211613; background: var(--gold); border-radius: 3px; padding: 1px 6px; cursor: help; }
.strip { display: flex; gap: 2px; align-items: center; min-height: 58px; overflow: hidden; }
.strip .mini { width: 26px; height: 56px; border: 1px solid #5b4630; border-radius: 2px; object-fit: cover; flex: 0 0 auto; }
.strip .mini.txt { display: flex; align-items: center; justify-content: center; font: 700 9px "Cinzel", serif; color: #f4ead6; }
.strip .more { color: var(--muted); font-size: 12px; margin-left: 4px; }
.ex-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 8px 0; color: #d8cbb2; font-size: 13px; } .ex-meta img { width: 16px; height: 16px; vertical-align: -3px; margin-right: 4px; }
.meter { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin: 3px 0; }
.meter .dots { display: flex; gap: 3px; } .meter .dots i { width: 22px; height: 7px; border-radius: 2px; background: rgba(255,255,255,.1); } .meter .dots i.on { background: var(--c); }
.ex-vs { display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: 12px; margin-top: 6px; align-items: center; }
.ex-vs .lbl { color: var(--muted); } .vs-chip { border-radius: 10px; padding: 0 7px; border: 1px solid; }
.vs-chip.s { color: #8bd34a; border-color: rgba(139,211,74,.5); } .vs-chip.w { color: #ff7a6a; border-color: rgba(255,122,106,.5); }
.vs-chip.a { font-style: italic; }
.ex-desc { color: #d8cbb2; font-size: 13px; margin: 8px 0 10px; flex: 1; }
.ex-warn { font-size: 12.5px; color: #ffd9d3; background: #4a1611; border: 1px solid var(--danger); border-radius: 4px; padding: 4px 8px; margin-bottom: 8px; }
.ex-act { display: flex; gap: 8px; justify-content: flex-end; }
/* armée vide : exemples proposés dans le bandeau */
.ex-empty { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 10px; padding: 8px 12px; border: 1px dashed var(--bronze); border-radius: 6px; background: rgba(0,0,0,.2); }
.ex-empty h4 { margin: 0; font: 700 15px "Cinzel", Georgia, serif; color: #f6d58a; } .ex-empty p { margin: 0; color: var(--muted); font-size: 13px; flex-basis: 100%; }
.ex-quick { display: flex; align-items: center; gap: 8px; border: 1px solid var(--bronze); border-radius: 6px; padding: 5px 10px; background: rgba(0,0,0,.3); cursor: pointer; color: var(--text); font: inherit; text-align: left; }
.ex-quick:hover { border-color: var(--gold); } .ex-quick .strip { min-height: 0; } .ex-quick .strip .mini { width: 14px; height: 30px; }
.ex-quick small { display: block; color: var(--muted); font-size: 11.5px; }
/* aperçu d'un exemple */
.preview-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; padding: 8px 12px; border: 1px solid var(--gold); border-radius: 6px; background: rgba(226,182,90,.12); }
.preview-bar[hidden] { display: none; } .preview-bar b { color: #f6d58a; } .preview-bar span { flex: 1; }
.card .xp-img { position: absolute; top: 18px; left: 1px; width: 20px; height: 20px; z-index: 6; filter: drop-shadow(0 0 2px #000); pointer-events: none; }
.card.skinned .chevrons { z-index: 6; }
.card.skinned .nm { margin-bottom: 22px; }   /* sans image : le nom reste lisible au-dessus du demi-cercle */
.card.skinned .badge-cap { bottom: 26px; z-index: 7; }
.card.skinned.is-general .ov-frame { filter: sepia(1) saturate(4) hue-rotate(5deg); }
.card.selected { outline: 2px solid var(--gold); outline-offset: 1px; }
.card.is-general { box-shadow: 0 0 0 2px var(--gold), 0 2px 4px var(--shadow); }

/* ---------- Mise en page : statistiques d'unité | personnalisation + roster | composition ---------- */
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr) 380px; grid-template-rows: auto 1fr; align-items: start; }
/* l'armée occupe les deux premières colonnes ; le panneau de droite remonte jusqu'en haut de l'armée */
.layout > .army { grid-column: 1 / 3; grid-row: 1; }
.layout > .side.left { grid-column: 1; grid-row: 2; } .layout > .center { grid-column: 2; grid-row: 2; }
.layout > .side.right { grid-column: 3; grid-row: 1 / 3; }
.layout.hide-right > .army { grid-column: 1 / -1; }
@media (max-width: 1749px) {   /* écran plus étroit : l'armée reprend toute la largeur, le panneau redescend */
  .layout > .army { grid-column: 1 / -1; } .layout > .side.right { grid-row: 2; }
}
.side { position: sticky; top: env(safe-area-inset-top, 0px); max-height: 100vh; overflow-y: auto; padding: 16px; background: color-mix(in srgb, var(--panel) 94%, transparent); }
.side.left { border-right: 1px solid var(--bronze); min-height: 60vh; }
.side.right { border-left: 1px solid var(--bronze); min-height: 60vh; }
.side h3 { font-size: 18px; margin: 0 0 2px; }
.side .sub { color: var(--muted); margin: 0 0 10px; font-size: 14px; }
.portrait { width: 84px; height: 150px; object-fit: cover; object-position: top; border: 1px solid var(--bronze); border-radius: 4px; float: right; margin: 0 0 8px 10px; }
.tags { list-style: none; margin: 0 0 12px; padding: 0; font-size: 13.5px; }
.tags li::before { content: "▲ "; color: var(--ok); }
.tags li.neg::before { content: "▼ "; color: var(--danger); }
.tags li.strong { font-weight: 700; }
/* fiche de statistiques (comme le panneau d'unité du jeu) */
.class-line { display: flex; align-items: center; gap: 6px; color: var(--muted); margin: 0 0 8px; font-size: 14px; }
.class-line img { width: 22px; height: 22px; }
.hp { position: relative; height: 16px; margin: 10px 0 6px; background: #1b2a12; border: 1px solid #6a8f3a; border-radius: 2px; }
.hp i { position: absolute; inset: 0; background: linear-gradient(#8bd34a, #4f9a1e); width: var(--w, 100%); }
.hp span { position: relative; display: block; text-align: center; font-size: 12px; font-weight: 700; line-height: 16px; color: #fff; text-shadow: 0 0 3px #000; }
.size-line { font-size: 14px; color: var(--muted); margin: 0 0 6px; }
.size-line .size-n { color: var(--text); font-size: 15px; }
.stat { display: grid; grid-template-columns: 1fr auto 52px; align-items: center; gap: 8px; padding: 3px 6px; font-size: 14.5px;
  background: linear-gradient(90deg, rgba(127,26,21,.28), rgba(127,26,21,.08)); margin-bottom: 2px; }
.stat .v { font-variant-numeric: tabular-nums; text-align: right; }
.stat .v small { color: var(--muted); font-size: 11px; margin-right: 4px; }
.stat .bar { height: 7px; background: rgba(0,0,0,.45); border: 1px solid rgba(140,106,59,.5); }
.stat .bar i { display: block; height: 100%; width: var(--w); background: #c99a3e; }
.stat-note { font-size: 12px; color: var(--muted); margin: -1px 0 3px 6px; }
.trait { display: flex; align-items: center; gap: 8px; padding: 3px 6px; margin-bottom: 2px; font-size: 14.5px;
  background: linear-gradient(90deg, rgba(127,26,21,.28), rgba(127,26,21,.08)); }
.trait img, .trait .ico-empty { width: 24px; height: 24px; border-radius: 50%; flex: 0 0 24px; }
.trait .ico-empty { background: rgba(140,106,59,.3); }
.trait b { color: #8bd34a; font-weight: 500; }
dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0 0 12px; font-size: 14px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.block-title { font-size: 14px; margin: 14px 0 6px; padding-bottom: 3px; border-bottom: 1px solid var(--bronze); }
.caps-list { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
.key { font-size: 11.5px; color: var(--muted); word-break: break-all; margin-top: 12px; }
.center { padding: 14px 18px 40px; min-width: 0; }

/* panneau de personnalisation (sous l'armée, comme en jeu) */
.custom { border: 1px solid var(--bronze); background: color-mix(in srgb, var(--panel) 92%, transparent); border-radius: 4px; margin-bottom: 16px;
  max-height: 340px; display: flex; flex-direction: column; }
.custom[hidden] { display: none; }   /* sans cette règle, display:flex l'emporterait sur l'attribut hidden (rectangle vide) */
.custom-scroll { flex: 1; overflow-y: auto; }
.custom-empty { padding: 14px; }
.custom-head { display: flex; align-items: center; gap: 12px; background: var(--band); color: #f4ead6; padding: 5px 10px; border-bottom: 1px solid var(--bronze); }
.custom-head h2 { font-size: 15px; margin: 0; flex: 1; }
.custom-head .act { border: 1px solid var(--gold); border-radius: 4px; background: rgba(0,0,0,.25); color: #f4ead6; padding: 3px 12px; font-weight: 700; cursor: pointer; }
.custom-head .act:disabled { opacity: .5; cursor: not-allowed; }
.custom-body { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; padding: 10px; }
.custom-msg { color: var(--danger); font-size: 13px; padding: 0 10px 8px; margin: 0; }
.pz { background: var(--panel-2); border: 1px solid var(--bronze); border-radius: 4px; padding: 6px 8px; align-self: start; }
.pz h4 { margin: 0 0 4px; font-size: 14px; }
.pz .row { display: flex; align-items: center; gap: 7px; padding: 2px 0; cursor: pointer; font-size: 14px; }
.pz .row .lbl { flex: 1; }
.pz .row.all { color: var(--muted); font-size: 13px; border-bottom: 1px solid rgba(140,106,59,.35); margin-bottom: 2px; }
.pz .price { color: var(--gold); font-variant-numeric: tabular-nums; font-size: 13px; }
.pz .price.unknown { color: var(--muted); }
.pz input { accent-color: var(--crimson-hi); }
/* icônes du jeu dans le panneau (sorts, capacités, domaines, montures) */
.pz .ico { flex: 0 0 26px; width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
.pz .ico.empty { display: inline-block; background: rgba(140,106,59,.25); }
/* domaine de magie : bandeau teinté de sa couleur, comme dans le jeu */
.pz .row.lore { padding: 3px 6px; margin: 2px -4px; border-radius: 3px;
  background: linear-gradient(90deg, rgba(0,0,0,.25), color-mix(in srgb, var(--lore, #555) 45%, transparent)); }

/* roster */
.roster h2 { font-size: 18px; margin: 0 0 10px; }
.sections { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }   /* 2 colonnes, dans l'ordre des onglets : comme le jeu */
.section-head { display: flex; justify-content: space-between; align-items: center; background: var(--band); color: #f4ead6; border: 1px solid var(--bronze); padding: 3px 10px; margin-bottom: 6px; }
.section-head h3 { margin: 0; font-size: 15px; }
.section-head .n { font-size: 13px; opacity: .85; }
.section-cards { display: flex; flex-wrap: wrap; gap: 3px; }

/* composition */
.comp-row { margin: 0 0 6px; font-size: 13px; }
.comp-row.zero { opacity: .45; }
.comp-row .top .pc { color: var(--text); font-variant-numeric: tabular-nums; }
.comp-row .det { font-size: 12px; color: var(--muted); margin-top: 1px; font-variant-numeric: tabular-nums; }
.card.skinned .mono { margin-top: 18px; font-size: 16px; }
.comp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 2px 0 2px; }
.comp-head b { font-size: 19px; color: var(--gold); }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px; }
.kpi { background: var(--panel-2); border: 1px solid rgba(140,106,59,.5); border-radius: 3px; padding: 5px 7px; }
.kpi b { display: block; font-size: 16px; color: var(--gold); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12px; color: var(--muted); }
.comp-row .top { display: flex; justify-content: space-between; gap: 6px; }
.comp-row .top b { font-weight: 500; }
.comp-row .top span { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { height: 6px; border-radius: 3px; background: rgba(140,106,59,.25); overflow: hidden; margin-top: 2px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.footer { color: var(--muted); font-size: 13px; padding: 24px 0 0; }

@media (max-width: 1250px) {
  .layout { grid-template-columns: 250px minmax(0, 1fr) 290px; }
  .layout.hide-left { grid-template-columns: 0 minmax(0, 1fr) 290px; } .layout.hide-right { grid-template-columns: 250px minmax(0, 1fr) 0; }
}
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .custom { height: auto; max-height: 70vh; }
  .side { position: static; max-height: none; min-height: 0 !important; border: none !important; border-bottom: 1px solid var(--bronze) !important; }
  .race-picker { width: 100%; } .topbar-right { margin-left: 0; width: 100%; } .topbar-right .race-picker { flex: 1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* barre d'outils de l'armée : groupes nommés (Game, My armies, Share, Edit), libellés sur les actions principales */
.tgrp { display: flex; flex-direction: column; gap: 2px; }
.tgrp .cap { font: 700 10px system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,243,212,.7); padding-left: 3px; }
.tgrp .row { display: flex; gap: 4px; padding: 3px; border-radius: 7px; background: rgba(0,0,0,.25); border: 1px solid rgba(244,234,214,.18); }
.b2 { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px; border-radius: 5px; cursor: pointer; white-space: nowrap;
  border: 1px solid rgba(244,234,214,.4); background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(0,0,0,.28)); color: #f4ead6; font: 600 13.5px system-ui, sans-serif; }
.b2 svg { width: 18px; height: 18px; flex: none; }
.b2:hover:not(:disabled) { border-color: var(--gold); background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,.2)); }
.b2:disabled { opacity: .4; cursor: default; }
.b2.ico { width: 36px; padding: 0; justify-content: center; }
.b2.prim { background: linear-gradient(180deg, #d9a83a, #8c6418); border-color: #ffe2a0; color: #fff7e2; font: 700 14px "Cinzel", Georgia, serif; }
.b2.prim:hover:not(:disabled) { filter: brightness(1.1); }
.b2.danger:hover:not(:disabled) { border-color: var(--danger); color: #ffd2cb; }
@media (max-width: 1250px) { .tgrp .cap { display: none; } .b2 .lbl { display: none; } .b2:not(.ico) { width: 36px; padding: 0; justify-content: center; } }

/* composition : répartition par rôle, profil de dégâts, réponses aux menaces, bande de vitesse */
.cp-stack { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: rgba(0,0,0,.4); margin: 4px 0 5px; }
.cp-stack.thin { height: 9px; margin-top: 8px; }
.cp-stack i { display: block; height: 100%; }
.cp-leg { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12.5px; color: var(--muted); }
.cp-leg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.cp-dmg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.cp-card { display: flex; flex-direction: column; background: var(--panel-2); border: 1px solid rgba(140,106,59,.5); border-radius: 4px; padding: 6px 8px; }
.cp-card .k { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.cp-card b { font: 700 19px "Cinzel", Georgia, serif; color: var(--gold); font-variant-numeric: tabular-nums; line-height: 1.2; }
.cp-card .p { font-size: 12px; color: var(--muted); }
.cp-mini { display: grid; grid-template-columns: auto minmax(30px, 1fr) auto; gap: 4px 8px; align-items: center; font-size: 12.5px; margin-top: 8px; }
.cp-mini b { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.cp-bar { position: relative; height: 6px; border-radius: 3px; background: rgba(0,0,0,.4); }
.cp-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.cp-note { font-size: 12px; margin: 6px 0 0; }
.cp-need { display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 8px; align-items: center; padding: 6px 0; border-top: 1px solid rgba(140,106,59,.25); }
.cp-need:first-of-type { border-top: none; }
.cp-need .ic { text-align: center; } .cp-need .nm { font-weight: 600; } .cp-need .pcv { font-weight: 700; font-variant-numeric: tabular-nums; }
.cp-need .cp-gauge { grid-column: 2 / 4; position: relative; height: 8px; border-radius: 4px; background: rgba(0,0,0,.4); overflow: hidden; }
.cp-need .cp-gauge i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.cp-need .cp-gauge u { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(244,234,214,.6); }
.cp-need .why { grid-column: 2 / 4; font-size: 12px; color: var(--muted); }
.cp-need.zero .nm, .cp-need.zero .pcv { color: var(--danger); }
.cp-alert { display: flex; gap: 8px; margin-top: 6px; padding: 6px 9px; border-radius: 5px; background: #4a1410; border: 1px solid var(--danger); color: #ffd2cb; font-size: 13px; }
.cp-dots { position: relative; height: 56px; margin-top: 8px; border-bottom: 1px solid rgba(140,106,59,.5); overflow: hidden; }
.cp-dots i { position: absolute; width: 10px; height: 10px; border-radius: 50%; transform: translateX(-50%); box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
.cp-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.stars5 { display: inline-flex; gap: 1px; vertical-align: -1px; } .stars5 i { font-style: normal; color: rgba(168,151,125,.35); } .stars5 i.on { color: var(--gold); }
</style>
