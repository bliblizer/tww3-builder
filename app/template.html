<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TWW3 – Army Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ---------- Jetons de couleur (sombre par défaut, comme l'écran du jeu) ----------
   --accent : couleur de la race affichée (couleur officielle de sa faction principale), injectée par le script */
:root {
  --bg: #1d1614; --panel: #2a1e1a; --panel-2: #33241f; --crimson: #7f1a15; --crimson-hi: #a3261e;
  --bronze: #8c6a3b; --gold: #e2b65a; --text: #eadfc8; --muted: #a8977d; --danger: #ff6b5a; --ok: #7fc77f;
  --card-ink: #f4ead6; --shadow: rgba(0, 0, 0, .45); --accent: #a3261e;
  --band: color-mix(in srgb, var(--accent) 45%, #3a0d0b);
  color-scheme: dark;
}
/* ---------- Base ---------- */
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: "Alegreya Sans", "Segoe UI", system-ui, sans-serif; font-size: 15px; line-height: 1.4;
}
/* illustration de la race en fond (si disponible), très atténuée */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: var(--race-art, none) center 20% / cover no-repeat; opacity: .16;
  -webkit-mask-image: linear-gradient(#000 0%, transparent 85%); mask-image: linear-gradient(#000 0%, transparent 85%);
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.serif { font-family: "Cinzel", Georgia, "Times New Roman", serif; }
.muted { color: var(--muted); font-size: 13px; }
.empty { color: var(--muted); }

/* ---------- Bandeau du haut ---------- */
.topbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 12px 20px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 22%, var(--panel)), var(--panel) 60%);
  border-bottom: 2px solid var(--accent);
}
.race-picker { position: relative; width: 340px; max-width: 100%; }
/* menu des races : chaque race est représentée par son illustration du jeu (fondue à gauche) */
.race-btn, .race-opt { position: relative; display: block; width: 100%; height: 56px; padding: 0; border: 1px solid var(--bronze);
  background: #140f0d; color: var(--text); cursor: pointer; text-align: left; overflow: hidden; }
.race-btn { border-radius: 4px; }
.race-strip { position: absolute; inset: 0; background-size: cover; background-position: right center; opacity: .85;
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, transparent 18%, #000 55%); mask-image: linear-gradient(90deg, transparent 0%, transparent 18%, #000 55%); }
.race-label { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 19px; font-weight: 700; text-shadow: 0 1px 3px #000; }
.race-btn .caret { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 14px; text-shadow: 0 0 3px #000; }
.race-list { position: absolute; z-index: 50; top: 60px; left: 0; right: 0; max-height: 70vh; overflow-y: auto; margin: 0; padding: 0; list-style: none;
  background: var(--panel); border: 1px solid var(--bronze); border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.6); }
.race-list[hidden] { display: none; }
.race-opt { border: none; border-top: 1px solid rgba(140,106,59,.4); }
.race-opt:hover .race-strip, .race-opt.active .race-strip, .race-btn:hover .race-strip { opacity: 1; }
.race-opt[aria-selected="true"] { outline: 2px solid var(--gold); outline-offset: -2px; }
.funds { margin-left: auto; display: flex; align-items: baseline; gap: 18px; }
.funds .value { font-size: 24px; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
.funds .value.over { color: var(--danger); }
.coin { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 6px; vertical-align: -1px;
  background: radial-gradient(circle at 35% 35%, #ffe7a3, var(--gold) 60%, #7a5418); }

/* ---------- Armée ---------- */
.army { padding: 12px 20px 14px; background: linear-gradient(var(--band), var(--band)) top / 100% 34px no-repeat, color-mix(in srgb, var(--panel-2) 92%, transparent); border-bottom: 1px solid var(--bronze); }
.army.drop-ok { box-shadow: inset 0 0 0 2px var(--gold); }
.army-head { display: flex; align-items: center; justify-content: space-between; height: 22px; margin-bottom: 14px; color: #f4ead6; }
.army-head h2 { font-size: 16px; margin: 0; }
.army-head .clear { background: none; border: 1px solid rgba(244,234,214,.5); color: #f4ead6; border-radius: 4px; padding: 1px 10px; cursor: pointer; margin-left: 8px; }
.slots { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.slot { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 0 0 50px; }
.slot .card { flex: none; }
.slot-empty { flex: 0 0 50px; height: 108px; border: 1px dashed var(--bronze); border-radius: 4px; opacity: .45; }
.rank-ctl { display: flex; align-items: center; gap: 2px; font-size: 12px; font-variant-numeric: tabular-nums; }
.rank-ctl button { width: 20px; height: 18px; line-height: 1; padding: 0; border: 1px solid var(--bronze); border-radius: 3px; background: var(--panel); cursor: pointer; }
.rank-ctl button:disabled { opacity: .35; cursor: default; }
.rank-ctl span { min-width: 20px; text-align: center; color: var(--muted); }
.army-status { margin: 10px 0 0; font-size: 14px; }
.army-status .ok { color: var(--ok); font-weight: 700; }
.army-status .ko { color: var(--danger); font-weight: 700; }
.army-status ul { margin: 4px 0 0; padding-left: 18px; color: var(--danger); }
.caps { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 8px; }
.cap-chip { font-size: 12.5px; border: 1px solid var(--bronze); border-radius: 3px; padding: 1px 7px; background: var(--panel); font-variant-numeric: tabular-nums; }
.cap-chip.full { border-color: var(--gold); color: var(--gold); }
.cap-chip.over { border-color: var(--danger); color: var(--danger); font-weight: 700; }
.flash { margin: 8px 0 0; color: var(--danger); font-weight: 700; font-size: 14px; }
.army-hint { color: var(--muted); margin: 8px 0 0; font-size: 13.5px; }

/* ---------- Cartes d'unité ---------- */
.card {
  flex: 0 0 50px; width: 50px; height: 108px; padding: 0; position: relative; cursor: pointer;
  border: 1px solid var(--bronze); border-radius: 4px; overflow: hidden; text-align: center;
  background: var(--card-bg, #4a2c2a); color: var(--card-ink); box-shadow: 0 2px 4px var(--shadow);
  display: flex; flex-direction: column;
}
.card:hover { border-color: var(--gold); }
.card .cost { background: rgba(0,0,0,.6); color: #f6d58a; font-weight: 700; font-size: 11.5px; padding: 1px 0; font-variant-numeric: tabular-nums; }
.card .mono { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; opacity: .9; }
.card .nm { font-size: 9px; line-height: 1.15; padding: 2px 3px 3px; background: rgba(0,0,0,.35); height: 38px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.card .art { flex: 1; min-height: 0; width: 100%; object-fit: cover; object-position: top; display: block; }
.card.has-img .mono, .card.has-img .nm { display: none; }
.card.has-img .cost { position: absolute; top: 0; left: 0; right: 0; z-index: 1; }
.card .badge-opt { position: absolute; top: 20px; right: 3px; font-size: 10px; background: rgba(0,0,0,.6); border-radius: 3px; padding: 0 3px; z-index: 1; }
.card .badge-cap { position: absolute; bottom: 3px; right: 3px; font-size: 10px; font-weight: 700; border-radius: 3px; padding: 0 3px; z-index: 2;
  background: rgba(0,0,0,.75); color: var(--gold); border: 1px solid currentColor; }
.card .badge-cap.full { color: var(--danger); }
/* chevrons de rang : 1-3 bronze, 4-6 argent, 7-9 or (1 à 3 chevrons par palier) */
.card .chevrons { position: absolute; top: 34px; left: 3px; z-index: 2; display: flex; flex-direction: column; gap: 1px; }
.card .chevrons i { display: block; width: 14px; height: 5px; background: var(--chev);
  clip-path: polygon(0 0, 50% 60%, 100% 0, 100% 40%, 50% 100%, 0 40%); filter: drop-shadow(0 0 1px #000); }
.card.blocked { filter: grayscale(.85) brightness(.6); }
/* habillage du jeu (ui/skins/default) quand il est fourni : cadre, demi-cercle et icône de catégorie, sélection, survol */
.card.skinned { border: none; border-radius: 0; box-shadow: none; overflow: visible; background: var(--card-bg, #4a2c2a); }
.card.skinned .art { position: absolute; inset: 0; width: 50px; height: 108px; }
.card.skinned .ov { position: absolute; top: 0; left: 0; width: 50px; height: 108px; pointer-events: none; z-index: 3; }
.card.skinned .ov-selected, .card.skinned .ov-hover { display: none; }
.card.skinned.selected { outline: none; }
.card.skinned.selected .ov-selected, .card.skinned:hover .ov-hover { display: block; }
.card.skinned .semi { position: absolute; bottom: 0; left: 2px; width: 46px; z-index: 4; pointer-events: none; }
.card.skinned .cat-icon { position: absolute; bottom: 0; left: 15px; width: 19px; height: 19px; z-index: 5; pointer-events: none; }
.card.skinned .cost { position: absolute; top: 2px; left: 2px; right: 2px; z-index: 6; background: rgba(0,0,0,.55); }
.card.skinned .badge-opt { top: 18px; z-index: 6; }
/* tier du jeu (I à V) en haut à droite, unités hors lords et héros */
.card .tier { position: absolute; top: 18px; right: 2px; z-index: 7; font-family: "Cinzel", Georgia, serif; font-size: 9.5px; font-weight: 700;
  color: #f6d58a; background: rgba(0,0,0,.65); border: 1px solid var(--bronze); border-radius: 2px; padding: 0 2px; line-height: 1.3; }
.card .tier + .badge-opt, .card .badge-opt { right: auto; left: 2px; }
.card .xp-img { position: absolute; top: 18px; left: 1px; width: 20px; height: 20px; z-index: 6; filter: drop-shadow(0 0 2px #000); pointer-events: none; }
.card.skinned .chevrons { z-index: 6; }
.card.skinned .nm { margin-bottom: 22px; }   /* sans image : le nom reste lisible au-dessus du demi-cercle */
.card.skinned .badge-cap { bottom: 26px; z-index: 7; }
.card.skinned.is-general .ov-frame { filter: sepia(1) saturate(4) hue-rotate(5deg); }
.card.selected { outline: 2px solid var(--gold); outline-offset: 1px; }
.card.is-general { box-shadow: 0 0 0 2px var(--gold), 0 2px 4px var(--shadow); }

/* ---------- Mise en page : statistiques d'unité | personnalisation + roster | composition ---------- */
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr) 270px; align-items: start; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); max-height: 100vh; overflow-y: auto; padding: 16px; background: color-mix(in srgb, var(--panel) 94%, transparent); }
.side.left { border-right: 1px solid var(--bronze); min-height: 60vh; }
.side.right { border-left: 1px solid var(--bronze); min-height: 60vh; }
.side h3 { font-size: 18px; margin: 0 0 2px; }
.side .sub { color: var(--muted); margin: 0 0 10px; font-size: 14px; }
.portrait { width: 84px; height: 150px; object-fit: cover; object-position: top; border: 1px solid var(--bronze); border-radius: 4px; float: right; margin: 0 0 8px 10px; }
.tags { list-style: none; margin: 0 0 12px; padding: 0; font-size: 13.5px; }
.tags li::before { content: "▲ "; color: var(--ok); }
.tags li.neg::before { content: "▼ "; color: var(--danger); }
.tags li.strong { font-weight: 700; }
/* fiche de statistiques (comme le panneau d'unité du jeu) */
.class-line { display: flex; align-items: center; gap: 6px; color: var(--muted); margin: 0 0 8px; font-size: 14px; }
.class-line img { width: 22px; height: 22px; }
.hp { position: relative; height: 16px; margin: 10px 0 6px; background: #1b2a12; border: 1px solid #6a8f3a; border-radius: 2px; }
.hp i { position: absolute; inset: 0; background: linear-gradient(#8bd34a, #4f9a1e); width: var(--w, 100%); }
.hp span { position: relative; display: block; text-align: center; font-size: 12px; font-weight: 700; line-height: 16px; color: #fff; text-shadow: 0 0 3px #000; }
.size-line { font-size: 14px; color: var(--muted); margin: 0 0 6px; }
.stat { display: grid; grid-template-columns: 1fr auto 52px; align-items: center; gap: 8px; padding: 3px 6px; font-size: 14.5px;
  background: linear-gradient(90deg, rgba(127,26,21,.28), rgba(127,26,21,.08)); margin-bottom: 2px; }
.stat .v { font-variant-numeric: tabular-nums; text-align: right; }
.stat .v small { color: var(--muted); font-size: 11px; margin-right: 4px; }
.stat .bar { height: 7px; background: rgba(0,0,0,.45); border: 1px solid rgba(140,106,59,.5); }
.stat .bar i { display: block; height: 100%; width: var(--w); background: #c99a3e; }
.stat-note { font-size: 12px; color: var(--muted); margin: -1px 0 3px 6px; }
.trait { display: flex; align-items: center; gap: 8px; padding: 3px 6px; margin-bottom: 2px; font-size: 14.5px;
  background: linear-gradient(90deg, rgba(127,26,21,.28), rgba(127,26,21,.08)); }
.trait img, .trait .ico-empty { width: 24px; height: 24px; border-radius: 50%; flex: 0 0 24px; }
.trait .ico-empty { background: rgba(140,106,59,.3); }
.trait b { color: #8bd34a; font-weight: 500; }
dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0 0 12px; font-size: 14px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.block-title { font-size: 14px; margin: 14px 0 6px; padding-bottom: 3px; border-bottom: 1px solid var(--bronze); }
.caps-list { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
.key { font-size: 11.5px; color: var(--muted); word-break: break-all; margin-top: 12px; }
.center { padding: 14px 18px 40px; min-width: 0; }

/* panneau de personnalisation (sous l'armée, comme en jeu) */
.custom { border: 1px solid var(--bronze); background: color-mix(in srgb, var(--panel) 92%, transparent); border-radius: 4px; margin-bottom: 16px;
  max-height: 340px; display: flex; flex-direction: column; }
.custom[hidden] { display: none; }   /* sans cette règle, display:flex l'emporterait sur l'attribut hidden (rectangle vide) */
.custom-scroll { flex: 1; overflow-y: auto; }
.custom-empty { padding: 14px; }
.custom-head { display: flex; align-items: center; gap: 12px; background: var(--band); color: #f4ead6; padding: 5px 10px; border-bottom: 1px solid var(--bronze); }
.custom-head h2 { font-size: 15px; margin: 0; flex: 1; }
.custom-head .act { border: 1px solid var(--gold); border-radius: 4px; background: rgba(0,0,0,.25); color: #f4ead6; padding: 3px 12px; font-weight: 700; cursor: pointer; }
.custom-head .act:disabled { opacity: .5; cursor: not-allowed; }
.custom-body { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; padding: 10px; }
.custom-msg { color: var(--danger); font-size: 13px; padding: 0 10px 8px; margin: 0; }
.pz { background: var(--panel-2); border: 1px solid var(--bronze); border-radius: 4px; padding: 6px 8px; align-self: start; }
.pz h4 { margin: 0 0 4px; font-size: 14px; }
.pz .row { display: flex; align-items: center; gap: 7px; padding: 2px 0; cursor: pointer; font-size: 14px; }
.pz .row .lbl { flex: 1; }
.pz .row.all { color: var(--muted); font-size: 13px; border-bottom: 1px solid rgba(140,106,59,.35); margin-bottom: 2px; }
.pz .price { color: var(--gold); font-variant-numeric: tabular-nums; font-size: 13px; }
.pz .price.unknown { color: var(--muted); }
.pz input { accent-color: var(--crimson-hi); }
/* icônes du jeu dans le panneau (sorts, capacités, domaines, montures) */
.pz .ico { flex: 0 0 26px; width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
.pz .ico.empty { display: inline-block; background: rgba(140,106,59,.25); }
/* domaine de magie : bandeau teinté de sa couleur, comme dans le jeu */
.pz .row.lore { padding: 3px 6px; margin: 2px -4px; border-radius: 3px;
  background: linear-gradient(90deg, rgba(0,0,0,.25), color-mix(in srgb, var(--lore, #555) 45%, transparent)); }

/* roster */
.roster h2 { font-size: 18px; margin: 0 0 10px; }
.sections { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }   /* 2 colonnes, dans l'ordre des onglets : comme le jeu */
.section-head { display: flex; justify-content: space-between; align-items: center; background: var(--band); color: #f4ead6; border: 1px solid var(--bronze); padding: 3px 10px; margin-bottom: 6px; }
.section-head h3 { margin: 0; font-size: 15px; }
.section-head .n { font-size: 13px; opacity: .85; }
.section-cards { display: flex; flex-wrap: wrap; gap: 5px; }

/* composition */
.comp-row { margin: 0 0 6px; font-size: 13px; }
.comp-row.zero { opacity: .45; }
.comp-row .top .pc { color: var(--text); font-variant-numeric: tabular-nums; }
.comp-row .det { font-size: 12px; color: var(--muted); margin-top: 1px; font-variant-numeric: tabular-nums; }
.card.skinned .mono { margin-top: 18px; font-size: 16px; }
.comp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 2px 0 2px; }
.comp-head b { font-size: 19px; color: var(--gold); }
.elite { display: flex; justify-content: space-between; align-items: baseline; }
.elite b { font-size: 21px; color: var(--gold); }
.tiers { display: flex; height: 11px; border-radius: 2px; overflow: hidden; margin: 6px 0 3px; background: rgba(0,0,0,.4); }
.tiers i { display: block; height: 100%; }
.tl { display: flex; gap: 8px; font-size: 11.5px; color: var(--muted); }
.tl i, .tiers i.t1, .tiers i.t2, .tiers i.t3, .tiers i.t4, .tiers i.t5 { display: inline-block; }
.tl i { width: 9px; height: 9px; margin-right: 3px; vertical-align: -1px; }
.t1 { background: #6b6155; } .t2 { background: #8c7a4f; } .t3 { background: #b08a3c; } .t4 { background: #cf9a2e; } .t5 { background: #f2c94c; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px; }
.kpi { background: var(--panel-2); border: 1px solid rgba(140,106,59,.5); border-radius: 3px; padding: 5px 7px; }
.kpi b { display: block; font-size: 16px; color: var(--gold); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12px; color: var(--muted); }
.comp-row .top { display: flex; justify-content: space-between; gap: 6px; }
.comp-row .top b { font-weight: 500; }
.comp-row .top span { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { height: 6px; border-radius: 3px; background: rgba(140,106,59,.25); overflow: hidden; margin-top: 2px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.footer { color: var(--muted); font-size: 13px; padding: 24px 0 0; }

@media (max-width: 1250px) {
  .layout { grid-template-columns: 250px minmax(0, 1fr) 250px; }
}
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .custom { height: auto; max-height: 70vh; }
  .side { position: static; max-height: none; min-height: 0 !important; border: none !important; border-bottom: 1px solid var(--bronze) !important; }
  .race-picker { width: 100%; }
  .funds { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="race-picker">
    <button class="race-btn" id="raceButton" aria-haspopup="listbox" aria-expanded="false" aria-label="Select race">
      <span class="race-strip" id="raceStrip"></span><span class="race-label serif" id="raceName">—</span><span class="caret">▾</span>
    </button>
    <ul class="race-list" id="raceList" role="listbox" aria-label="Races" hidden></ul>
  </div>
  <div class="funds">
    <div><span class="muted">Funds remaining</span><br><span class="value serif" id="funds"><span class="coin"></span>0</span></div>
  </div>
</header>

<section class="army" id="armyZone" aria-label="Army">
  <div class="army-head">
    <h2 class="serif">Main Army</h2>
    <div><span id="unitCount">0 / 20</span><button class="clear" id="clearArmy">Clear</button></div>
  </div>
  <div class="slots" id="slots"></div>
  <div class="army-status" id="armyStatus" aria-live="polite"></div>
  <div class="caps" id="capsBar" aria-label="Unit caps in use"></div>
  <p class="flash" id="flash" role="status" hidden></p>
</section>

<div class="layout">
  <aside class="side left" id="unitStats" aria-live="polite"></aside>
  <main class="center">
    <section class="custom" id="custom" aria-label="Unit customisation" hidden></section>
    <div class="roster">
      <h2 class="serif">Unit Roster</h2>
      <div class="sections" id="sections"></div>
    </div>
    <p class="footer" id="footer"></p>   <!-- dans la colonne centrale : les panneaux latéraux restent visibles jusqu'en bas de page -->
  </main>
  <aside class="side right" id="composition" aria-label="Army composition statistics"></aside>
</div>

<script>
const DATA = /*__DATA__*/null;

/* ---------- État ----------
   army  : unités de l'armée { card, opt, sel, rank } (sel = clés des sorts / capacités / objets cochés ; rank = 0 à 9)
   focus : unité affichée dans les panneaux { kind: 'army' | 'roster', unit } ('roster' = brouillon pas encore ajouté) */
const state = { raceIndex: 0, army: [], focus: null };
const DIMS = ['lore', 'mark', 'spirit', 'other', 'mount'];
const DIM_CAT = { lore: 'type_spell_lore', mark: 'type_mark', spirit: 'type_forest_spirit' };
const UPGRADE_SECTIONS = [['s', 'Spells'], ['a', 'Abilities'], ['i', 'Items']];
const ROLES = [   // rôles de la composition (calculés dans pvp_roster_options.role)
  ['lord', 'Lord'], ['hero', 'Heroes'], ['infantry_light', 'Trash infantry (tier I)'], ['infantry_line', 'Line infantry (tier II)'],
  ['infantry_elite', 'Elite infantry (tier III+)'], ['ranged', 'Ranged'], ['artillery', 'Artillery'], ['cavalry', 'Cavalry & chariots'],
  ['monster', 'Monsters'], ['war_beast', 'War beasts'], ['other', 'Other']
];
const TAB_COLORS = {
  commander: '#5a2a3a', heroes_agents: '#4a2f50', infantry: '#3e3a2c', missile_infantry: '#2f4038',
  cavalry_chariots: '#4a3424', missile_cavalry_chariots: '#3a4026', monster_beasts: '#2c3a48',
  constructs: '#3d3d3d', flying_war_machine: '#30404a', missile_monster_beasts: '#2a4340',
  artillery_war_machines: '#45392a', campaign_exclusives: '#333'
};
const CLICK_DELAY = 260;
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V'];
const statOf = (unitKey, col) => { const r = DATA.stats[unitKey]; return r ? r[DATA.statCols.indexOf(col)] : null; };   // ms : un clic simple attend la fin d'un éventuel double-clic avant d'ouvrir les panneaux
const $ = id => document.getElementById(id);
const fmt = n => String(Math.round(n));   // comme en jeu : pas de séparateur de milliers
const race = () => DATA.races[state.raceIndex];
const roster = () => DATA.roster[race().key] || [];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const initials = name => name.replace(/\(.*?\)/g, '').split(/[\s-]+/).filter(w => /^[A-Za-zÀ-ÿ]/.test(w))
  .slice(0, 2).map(w => w[0].toUpperCase()).join('');
const optionLabel = o => DIMS.map(k => o[k]).filter(Boolean).join(', ');
const hasChoice = (card, k) => new Set(card.opts.map(o => o[k] ?? '')).size > 1;
const isCustomisable = card => DIMS.some(k => hasChoice(card, k)) || card.opts.some(o => (o.up || []).length);
const dimTitle = (card, k) => k === 'mount' ? 'Mounts'
  : k === 'other' ? (DATA.typeCats[card.opts.find(o => o.ovc)?.ovc] || 'Variant')
  : (DATA.typeCats[DIM_CAT[k]] || k);

/* ---------- Coûts (même formule que models/validation/unit_price_checks.sql, testée sur 8 prix relevés en jeu) ----------
   - prix de base de l'option (monture comprise) ; rang r : arrondi(prix x multiplicateur_r) + coût fixe_r (hypothèse)
   - capacités et objets cochés : grille de rareté (common 100, uncommon 150, rare 200, legendary 200)
   - sorts cochés : arrondi inférieur de somme(prix de rareté du k-ième sort x (1 - 0,047 k)), du plus cher au moins cher */
const SPELL_STEP = 0.047;
const upgradesOf = raceKey => (DATA.up[raceKey] || {});
const defaultSel = () => new Set();   // par défaut, aucun sort / capacité / objet n'est coché
const rankedBase = (c, rank) => Math.round(c * DATA.xp[rank][0]) + DATA.xp[rank][1];
function upgradesCost(sel, raceKey = race().key) {
  const ups = upgradesOf(raceKey);
  let other = 0; const spells = [];
  sel.forEach(k => { const u = ups[k]; if (!u) return; if (u[1] === 's') spells.push(u[2] || 0); else other += u[2] || 0; });
  spells.sort((a, b) => b - a);
  return other + Math.floor(spells.reduce((s, c, k) => s + c * (1 - SPELL_STEP * k), 0));
}
/* expérience : achetable seulement pour les unités de base. Lords et héros : jamais. Régiments de Renom : rang 9
   fixe, déjà compris dans leur prix de base (aucun surcoût). */
const canRank = opt => !opt.rn && opt.role !== 'lord' && opt.role !== 'hero';
const shownRank = u => (u.opt.rn ? 9 : canRank(u.opt) ? u.rank : 0);
const unitCost = u => (canRank(u.opt) ? rankedBase(u.opt.c, u.rank) : u.opt.c) + upgradesCost(u.sel);
const newUnit = (card, opt, rank = 0) => ({ card, opt, sel: defaultSel(), rank });
const spent = () => state.army.reduce((s, u) => s + unitCost(u), 0);
const remaining = () => DATA.budget - spent();

/* ---------- Règles de l'armée ----------
   Même spécification que models/validation/army_validation.sql (testée sur les mêmes armées de test) :
   NO_GENERAL, MULTIPLE_LORDS, TOO_MANY_UNITS, OVER_BUDGET, CAP_EXCEEDED:<groupe>, UNIT_NOT_AVAILABLE.
   - une armée a un seul lord, en première place, et c'est le général ; choisir un lord remplace le précédent ;
   - plafond effectif d'un groupe = max(plafond par défaut, plafonds spéciaux des personnages présents). */
const capsOf = raceKey => DATA.caps[raceKey] || { g: {}, m: {}, o: {} };
const generalOf = army => (army.length && army[0].opt.l && army[0].opt.g ? army[0] : null);
const lordIndex = army => army.findIndex(u => u.opt.l);
function effectiveCap(raceKey, setKey, army) {
  const c = capsOf(raceKey);
  let cap = c.g[setKey][1];
  army.forEach(u => { const ov = c.o[u.card.id]; if (ov && ov[setKey] != null) cap = Math.max(cap, ov[setKey]); });
  return cap;
}
function capCounts(raceKey, army) {
  const n = {};
  army.forEach(u => (capsOf(raceKey).m[u.opt.u] || []).forEach(k => { n[k] = (n[k] || 0) + 1; }));
  return n;
}
function validate(raceKey, army, costOf = unitCost) {
  const errors = [];
  if (!generalOf(army)) errors.push({ code: 'NO_GENERAL', text: 'The first unit must be a lord who can lead the army.' });
  if (army.filter(u => u.opt.l).length > 1) errors.push({ code: 'MULTIPLE_LORDS', text: 'An army can only have one lord.' });
  if (army.length > DATA.maxUnits) errors.push({ code: 'TOO_MANY_UNITS', text: `Too many units (${army.length}/${DATA.maxUnits}).` });
  const cost = army.reduce((s, u) => s + costOf(u), 0);
  if (cost > DATA.budget) errors.push({ code: 'OVER_BUDGET', text: `Over budget (${fmt(cost)} / ${fmt(DATA.budget)}).` });
  const counts = capCounts(raceKey, army);
  Object.entries(counts).forEach(([k, n]) => {
    const cap = effectiveCap(raceKey, k, army);
    if (n > cap) errors.push({ code: 'CAP_EXCEEDED:' + k, text: `Unit cap exceeded: ${capsOf(raceKey).g[k][0]} (${n}/${cap}).` });
  });
  return errors;
}
function withAdded(army, unit) {
  const next = army.slice();
  if (unit.opt.l) { const i = lordIndex(next); if (i >= 0) next.splice(i, 1); next.unshift(unit); } else next.push(unit);
  return next;
}
/* problème créé par le passage de l'armée « before » à « after » ('' si aucun) : { kind, text } */
function newProblem(before, after) {
  const rk = race().key, had = new Set(validate(rk, before).map(e => e.code));
  const created = validate(rk, after).filter(e => !had.has(e.code) && e.code !== 'NO_GENERAL');
  if (!created.length) return null;
  const e = created[0];
  if (e.code === 'TOO_MANY_UNITS') return { kind: 'full', text: `Army is full (${DATA.maxUnits} units).` };
  if (e.code === 'OVER_BUDGET') return { kind: 'funds', text: 'Not enough funds.' };
  if (e.code.startsWith('CAP_EXCEEDED:')) {
    const k = e.code.slice('CAP_EXCEEDED:'.length);
    return { kind: 'cap', text: `Unit cap reached: ${capsOf(rk).g[k][0]} (${capCounts(rk, before)[k] || 0}/${effectiveCap(rk, k, after)}).` };
  }
  return { kind: 'other', text: e.text };
}
function addReason(unit) {
  if (unit.opt.l && !unit.opt.g) return 'This lord cannot lead an army of this race.';
  const p = newProblem(state.army, withAdded(state.army, unit));
  return p ? p.text : '';
}
/* points d'entrée de test (scripts/test_app.py) */
window.builderValidate = (raceKey, unitKeys) => {   // liste de clés (format .army_setup), au prix de base
  const byKey = {};
  (DATA.roster[raceKey] || []).forEach(card => card.opts.forEach(opt => { byKey[opt.u] = { card, opt }; }));
  const army = unitKeys.map(k => byKey[k] || { card: { id: null }, opt: { u: k, c: 0, g: false, l: false }, unknown: true });
  const codes = new Set(validate(raceKey, army, u => u.opt.c).map(e => e.code));
  if (army.some(u => u.unknown)) codes.add('UNIT_NOT_AVAILABLE');
  return [...codes].sort().join('|');
};
window.builderPrice = (raceKey, unitKey, upgradeKeys) => {   // prix d'une option avec les éléments cochés
  const opt = (DATA.roster[raceKey] || []).flatMap(c => c.opts).find(o => o.u === unitKey);
  return opt ? opt.c + upgradesCost(new Set(upgradeKeys), raceKey) : null;
};

/* ---------- Actions ---------- */
function addUnit(unit) {
  const reason = addReason(unit);
  if (reason) { flash(reason); return false; }
  const added = { ...unit, sel: new Set(unit.sel) };
  state.army = withAdded(state.army, added);
  state.focus = { kind: 'army', unit: added };
  renderAll();
  return true;
}
function removeUnit(unit) {
  state.army = state.army.filter(u => u !== unit);
  if (state.focus && state.focus.unit === unit) state.focus = { kind: 'roster', unit: newUnit(unit.card, unit.opt) };
  renderAll();
}
function replaceUnit(unit, changed) {   // modification d'une unité (option, sélection) : refusée si elle crée un problème
  if (state.focus.kind === 'army') {
    const next = state.army.map(u => (u === unit ? changed : u));
    const p = newProblem(state.army, next);
    if (p && (p.kind === 'funds' || p.kind === 'cap')) { flash(p.text); return false; }
    state.army = next;
  }
  state.focus = { kind: state.focus.kind, unit: changed };
  renderAll();
  return true;
}
function setRank(unit, rank) {
  rank = Math.max(0, Math.min(DATA.xp.length - 1, rank));
  const changed = { ...unit, rank };
  const next = state.army.map(u => (u === unit ? changed : u));
  const p = newProblem(state.army, next);
  if (p && rank > unit.rank) { flash(p.text); return; }
  state.army = next;
  if (state.focus && state.focus.unit === unit) state.focus = { kind: 'army', unit: changed };
  renderAll();
}
const draftFor = card => (state.focus && state.focus.kind === 'roster' && state.focus.unit.card === card)
  ? state.focus.unit : newUnit(card, card.opts[0]);
function flash(text) {
  const m = $('flash'); m.textContent = text; m.hidden = false;
  clearTimeout(flash.t); flash.t = setTimeout(() => { m.hidden = true; }, 3500);
}
/* clic simple / double-clic sur une carte : le clic simple attend CLICK_DELAY pour ne pas déplacer la page
   (apparition du panneau) entre les deux clics d'un double-clic */
function bindClicks(el, onSingle, onDouble) {
  let timer = null;
  el.addEventListener('click', () => { clearTimeout(timer); timer = setTimeout(onSingle, CLICK_DELAY); });
  el.addEventListener('dblclick', () => { clearTimeout(timer); onDouble(); });
}

/* ---------- Carte d'unité ---------- */
function cardEl(card, { cost, label = '', img = null, rank = 0, opt = card.opts[0] }) {
  const b = document.createElement('button');
  const sk = DATA.skin || {};
  const skinned = !!sk.frame;
  b.className = 'card' + (img ? ' has-img' : '') + (skinned ? ' skinned' : '');
  const isChar = opt.role === 'lord' || opt.role === 'hero';
  const semi = opt.rn ? sk.semiRenown : isChar ? sk.semiHero : sk.semi;
  const skinHtml = !skinned ? '' :
    `<img class="ov ov-frame" src="images/${esc(sk.frame)}" alt="" draggable="false">` +
    (sk.selected ? `<img class="ov ov-selected" src="images/${esc(sk.selected)}" alt="" draggable="false">` : '') +
    (sk.hover ? `<img class="ov ov-hover" src="images/${esc(sk.hover)}" alt="" draggable="false">` : '') +
    (semi ? `<img class="semi" src="images/${esc(semi)}" alt="" draggable="false">` : '') +
    (opt.ic ? `<img class="cat-icon" src="images/${esc(opt.ic)}" alt="" draggable="false">` : '');
  b.style.setProperty('--card-bg', TAB_COLORS[card.t] || '#4a2c2a');
  b.draggable = true;
  const tier = rank ? Math.ceil(rank / 3) : 0, n = rank ? ((rank - 1) % 3) + 1 : 0;
  const xpImg = rank && sk.xp && sk.xp[rank];
  const chev = !rank ? '' : xpImg ? `<img class="xp-img" src="images/${esc(xpImg)}" alt="" title="Rank ${rank}" draggable="false">`
    : `<span class="chevrons" style="--chev:${['', '#c9874a', '#d8dde3', '#f2c94c'][tier]}" title="Rank ${rank}">${'<i></i>'.repeat(n)}</span>`;
  b.innerHTML =
    `<span class="cost">${fmt(cost)}</span>` +
    chev + (opt.role !== 'lord' && opt.role !== 'hero' && statOf(opt.u, 'tier')
      ? `<span class="tier" title="Tier ${statOf(opt.u, 'tier')}">${ROMAN[statOf(opt.u, 'tier')]}</span>` : '') +
    (img ? `<img class="art" src="images/${esc(img)}" alt="" loading="lazy" draggable="false">` : '') + skinHtml +
    `<span class="mono serif">${esc(initials(card.n))}</span><span class="nm">${esc(card.n)}</span>`;
  b.title = card.n + (label ? ' (' + label + ')' : '') + (rank ? ` – rank ${rank}` : '');
  b.setAttribute('aria-label', `${card.n}${label ? ' (' + label + ')' : ''}, ${fmt(cost)}`);
  const art = b.querySelector('.art');
  if (art) art.addEventListener('error', () => { art.remove(); b.classList.remove('has-img'); });
  return b;
}

/* ---------- Rendu : bandeau, armée ---------- */
function renderTop() {
  $('raceName').textContent = race().name;
  $('raceStrip').style.backgroundImage = race().race_image ? `url("images/${race().race_image}")` : 'none';
  const f = $('funds');
  f.innerHTML = `<span class="coin"></span>${fmt(remaining())}`;
  f.classList.toggle('over', remaining() < 0);
  $('unitCount').textContent = `${state.army.length} / ${DATA.maxUnits}`;
}

function renderArmy() {
  const slots = $('slots');
  slots.innerHTML = '';
  const general = generalOf(state.army);
  state.army.forEach((u, i) => {
    const slot = document.createElement('div'); slot.className = 'slot';
    const el = cardEl(u.card, { cost: unitCost(u), label: optionLabel(u.opt), img: u.opt.img || u.card.img, rank: shownRank(u), opt: u.opt });
    if (u === general) { el.classList.add('is-general'); el.title += ' – army general'; }
    if (state.focus && state.focus.unit === u) el.classList.add('selected');
    el.dataset.armyIndex = String(i);
    bindClicks(el, () => setFocus({ kind: 'army', unit: u }), () => removeUnit(u));
    el.addEventListener('dragstart', e => { drag = { from: 'army', unit: u }; e.dataTransfer.setData('text/plain', 'army'); e.dataTransfer.effectAllowed = 'move'; });
    el.addEventListener('dragend', () => { drag = null; });
    slot.append(el);
    if (canRank(u.opt)) {   // boutons d'expérience : unités de base uniquement
      const ctl = document.createElement('div'); ctl.className = 'rank-ctl';
      ctl.innerHTML = `<button aria-label="Remove a rank" ${u.rank === 0 ? 'disabled' : ''}>−</button><span title="Experience rank">${u.rank}</span>` +
        `<button aria-label="Add a rank" ${u.rank >= DATA.xp.length - 1 ? 'disabled' : ''}>+</button>`;
      const [minus, , plus] = ctl.children;
      minus.addEventListener('click', () => setRank(u, u.rank - 1));
      plus.addEventListener('click', () => setRank(u, u.rank + 1));
      slot.append(ctl);
    }
    slots.appendChild(slot);
  });
  for (let i = state.army.length; i < DATA.maxUnits; i++) {
    const e = document.createElement('div'); e.className = 'slot-empty'; e.setAttribute('aria-hidden', 'true'); slots.appendChild(e);
  }
  const rk = race().key, army = state.army, st = $('armyStatus'), bar = $('capsBar');
  if (!army.length) { st.innerHTML = ''; bar.innerHTML = ''; return; }
  const errors = validate(rk, army);
  st.innerHTML = errors.length
    ? `<span class="ko">Invalid army (${errors.length} issue${errors.length > 1 ? 's' : ''})</span><ul>${errors.map(e => `<li>${esc(e.text)}</li>`).join('')}</ul>`
    : '<span class="ok">✓ Valid army</span>';
  const counts = capCounts(rk, army);
  bar.innerHTML = Object.entries(counts).map(([k, n]) => ({ k, n, cap: effectiveCap(rk, k, army) }))
    .sort((a, b) => (b.n / b.cap) - (a.n / a.cap) || a.k.localeCompare(b.k))
    .map(c => `<span class="cap-chip ${c.n > c.cap ? 'over' : c.n === c.cap ? 'full' : ''}">${esc(capsOf(rk).g[c.k][0])} ${c.n}/${c.cap}</span>`).join('');
}

/* ---------- Rendu : roster (avec alerte de plafond sur les cartes) ---------- */
function capBadge(opt) {
  const rk = race().key, counts = capCounts(rk, state.army);
  let worst = null;
  (capsOf(rk).m[opt.u] || []).forEach(k => {
    const n = counts[k] || 0, cap = effectiveCap(rk, k, state.army);
    // alerte seulement quand le groupe est plein ou qu'il ne reste qu'une place
    if (n > 0 && n >= cap - 1 && (!worst || n / cap > worst.n / worst.cap)) worst = { k, n, cap };
  });
  return worst;
}
function renderRoster() {
  const box = $('sections');
  box.innerHTML = '';
  const byTab = {};
  roster().forEach(c => (byTab[c.t] ||= []).push(c));
  Object.values(byTab).forEach(list => list.sort((a, b) => a.min - b.min || a.n.localeCompare(b.n)));
  DATA.tabs.filter(t => byTab[t.key]).forEach(t => {
    const sec = document.createElement('section');
    const n = byTab[t.key].length;
    sec.innerHTML = `<div class="section-head"><h3 class="serif">${esc(t.name)}</h3><span class="n">${n} card${n > 1 ? 's' : ''}</span></div>`;
    const wrap = document.createElement('div'); wrap.className = 'section-cards';
    byTab[t.key].forEach(card => {
      const el = cardEl(card, { cost: card.min, img: card.img });
      const reasons = card.opts.map(o => addReason(newUnit(card, o)));
      if (reasons.every(Boolean)) { el.classList.add('blocked'); el.title += ' – ' + reasons[0]; }
      const cb = capBadge(card.opts[0]);
      if (cb) el.insertAdjacentHTML('beforeend', `<span class="badge-cap ${cb.n >= cb.cap ? 'full' : ''}" title="${esc(capsOf(race().key).g[cb.k][0])}">${cb.n}/${cb.cap}</span>`);
      if (state.focus && state.focus.kind === 'roster' && state.focus.unit.card === card) el.classList.add('selected');
      el.dataset.cardId = card.id;
      bindClicks(el, () => {
        if (!(state.focus && state.focus.kind === 'roster' && state.focus.unit.card === card)) setFocus({ kind: 'roster', unit: newUnit(card, card.opts[0]) });
      }, () => addUnit(draftFor(card)));
      el.addEventListener('dragstart', e => { drag = { from: 'roster', unit: draftFor(card) }; e.dataTransfer.setData('text/plain', 'roster'); e.dataTransfer.effectAllowed = 'copy'; });
      el.addEventListener('dragend', () => { drag = null; });
      wrap.appendChild(el);
    });
    sec.appendChild(wrap);
    box.appendChild(sec);
  });
}

/* ---------- Panneau de gauche : fiche de l'unité (statistiques calculées depuis les tables du jeu : pvp_unit_stats) ----------
   Comme dans le jeu, une ligne n'apparaît que si elle a un sens pour l'unité (tir, résistances, capacités…). */
function renderUnitStats() {
  const p = $('unitStats');
  if (!state.focus) { p.innerHTML = '<p class="empty">Click a card to inspect the unit.</p>'; return; }
  const { unit } = state.focus, { card, opt } = unit;
  const raw = DATA.stats[opt.u] || [];
  const st = Object.fromEntries(DATA.statCols.map((c, i) => [c, raw[i]]));
  const scale = DATA.statScale;
  const tags = DATA.tags[opt.u] || [];
  const traits = DATA.traits[opt.u] || [];
  const ups = upgradesOf(race().key);
  const pct = (c, v) => Math.min(100, 100 * v / (scale[c] || 1)).toFixed(0);
  const row = (label, c, extra = '') => st[c] == null ? '' :
    `<div class="stat"><span>${label}</span><span class="v">${extra}${fmt(st[c])}</span><span class="bar"><i style="--w:${pct(c, st[c])}%"></i></span></div>`;
  const line = (icon, text) => `<div class="trait">${icon ? `<img src="images/${esc(icon)}" alt="">` : '<span class="ico-empty"></span>'}<span>${text}</span></div>`;
  const section = (title, body) => body ? `<h4 class="block-title serif">${title}</h4>${body}` : '';
  const traitList = kind => traits.filter(t => t[0] === kind).map(t => line(t[2], esc(t[1]))).join('');
  // pour un personnage : capacités, objets et sorts cochés dans la personnalisation, comme dans la fiche du jeu
  const chosen = types => [...unit.sel].filter(k => ups[k] && types.includes(ups[k][1])).map(k => line(ups[k][5], esc(ups[k][0]))).join('');
  const resistances = [['Physical resistance', 'physical_resistance'], ['Spell resistance', 'spell_resistance'],
    ['Missile resistance', 'missile_resistance'], ['Fire resistance', 'fire_resistance'], ['Ward save', 'ward_save']]
    .filter(([, c]) => st[c]).map(([l, c]) => line(null, `${l}: <b>${st[c] > 0 ? '+' : ''}${st[c]}%</b>`)).join('');
  const notes = [st.bonus_v_large ? `+${st.bonus_v_large} vs large` : '', st.bonus_v_infantry ? `+${st.bonus_v_infantry} vs infantry` : '']
    .filter(Boolean).join(' · ');
  p.innerHTML = `
    <h3 class="serif">${esc(opt.n)}</h3>
    <p class="class-line">${opt.ic ? `<img src="images/${esc(opt.ic)}" alt="">` : ''}<span>${esc(card.grp || '')}${opt.fly ? ' · flying' : ''}</span></p>
    ${tags.length ? `<ul class="tags">${tags.map(([n, s]) => `<li class="${s.includes('negative') ? 'neg' : ''} ${s.startsWith('very') ? 'strong' : ''}">${esc(n)}</li>`).join('')}</ul>` : ''}
    ${st.health != null ? `<div class="hp" title="Health"><i style="--w:${pct('health', st.health)}%"></i><span>${fmt(st.health)}</span></div>` : ''}
    ${st.unit_size != null ? `<p class="size-line">Unit size: ${fmt(st.unit_size)}${shownRank(unit) ? ` · Rank ${shownRank(unit)}` : ''}</p>` : ''}
    ${row('Armour', 'armour', st.shield_block_chance ? `<small title="Missile block chance">shield ${st.shield_block_chance}%</small>` : '')}
    ${row('Leadership', 'leadership')}
    ${row('Speed', 'speed')}
    ${row('Melee Attack', 'melee_attack')}
    ${row('Melee Defence', 'melee_defence')}
    ${row('Weapon Strength', 'weapon_strength', st.weapon_ap_damage ? `<small title="Armour-piercing part">AP ${st.weapon_ap_damage}</small>` : '')}
    ${notes ? `<p class="stat-note">${notes}</p>` : ''}
    ${row('Charge Bonus', 'charge_bonus')}
    ${row('Ammunition', 'ammunition')}
    ${row('Range', 'range')}
    ${row('Missile Strength', 'missile_strength')}
    ${section('Passive Abilities', traitList('p'))}
    ${section('Abilities', chosen(['a', 'i']))}
    ${section('Spells', chosen(['s']))}
    ${section('Unit Attributes', traitList('t'))}
    ${section('Resistances', resistances)}`;
}

/* ---------- Panneau de personnalisation (sous l'armée) : affiché seulement pour une unité personnalisable ---------- */
function renderCustom() {
  const box = $('custom');
  if (!state.focus || !isCustomisable(state.focus.unit.card)) { box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  const { kind, unit } = state.focus, { card, opt } = unit;
  const ups = upgradesOf(race().key);
  const reason = kind === 'roster' ? addReason(unit) : '';

  // choix uniques (variantes, monture) : chaque valeur = une autre option de la carte
  const sameOther = (o, k) => DIMS.every(d => d === k || (o[d] ?? '') === (opt[d] ?? ''));
  const targetFor = (k, v) => card.opts.find(o => (o[k] ?? '') === v && sameOther(o, k)) || card.opts.find(o => (o[k] ?? '') === v);
  const carry = next => ({ card, opt: next, rank: unit.rank,
    sel: new Set((next.up || []).filter(x => unit.sel.has(x))) });   // on garde ce qui reste disponible
  const radioGroup = k => {
    const values = [...new Set(card.opts.map(o => o[k] ?? ''))];
    const foot = card.opts.find(o => (o.mount ?? '') === 'On foot' && sameOther(o, 'mount'));
    const rows = values.map(v => {
      const target = targetFor(k, v);
      let price;
      if (k === 'mount') { const d = foot ? target.c - foot.c : 0; price = v !== 'On foot' && d ? fmt(d) : ''; }
      else price = fmt(unitCost(carry(target)));   // comme en jeu : prix total de l'unité avec cette variante
      const label = k === 'mount' && v === 'On foot' ? 'None' : (v || 'None');
      const icon = k === 'lore' ? target.li : k === 'mount' && v !== 'On foot' ? target.mi : null;
      const iconHtml = (k === 'lore' || k === 'mount')
        ? (icon ? `<img class="ico" src="images/${esc(icon)}" alt="">` : '<span class="ico empty"></span>') : '';
      const loreStyle = k === 'lore' && target.lc ? ` lore" style="--lore:#${esc(target.lc)}` : '';
      return `<label class="row${loreStyle}"><input type="radio" name="dim-${k}" data-u="${esc(target.u)}" ${(opt[k] ?? '') === v ? 'checked' : ''}>` +
        `${iconHtml}<span class="lbl">${esc(label)}</span>${price ? `<span class="price">${price}</span>` : ''}</label>`;
    }).join('');
    return `<section class="pz"><h4 class="serif">${esc(dimTitle(card, k))}</h4>${rows}</section>`;
  };
  const variants = DIMS.filter(k => k !== 'mount' && hasChoice(card, k)).map(radioGroup).join('');
  const mounts = hasChoice(card, 'mount') ? radioGroup('mount') : '';
  const current = upgradesCost(unit.sel);
  const sections = UPGRADE_SECTIONS.map(([type, title]) => {
    const keys = (opt.up || []).filter(k => ups[k] && ups[k][1] === type);
    if (!keys.length) return '';
    const all = keys.every(k => unit.sel.has(k));
    const rows = keys.map(k => {
      const [name, , , , , icon] = ups[k];
      const checked = unit.sel.has(k);
      // comme en jeu : le prix n'est affiché que sur les éléments non cochés (surcoût de leur ajout)
      const price = checked ? '' : `<span class="price">${fmt(upgradesCost(new Set([...unit.sel, k])) - current)}</span>`;
      const iconHtml = type === 'i' ? '' : icon ? `<img class="ico" src="images/${esc(icon)}" alt="">` : '<span class="ico empty"></span>';
      return `<label class="row"><input type="checkbox" data-k="${esc(k)}" ${checked ? 'checked' : ''}>${iconHtml}<span class="lbl">${esc(name)}</span>${price}</label>`;
    }).join('');
    return `<section class="pz"><h4 class="serif">${title}</h4>` +
      `<label class="row all"><input type="checkbox" data-all="${type}" ${all ? 'checked' : ''}><span class="lbl">Select All</span></label>${rows}</section>`;
  }).join('');

  box.innerHTML = `
    <div class="custom-head"><h2 class="serif">Unit Customisation · ${esc(card.n)}</h2>
      <button class="act" id="customAction" ${reason ? 'disabled' : ''}>${kind === 'roster' ? 'Add to army' : 'Remove from army'}</button></div>
    <div class="custom-scroll">
      ${reason ? `<p class="custom-msg">${esc(reason)}</p>` : ''}
      <div class="custom-body">${variants}${sections}${mounts}</div>
    </div>`;

  $('customAction').addEventListener('click', () => (kind === 'roster' ? addUnit(unit) : removeUnit(unit)));
  box.querySelectorAll('input[type=radio][data-u]').forEach(r => r.addEventListener('change', () => {
    if (!replaceUnit(unit, carry(card.opts.find(o => o.u === r.dataset.u)))) renderCustom();
  }));
  box.querySelectorAll('input[type=checkbox][data-k]').forEach(c => c.addEventListener('change', () => {
    const sel = new Set(unit.sel); c.checked ? sel.add(c.dataset.k) : sel.delete(c.dataset.k);
    if (!replaceUnit(unit, { ...unit, sel })) renderCustom();
  }));
  box.querySelectorAll('input[type=checkbox][data-all]').forEach(c => c.addEventListener('change', () => {
    const sel = new Set(unit.sel);
    (opt.up || []).filter(k => ups[k] && ups[k][1] === c.dataset.all).forEach(k => (c.checked ? sel.add(k) : sel.delete(k)));
    if (!replaceUnit(unit, { ...unit, sel })) renderCustom();
  }));
}

/* ---------- Panneau de droite : statistiques de la composition ----------
   Chaque ligne : nombre d'unités, nombre de modèles (soldats ; 1 pour une entité unique), coût et part des fonds. */
const isChar = o => o.role === 'lord' || o.role === 'hero';
const BY_ROLE = [   // l'infanterie est détaillée par tier dans « Overall »
  ['Lord', u => u.opt.role === 'lord'], ['Heroes', u => u.opt.role === 'hero'],
  ['Infantry', u => (u.opt.role || '').startsWith('infantry')], ['Ranged', u => u.opt.role === 'ranged'],
  ['Artillery', u => u.opt.role === 'artillery'], ['Cavalry & chariots', u => u.opt.role === 'cavalry'],
  ['Monsters', u => u.opt.role === 'monster'], ['War beasts', u => u.opt.role === 'war_beast'], ['Other', u => (u.opt.role || 'other') === 'other'],
];
const COMP_OVERALL = [   // [libellé, test sur une unité de l'armée]
  ['Flying (non-missile)', u => u.opt.fly && statOf(u.opt.u, 'range') == null],
  ['Flying missiles', u => u.opt.fly && statOf(u.opt.u, 'range') != null],
  ['Short-range missiles (< 150)', u => !isChar(u.opt) && u.opt.role !== 'artillery' && statOf(u.opt.u, 'range') != null && statOf(u.opt.u, 'range') < 150],
  ['Long-range missiles (≥ 150)', u => !isChar(u.opt) && u.opt.role !== 'artillery' && statOf(u.opt.u, 'range') >= 150],
  ['Missile cavalry & chariots', u => u.card.t === 'missile_cavalry_chariots'],
  ['Artillery', u => u.opt.role === 'artillery'],
  ['Cavalry & monstrous cavalry', u => u.opt.role === 'cavalry' && u.card.t !== 'missile_cavalry_chariots'],
  ['Big single entities', u => !isChar(u.opt) && statOf(u.opt.u, 'unit_size') === 1],
  ['Trash infantry (tier I)', u => u.opt.role === 'infantry_light'],
  ['Line infantry (tier II)', u => u.opt.role === 'infantry_line'],
  ['Elite infantry (tier III+)', u => u.opt.role === 'infantry_elite'],
];
const COMP_TRAITS = [
  ['Armour-piercing', u => statOf(u.opt.u, 'is_armour_piercing')],
  ['Anti-large', u => statOf(u.opt.u, 'is_anti_large')],
  ['Magical damage', u => statOf(u.opt.u, 'has_magical_attacks')],
  ['Fire damage', u => statOf(u.opt.u, 'has_flaming_attacks')],
  ['Daemonic or Undead', u => statOf(u.opt.u, 'is_daemonic_or_undead')],
  ['Shields or missile resistance', u => statOf(u.opt.u, 'has_shield_or_missile_resistance')],
];
const COMP_SPEED = [
  ['Fast (speed ≥ 80)', u => statOf(u.opt.u, 'speed') >= 80],
  ['Slow (speed ≤ 30)', u => statOf(u.opt.u, 'speed') != null && statOf(u.opt.u, 'speed') <= 30],
];
function renderComposition() {
  const p = $('composition'), army = state.army;
  const total = spent();
  if (!army.length) { p.innerHTML = '<h3 class="serif">Composition</h3><p class="empty">Add units to see how the army is split.</p>'; return; }
  const models = u => statOf(u.opt.u, 'unit_size') || 0;
  const sum = (list, f) => list.reduce((s, u) => s + f(u), 0);
  const row = (label, pred) => {
    const sel = army.filter(pred), n = sel.length, m = sum(sel, models), c = sum(sel, unitCost);
    const pc = total ? 100 * c / total : 0;
    return `<div class="comp-row${n ? '' : ' zero'}"><div class="top"><b>${esc(label)}</b><span class="pc">${Math.round(pc)}%</span></div>` +
      `<div class="bar"><i style="width:${pc.toFixed(1)}%"></i></div>` +
      `<div class="det">${n} unit${n === 1 ? '' : 's'} · ${fmt(m)} model${m === 1 ? '' : 's'} · ${fmt(c)} gold</div></div>`;
  };
  // indice d'élite : tier moyen pondéré par le coût, sur les unités hors lords et héros
  const troops = army.filter(u => !isChar(u.opt) && statOf(u.opt.u, 'tier'));
  const troopCost = sum(troops, unitCost);
  const elite = troopCost ? sum(troops, u => statOf(u.opt.u, 'tier') * unitCost(u)) / troopCost : 0;
  const level = !troopCost ? '' : elite >= 3.6 ? 'Elite' : elite >= 2.6 ? 'Balanced' : 'Horde';
  const tierBar = [1, 2, 3, 4, 5].map(t => {
    const c = sum(troops.filter(u => statOf(u.opt.u, 'tier') === t), unitCost);
    return c ? `<i class="t${t}" style="width:${(100 * c / troopCost).toFixed(1)}%" title="Tier ${ROMAN[t]}: ${fmt(c)}"></i>` : '';
  }).join('');
  const hp = sum(army, u => statOf(u.opt.u, 'health') || 0);
  const speedAvg = total ? sum(army, u => (statOf(u.opt.u, 'speed') || 0) * unitCost(u)) / total : 0;
  p.innerHTML = `<h3 class="serif">Composition</h3>
    <div class="comp-head"><b>${army.length} / ${DATA.maxUnits} units</b><span class="muted">${fmt(sum(army, models))} models</span></div>
    <p class="sub">${fmt(total)} / ${fmt(DATA.budget)} spent</p>
    <h4 class="block-title serif">Elite index (troops)</h4>
    ${troopCost ? `<div class="elite"><b>${elite.toFixed(1)} <span class="muted">/ 5</span></b><span class="muted">${level}</span></div>
      <div class="tiers">${tierBar}</div><div class="tl">${[1, 2, 3, 4, 5].map(t => `<span><i class="t${t}"></i>${ROMAN[t]}</span>`).join('')}</div>`
      : '<p class="empty">No troops yet.</p>'}
    <h4 class="block-title serif">By role</h4>
    ${BY_ROLE.filter(([, f]) => army.some(f)).map(([label, f]) => row(label, f)).join('')}
    <h4 class="block-title serif">Overall</h4>
    ${COMP_OVERALL.map(([l, f]) => row(l, f)).join('')}
    <h4 class="block-title serif">Damage &amp; traits</h4>
    ${COMP_TRAITS.map(([l, f]) => row(l, f)).join('')}
    <h4 class="block-title serif">Speed</h4>
    <div class="kpis"><div class="kpi"><b>${Math.round(speedAvg)}</b><span>Average speed (by cost)</span></div>
      <div class="kpi"><b>${fmt(sum(army.filter(u => u.opt.fly), unitCost) * 100 / (total || 1))}%</b><span>Flying (share of funds)</span></div></div>
    <div style="margin-top:8px">${COMP_SPEED.map(([l, f]) => row(l, f)).join('')}</div>
    <h4 class="block-title serif">Health</h4>
    <div class="kpis"><div class="kpi"><b>${fmt(hp)}</b><span>Total health</span></div>
      <div class="kpi"><b>${fmt(total ? hp * 1000 / total : 0)}</b><span>Health per 1000 gold</span></div></div>
    <p class="muted" style="margin-top:8px">Infantry: tier I = trash, II = line, III+ = elite. Lords and heroes are left out of the elite index.</p>`;
}

function renderAll() { renderTop(); renderArmy(); renderRoster(); renderUnitStats(); renderCustom(); renderComposition(); }

/* changement d'unité affichée : panneaux et surbrillance mis à jour sans reconstruire les cartes */
function setFocus(focus) {
  state.focus = focus;
  document.querySelectorAll('#sections .card').forEach(el =>
    el.classList.toggle('selected', focus.kind === 'roster' && el.dataset.cardId === focus.unit.card.id));
  document.querySelectorAll('#slots .card').forEach(el =>
    el.classList.toggle('selected', focus.kind === 'army' && state.army[Number(el.dataset.armyIndex)] === focus.unit));
  renderUnitStats(); renderCustom();
}

/* ---------- Glisser-déposer ---------- */
let drag = null;
function setupDragAndDrop() {
  const zone = $('armyZone');
  zone.addEventListener('dragover', e => { if (drag && drag.from === 'roster') { e.preventDefault(); zone.classList.add('drop-ok'); } });
  zone.addEventListener('dragleave', () => zone.classList.remove('drop-ok'));
  zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drop-ok'); if (drag && drag.from === 'roster') addUnit(drag.unit); drag = null; });
  document.addEventListener('dragover', e => { if (drag && drag.from === 'army' && !zone.contains(e.target)) e.preventDefault(); });
  document.addEventListener('drop', e => { if (drag && drag.from === 'army' && !zone.contains(e.target)) { e.preventDefault(); removeUnit(drag.unit); } drag = null; });
}

/* ---------- Race : changement, couleur d'accent et illustration ---------- */
function setRace(i) {
  state.raceIndex = (i + DATA.races.length) % DATA.races.length;
  state.army = []; state.focus = null;
  const r = race(), root = document.documentElement;
  if (r.accent) root.style.setProperty('--accent', '#' + r.accent); else root.style.removeProperty('--accent');
  if (r.race_image) root.style.setProperty('--race-art', `url("images/${r.race_image}")`); else root.style.removeProperty('--race-art');
  renderAll();
}

/* menu déroulant des races (liste personnalisée : une illustration par race) — clavier : ↑ ↓ Entrée Échap */
function setupRacePicker() {
  const btn = $('raceButton'), list = $('raceList');
  let active = 0;
  list.innerHTML = DATA.races.map((r, i) =>
    `<li role="option" class="race-opt" data-i="${i}" id="race-opt-${i}">` +
    `<span class="race-strip" style="background-image:${r.race_image ? `url('images/${esc(r.race_image)}')` : 'none'}"></span>` +
    `<span class="race-label serif">${esc(r.name)}</span></li>`).join('');
  const items = [...list.children];
  const highlight = i => { active = (i + items.length) % items.length; items.forEach((el, j) => el.classList.toggle('active', j === active));
    items[active].scrollIntoView({ block: 'nearest' }); list.setAttribute('aria-activedescendant', items[active].id); };
  const open = () => { list.hidden = false; btn.setAttribute('aria-expanded', 'true');
    items.forEach((el, j) => el.setAttribute('aria-selected', String(j === state.raceIndex))); highlight(state.raceIndex); list.tabIndex = -1; list.focus(); };
  const close = (focusBtn = true) => { list.hidden = true; btn.setAttribute('aria-expanded', 'false'); if (focusBtn) btn.focus(); };
  const choose = i => { close(); if (i !== state.raceIndex) setRace(i); };
  btn.addEventListener('click', () => (list.hidden ? open() : close()));
  items.forEach((el, i) => el.addEventListener('click', () => choose(i)));
  list.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); highlight(active + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); highlight(active - 1); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(active); }
    else if (e.key === 'Escape' || e.key === 'Tab') close(e.key === 'Escape');
  });
  document.addEventListener('click', e => { if (!list.hidden && !e.target.closest('.race-picker')) close(false); });
}

function init() {
  setupRacePicker();
  $('clearArmy').addEventListener('click', () => { state.army = []; state.focus = null; renderAll(); });
  $('footer').textContent = `Data: Total War: WARHAMMER III game files (${DATA.patch.replace('patch_', 'patch ')}), ` +
    `budget ${fmt(DATA.budget)}, up to ${DATA.maxUnits} units. Experience rank costs are estimates. ` +
    `Unofficial fan-made tool, not affiliated with Creative Assembly or Games Workshop.`;
  setupDragAndDrop();
  setRace(0);
}
init();
</script>
